<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="page.css">
<style>
  :root { --column: 28rem; --gap: .35rem; --compact-w: calc((var(--column) - 1.5rem - var(--gap)) / 2); }
  .bag { width: calc(var(--column) - 1.5rem); padding: .75rem; display: grid;
    grid-template-columns: repeat(2, var(--compact-w)); grid-auto-rows: var(--compact-h); gap: var(--gap); }
  .compact { --tone: var(--you, #e3b341); box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
    padding: .3rem .45rem; background: #1c1f24; border: 1px solid #2d333b; border-top: 3px solid var(--tone);
    border-radius: 4px; font-size: .78rem; line-height: 1.3; overflow: hidden; min-width: 0; }
  .compact-head { display: flex; align-items: center; gap: .3rem; color: #8b93a1; height: 1.1rem; flex: none; white-space: nowrap; min-width: 0; }
  .compact-head .icon { color: var(--tone); }
  .compact-mark { width: 1rem; height: 1rem; border-radius: 50%; background: #e040c0; color: white; font-size: .6rem; display: grid; place-items: center; flex: none; }
  .compact-badge { margin-left: auto; font-size: .68rem; color: #8b93a1; overflow: hidden; text-overflow: ellipsis; }
  .compact-badge[data-status] { color: #e3b341; }
  /* (a) two fields, one line each */
  .a .lead, .a .detail { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a .lead { color: #d0d5dc; } .a .detail { color: #8b93a1; }
  /* (b) one flow clamped at two lines */
  .b .flow { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: #d0d5dc; overflow-wrap: anywhere; }
  .b .flow .detail { color: #8b93a1; }
  .lead, .detail, .flow { margin-top: .1rem; }
  h3 { color: #888; font: 12px monospace; margin: .5rem .75rem 0; }
</style></head>
<body style="overflow:auto">
<div id="out"></div>
<script>
const you = { mark: "D" }
const cards = [
 { kind:"text", icon:"✎", lead:"A possible simplification, not done: inside a file's history the host could keep only the newest version and drop the rest.", detail:null, badge:"1" },
 { kind:"text", icon:"✎", lead:"shared fails here. The check \"your writes are versions of the same file\" refuses a rename.", detail:null, badge:"2" },
 { kind:"text", icon:"✎", lead:"Ask Bea about the lane image cache before Friday", detail:null, badge:"3" },
 { kind:"text", icon:"✎", lead:"Plan:", detail:"1. measure the fold", badge:"4" },
 { kind:"text", icon:"✎", lead:"TODO https://github.com/halecraft/pinetrie/blob/main/packages/web/inventory-panel.tsx#L120-L180", detail:null, badge:"5" },
 { kind:"text", icon:"✎", lead:"インベントリのスロットは横長にする 🎒 compact slots are landscape", detail:null, badge:"6" },
 { kind:"reference", icon:"❝", lead:"lists each comment this change makes untrue, and fixes them in the same change", detail:"from Revise the comments", badge:"7" },
 { kind:"reference", icon:"❝", lead:"a quote", detail:"from Inventory design", badge:"8", pending:true },
 { kind:"thread", icon:"≡", banner:true, lead:"Inventory design", detail:"I've written the decision up as a proposed ADR, plus three spikes", badge:"stopped · 3 queued", status:true },
 { kind:"thread", icon:"≡", banner:true, lead:"A very long thread name that someone wrote as a sentence about narrowed ssh hosts", detail:"…", badge:"stopped", status:true },
 { kind:"note-column", icon:"▤", lead:"Things to ask Bea", detail:"3 notes", badge:null },
 { kind:"fact", icon:"※", lead:"Bea moved this thread to Lanes from Topics", detail:null, badge:null },
]
function card(c, mode) {
  const mark = c.banner ? `<span class="compact-mark" style="border-radius:2px;background:#3a6">▦</span>` : (c.kind==="text"||c.kind==="reference") ? `<span class="compact-mark">${you.mark}</span>` : ""
  const head = `<div class="compact-head"><span class="icon">${c.icon}</span>${mark}<span class="compact-badge" ${c.status?"data-status":""}>${c.badge??""}</span></div>`
  const body = mode==="a"
    ? `<div class="lead">${c.lead}</div>${c.detail?`<div class="detail">${c.detail}</div>`:""}`
    : `<div class="flow">${c.lead}${c.detail?` <span class="detail">${c.detail}</span>`:""}</div>`
  return `<div class="compact ${mode}" data-kind="${c.kind}">${head}${body}</div>`
}
const H = new URLSearchParams(location.search).get("h") ?? "4.1rem"
document.documentElement.style.setProperty("--compact-h", H)
document.getElementById("out").innerHTML = ["a","b"].map(m => `<h3>${m} h=${H}</h3><div class="bag">${cards.map(c=>card(c,m)).join("")}</div>`).join("")
</script></body></html>
