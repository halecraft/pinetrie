pki:
  ca: /neb/ca.crt
  cert: /neb/tether.crt
  key: /neb/tether.key
static_host_map:
  "192.168.100.1": ["s299-neb-tether:4242"]
lighthouse:
  am_lighthouse: true
  interval: 10
  hosts: []
listen:
  host: 0.0.0.0
  port: 4242
punchy:
  punch: true
tun:
  dev: nebula1
logging:
  level: info
firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    - port: any
      proto: any
      group: members
