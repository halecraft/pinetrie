<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pineta</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      button { padding: .5rem .9rem; border-radius: 6px; border: 0; background: #2f6feb; color: #fff; font: inherit; cursor: pointer; }
      .actions button, .tools button { background: none; border: 1px solid #3a3f48; color: #aaa;
        padding: .05rem .45rem; border-radius: 3px; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        background: #14161a; color: #e6e6e6;
      }
      #root { display: contents; }
      #top { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: .75rem 1rem .5rem; border-bottom: 1px solid #23272e; }
      h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: #8b93a1; margin: 0 0 .25rem; }
      .meta { font-size: 12px; color: #6f7784; }


      /* A tab per root (ADR-0029): Archive, the open roots, new tabs, and ＋. The
         list scrolls; Archive and ＋ stay put. */
      #tabs { display: flex; align-items: stretch; gap: .25rem; padding: .3rem .5rem 0;
        border-bottom: 1px solid #23272e; font-size: .8rem; }
      .tab-list { display: flex; gap: .25rem; flex: 1; min-width: 0; overflow-x: auto; }
      .tab-list .tab-archive { position: sticky; left: 0; z-index: 1; }
      .tab-wrap { display: inline-flex; align-items: center; flex: 0 0 auto; }
      .tab { display: inline-flex; gap: .35rem; align-items: center; max-width: 16rem;
        padding: .3rem .6rem; border-radius: 6px 6px 0 0; background: #1b1e24; color: #aab4c3;
        border: 1px solid #23272e; border-bottom: 0; }
      .tab[aria-selected="true"] { background: #23272e; color: #e6e6e6; }
      .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* A root tab while it is renamed: the tab's box, holding a field. */
      .tab-title-input { width: 14rem; padding: .3rem .6rem; border-radius: 6px 6px 0 0;
        background: #23272e; color: #e6e6e6; border: 1px solid #3a3f48; border-bottom: 0;
        font: inherit; }
      .tab-title-input[aria-invalid="true"] { border-color: #d66; }
      .tab.running::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #9ecbff; animation: pulse 1s ease-in-out infinite; }
      .tab.archived .tab-label { text-decoration: line-through; color: #777; }
      .tab-new { font-style: italic; }
      .tab-close, .tab-menu { padding: 0 .35rem; background: none; color: #aaa; }
      .tab-more { position: relative; }
      /* ⋯ on the tab you are on, and on another while hovered or focused. Hidden
         with visibility, which keeps the tab's width from jumping. */
      .tab-wrap .tab-more { visibility: hidden; }
      .tab-wrap:hover .tab-more, .tab-wrap:focus-within .tab-more, .tab-more.open,
      .tab-wrap:has(> .tab[aria-selected="true"]) .tab-more { visibility: visible; }
      .popover { position: absolute; z-index: 4; top: 100%; right: 0; display: flex;
        flex-direction: column; min-width: 12rem; padding: .25rem; background: #1b1e24;
        border: 1px solid #3a3f48; border-radius: 6px; }
      .menu-items { display: flex; flex-direction: column; }
      .menu button { text-align: left; background: none; color: #ddd; padding: .3rem .5rem; }
      .menu button:disabled { color: #777; cursor: default; }
      .menu .why { font-size: .75rem; }
      /* The add tab looks like an empty tab: its split button is the tab. */
      .add-tab { position: relative; display: inline-flex; flex: 0 0 auto; }
      .add-tab button { padding: .3rem .6rem; background: none; color: #aab4c3;
        border: 1px dashed #3a3f48; border-bottom: 0; border-radius: 0; }
      .add-tab .add-agent { border-radius: 6px 0 0 0; }
      .add-tab .add-menu { border-radius: 0 6px 0 0; border-left: 0; }
      .add-tab button:hover { color: #e6e6e6; background: #1b1e24; }
      .connecting { margin: 1rem; color: #6f7784; }

      /* The workspace: the rail (E, everything in this root) beside the columns (paths). */
      #workspace { position: relative; flex: 1; display: flex; min-height: 0; }
      .rail { position: relative; flex: 0 0 auto; min-width: 3rem; padding: 0 .25rem;
        overflow-y: auto; border-right: 1px solid #23272e; }
      /* Centred in the rail, whose min-width is wider than a narrow tree. */
      .rail-tree { position: relative; width: fit-content; margin: 0 auto; isolation: isolate; }
      /* A new tab's rail: where its first message will be drawn. */
      .rail-start { position: absolute; width: 8px; height: 8px; box-sizing: border-box;
        border: 1.5px solid #777; border-radius: 50%; }
      .rail-dot { position: absolute; width: 8px; height: 8px; padding: 0; border-radius: 50%; }
      /* A running lane: a rail tip, a column's mark. */
      .pulse { animation: pulse 1s ease-in-out infinite; }
      /* A run of uneventful messages: a capsule, its length and fill inline. */
      .rail-stretch { position: absolute; width: 8px; padding: 0; border: 1.5px solid; border-radius: 4px;
        box-sizing: border-box; }
      /* What a column shows (ADR-0058): an outline in its colour around the
         whole dots and capsules in view, under them, and a tick over a capsule
         it shows only part of. Their place and colours are inline. The tree
         is its own stacking context, so the outline's -1 stays above the rail. */
      .rail-view { position: absolute; z-index: -1; width: 14px; box-sizing: border-box;
        border: 1.5px solid; border-radius: 7px; pointer-events: none; }
      .rail-tick { position: absolute; z-index: 1; border-radius: 1px; pointer-events: none; }
      .rail-anchor { position: absolute; }
      /* Others here (ADR-0024): the ring is inline style; several share a count. */
      .here-count { position: absolute; top: -9px; left: 7px; font-size: 9px; line-height: 1;
        color: #ddd; pointer-events: none; }
      @keyframes pulse { 50% { transform: scale(1.8); } }
      /* An unsent card of yours (ADR-0048): a round pip in your colour, with a
         dark ring so it reads against a tab or a track. */
      .card-pip { display: inline-block; flex: 0 0 auto; width: 6px; height: 6px;
        border-radius: 50%; box-shadow: 0 0 0 1.5px #14161a; }
      /* On a rail dot: centred, with no ring, so the track's colour shows
         around it. 4 px in the 8 px dot keeps it on whole pixels. */
      .rail-dot > .card-pip { position: absolute; left: 2px; top: 2px; width: 4px; height: 4px;
        box-shadow: none; }
      .archive-row { position: relative; }
      .archive-row > .card-pip { position: absolute; top: .6rem; right: .5rem; }
      #strip { flex: 1; display: flex; overflow-x: auto; min-width: 0; }

      /* A column is its thread, and while you review its offer, the review
         beside it (ADR-0047). The thread is one path, on its own scroll, its
         composer at its foot. Its width and min-width: 0 hold it at 28rem: a
         flex item's automatic minimum is its widest unbreakable line,
         so a long line in a code block or a tool's output would widen the
         column (S37). */
      .column { flex: 0 0 auto; min-width: 0; display: flex; min-height: 0;
        border-right: 1px solid #23272e; }
      .column-thread { flex: 0 0 28rem; width: 28rem; min-width: 0; display: flex;
        flex-direction: column; min-height: 0; }
      /* A column's header (ADR-0040): who works in it, then where it forks. Every
         track colour in a column is `var(--track)`, set inline (`trackStyle`). */
      .column-head { display: flex; flex-direction: column; gap: .2rem; padding: .4rem .75rem;
        border-top: 4px solid var(--track, #777); font-size: .8rem; color: #aaa; }
      .column-head button { background: none; border: none; border-radius: 0; padding: 0; color: inherit; }
      .column-head .head-row { display: flex; gap: .5rem; align-items: center; min-height: 1.5rem; }
      .column-head .head-space { flex: 1; }
      /* The thread's base has new work it lacks (`behindMark`). */
      .column-head .thread-behind { color: #e8c07a; cursor: help; }
      /* The mark before a thread's name: a fixed square holding the star, and
         the banner, a sprite on black, laid over it, so the name never moves
         when one arrives. The same mark, larger, heads the thread's details.
         `isolation` on what holds it makes that element's own background what
         `lighten` blends with, so the sprite's black goes. A new banner fades
         in once loaded, and the star out; the one there as the column mounts
         does not. The head row is the square's height, with or without one. */
      .column-head { isolation: isolate; background: #14161a; }
      .column-head .agent-name { flex: 0 0 auto; display: inline-flex; align-items: center;
        gap: .3rem; white-space: nowrap; font-size: .85rem;
        font-weight: 600; color: var(--track, #9ecbff); }
      .thread-mark { position: relative; flex: 0 0 auto; width: 1.5rem; height: 1.5rem;
        display: inline-flex; align-items: center; justify-content: center; }
      .thread-mark .thread-star { transition: opacity .6s ease-in; }
      .thread-mark .thread-star[data-gone] { opacity: 0; }
      .thread-mark .banner { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; pointer-events: none; mix-blend-mode: lighten; }
      .thread-mark .banner[data-fade] { opacity: 0; transition: opacity .6s ease-in; }
      .thread-mark .banner[data-fade][data-loaded] { opacity: 1; }
      /* A named thread's name opens and closes its details (ADR-0073). Its
         chevron is drawn here, so the name's text is the mark and the name. */
      .column-head button.agent-name::after { content: "▸"; display: inline-block;
        font-size: .7rem; color: #6f7784; transition: transform .15s ease-out, color .15s; }
      .column-head button.agent-name[aria-expanded="true"]::after { transform: rotate(90deg); }
      .column-head button.agent-name:hover::after,
      .column-head button.agent-name:focus-visible::after { color: #e6e6e6; }
      .column-head .agent-name.pending { color: #8b93a1; font-weight: 400; font-style: italic; }
      /* The mark pulses while its lane runs. Scaled as far as a rail dot, the
         square would cover the name's first letter; at 1.25 it stays within
         the .3rem gap. */
      .column-head .thread-mark.pulse { animation-name: pulse-mark; }
      @keyframes pulse-mark { 50% { transform: scale(1.25); } }
      /* A thread's details, under its header and outside it, so they are no
         drag handle and their text can be selected (ADR-0073). The mark spins
         in as they are opened, and at each click; a new animation name each
         time (`data-spin` odd or even) restarts it. */
      .thread-details { flex: 0 0 auto; display: flex; gap: .75rem; align-items: center;
        padding: .5rem .75rem .6rem; isolation: isolate; background: #14161a;
        border-bottom: 1px solid #23272e; font-size: .8rem; color: #aaa; }
      .thread-details-icon { flex: 0 0 auto; padding: 0; border: none; border-radius: 0;
        background: none; color: var(--track, #9ecbff); cursor: pointer; }
      .thread-details .thread-mark { width: 7rem; height: 7rem; font-size: 4rem; }
      /* Its pulse while the lane runs stays within the .75rem gap. */
      .thread-details .thread-mark.pulse { animation-name: pulse-mark-large; }
      @keyframes pulse-mark-large { 50% { transform: scale(1.08); } }
      .thread-details-icon[data-spin="odd"] { animation: thread-spin-a .7s cubic-bezier(.34, 1.56, .64, 1); }
      .thread-details-icon[data-spin="even"] { animation: thread-spin-b .7s cubic-bezier(.34, 1.56, .64, 1); }
      @keyframes thread-spin-a { from { transform: scale(.25) rotate(0); }
        60% { transform: scale(1.15) rotate(360deg); } to { transform: scale(1) rotate(360deg); } }
      @keyframes thread-spin-b { from { transform: scale(.25) rotate(0); }
        60% { transform: scale(1.15) rotate(360deg); } to { transform: scale(1) rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .thread-details-icon[data-spin] { animation: none; }
      }
      .thread-details-facts { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
      .thread-details-name { font-size: 1rem; font-weight: 600; color: var(--track, #9ecbff); }
      .thread-details-behind { color: #e8c07a; }
      .thread-details-start { align-self: flex-start; padding: 0; border: none; border-radius: 0;
        background: none; color: #7f8896; text-decoration: underline; cursor: pointer; }
      .thread-details-start:hover, .thread-details-start:focus-visible { color: #d0d4da; }
      .column-head .origin { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; text-align: left; font-size: .75rem; color: #7f8896; }
      .column-head .origin:hover, .column-head .origin:focus-visible { color: #d0d4da; }
      .column-head .origin-dot { display: inline-block; width: 8px; height: 8px; margin-right: .35rem;
        border-radius: 50%; vertical-align: middle; background: var(--track, #777); }
      .column-head .close { padding: 0 .2rem; font-size: 1rem; line-height: 1; color: #8b93a1; }
      .column-head .close:hover, .column-head .close:focus-visible { color: #e6e6e6; }
      /* A header is its column's drag handle (use-column-drag.ts), once there are
         two columns. */
      .column-head { user-select: none; }
      #strip:has(> .column + .column) .column-head { cursor: grab; }
      .column-head .grip { border: none; padding: 0 .1rem; color: #6f7784; cursor: grab;
        font-size: .9rem; line-height: 1; }
      .column-head .grip:hover, .column-head .grip:focus-visible { color: #e6e6e6; }
      /* The header holds the pointer while it drags, so its cursor is the one shown. */
      #strip[data-reordering] .column[data-dragging] .column-head,
      #strip[data-reordering] .column[data-dragging] .grip { cursor: grabbing; }
      .column[data-dragging] { position: relative; z-index: 2; background: #14161a; opacity: .92;
        box-shadow: 0 0 0 1px #3a3f48, 0 8px 24px rgb(0 0 0 / .5); }
      .column[data-drop="before"] { box-shadow: inset 3px 0 0 #8ab4f8; }
      .column[data-drop="after"] { box-shadow: inset -3px 0 0 #8ab4f8; }
      .avatars { display: inline-flex; gap: 2px; flex: 0 0 auto; }
      /* The circle. `.avatar` has no rule: it marks a person shown here, which
         the browser suite counts. */
      .initial { display: inline-block; width: 16px; height: 16px; border-radius: 50%;
        font-size: 10px; line-height: 16px; text-align: center; color: #111; font-weight: 600; }
      .initial.more { background: #3a3f48; color: #bbb; }
      /* What became of a column's files, above its composer (ADR-0040): the offer
         in your repo (ADR-0038), or where a lane that works directly writes. */
      .work { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem;
        padding: .35rem .75rem; border-top: 1px solid #23272e; font-size: .75rem; color: #8b93a1; }
      .work .work-space { flex: 1; }
      .work button { padding: .1rem .5rem; font-size: .75rem; background: none;
        border: 1px solid #444; color: #bbb; }
      .work .offer-line { color: #a8d8a8; }
      /* An offer that can be reviewed: its line is the review's toggle, and
         its bookmark copies; both read as text, not as the strip's buttons. */
      .work button.offer-line, .work button.offer-bookmark { border: none; padding: 0;
        font-size: inherit; text-align: left; cursor: pointer; }
      .work button.offer-line { font-size: .75rem; }
      .work button.offer-line::after { content: " ▸"; }
      .work button.offer-line[aria-expanded="true"]::after { content: " ◂"; }
      .work button.offer-line:hover { text-decoration: underline; }
      .work[data-state="nothing"] .offer-line, .work[data-state="taken"] .offer-line,
      .work[data-state="running"] .offer-line, .work[data-state="busy"] .offer-line { color: #8b93a1; }
      .work[data-state="conflicts"] .offer-line,
      .work[data-state="needs_you"] .offer-line { color: #e8c07a; }
      .work .offer-bookmark { font-family: ui-monospace, monospace; font-size: .7rem; color: #6f7784;
        user-select: text; }
      .work button.offer-bookmark:hover { color: #aab; }
      /* Your last offer command: in flight, or why it was not done. */
      .work .offer-note { font-size: .75rem; color: #8b93a1; }
      .work .offer-note[data-acting="said"] { color: #e8c07a; }
      .work button:disabled { opacity: .5; cursor: progress; }

      /* The review of a column's offer (ADR-0047): a file list (for more than one
         file), and one scroll of every file's diff, each file's head pinned
         while its diff shows. */
      .review { flex: 0 0 auto; width: clamp(40rem, 100vw - 36rem, 64rem); min-height: 0;
        display: flex; flex-direction: column; border-top: 4px solid var(--track, #777);
        border-left: 1px solid #23272e; font-size: .8rem; --diff-line: 1.35em; }
      .review-head { display: flex; align-items: center; gap: .6rem; padding: .4rem .75rem;
        border-bottom: 1px solid #23272e; color: #aaa; outline: none; }
      .review-head .review-line { color: #a8d8a8; }
      .review-head .review-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: #ddd; }
      .review-head .review-close { margin-left: auto; background: none; border: none; color: #8b93a1;
        font-size: 1rem; padding: 0 .25rem; }
      .review-body { flex: 1; display: flex; min-height: 0; }
      .review-list { flex: 0 0 12rem; overflow: auto; padding: .4rem 0; border-right: 1px solid #23272e; }
      .review-list-title { padding: .4rem .6rem .15rem; color: #8b93a1; font-size: .72rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file { display: block; width: 100%; text-align: left; background: none; border: none;
        border-radius: 0; padding: .15rem .6rem; color: #bbb; font-family: ui-monospace, monospace;
        font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file:hover { background: #1c2027; }
      .review-list-file[aria-current] { background: #222833; color: #eee; }
      .review-list-file[data-conflicts] { color: #e8c07a; }
      .review-diffs { flex: 1; min-width: 0; overflow: auto; }
      .review-description { padding: .6rem .75rem; border-bottom: 1px solid #23272e; }
      .review-revision-title { color: #ddd; font-weight: 600; }
      .review-revision-body { margin-top: .3rem; white-space: pre-wrap; color: #aab; }
      .review-file { border-bottom: 1px solid #23272e; }
      .review-file-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center;
        gap: .5rem; padding: .3rem .75rem; background: #181b20; border-bottom: 1px solid #23272e;
        font-family: ui-monospace, monospace; font-size: .75rem; }
      .review-file-head .review-path { color: #ddd; overflow-wrap: anywhere; }
      .review-toggle { background: none; border: none; padding: 0; color: #8b93a1; width: 1em; }
      .review-letter { color: #8b93a1; }
      .review-file[data-letter="A"] .review-letter { color: #a8d8a8; }
      .review-file[data-letter="D"] .review-letter { color: #e89a9a; }
      .review-lines { color: #8b93a1; }
      .review-flag { padding: 0 .35rem; border-radius: 3px; background: #3a3220; color: #e8c07a;
        font-family: system-ui, sans-serif; font-size: .7rem; }
      .review-show { margin: .4rem .75rem; background: none; border: 1px solid #444; color: #bbb;
        font-size: .75rem; }
      .review-note { padding: .4rem .75rem; color: #8b93a1; font-style: italic; }
      .review-placeholder { font-size: .75rem; }
      .review-diff { margin: 0; padding: .3rem 0; overflow-x: auto; white-space: pre;
        font-family: ui-monospace, monospace; font-size: .75rem; line-height: var(--diff-line); }
      .review-diff span { display: block; padding: 0 .75rem; min-width: max-content; }
      .review-diff [data-kind="add"] { color: #a8d8a8; background: #1b2a1d; }
      .review-diff [data-kind="del"] { color: #e89a9a; background: #2d1c1e; }
      .review-diff [data-kind="hunk"] { color: #7fa7d8; }
      .review-diff [data-kind="meta"] { color: #6f7784; }
      .work .offer-take { border-color: #4f7a4f; color: #a8d8a8; }
      .work .offer-update { border-color: #6b5a33; color: #e8c07a; }
      .work .work-warning { color: #e8c07a; }
      .column-body { flex: 1; overflow-y: auto; padding: .75rem 1.75rem .75rem .75rem; }

      .msg { position: relative; margin: 0 0 1rem; }
      .role { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f7784; }
      .msg.chat .role { color: #e0c080; }
      .msg.assistant .role { color: #9ecbff; }
      .msg.land .role, .msg.update .role, .msg.stack .role { color: #c8a8e8; }
      /* A message that compelled the agent: it was asked, so a reply follows. */
      .msg.asked { border-left: 2px solid #9ecbff; padding-left: .75rem; }
      /* Where a lane starts on the path: a rule with the lane's name on it. */
      .lane-join { display: flex; align-items: center; gap: .5rem; margin: 0 0 .6rem;
        font-size: .8rem; color: #9ecbff; }
      .lane-join::after { content: ""; flex: 1; border-top: 1px solid #2f4a66; }
      /* Message text is markdown (markdown.ts). pre-line shows a soft break as
         a line break, as people type them; the tree has no whitespace between
         blocks for it to show. */
      .text { white-space: pre-line; margin-top: .2rem; overflow-wrap: anywhere; }
      .text > :first-child { margin-top: 0; }
      .text > :last-child { margin-bottom: 0; }
      .text p, .text ul, .text ol, .text blockquote, .text pre, .text table { margin: .45rem 0; }
      .text ul, .text ol { padding-left: 1.3rem; }
      .text li > p { margin: .2rem 0; }
      .text h1, .text h2, .text h3, .text h4, .text h5, .text h6 { margin: .7rem 0 .3rem; font-size: 1rem; }
      .text h1 { font-size: 1.15rem; }
      .text h2 { font-size: 1.07rem; }
      .text blockquote { margin-left: 0; padding-left: .6rem; border-left: 2px solid #3a3f48; color: #aab4c3; }
      .text code { font-family: ui-monospace, monospace; font-size: .85em; padding: .05rem .25rem;
        background: #11141a; border-radius: 3px; }
      .text pre { padding: .45rem; overflow-x: auto; white-space: pre; background: #11141a;
        border: 1px solid #23272e; }
      .text pre code { padding: 0; font-size: .78rem; background: none; }
      /* `break-word`, not the text's `anywhere`: `anywhere` lets a word break
         when the table sizes its columns, so a narrow column splits its words
         ("Wo/rki/ng") rather than the table scrolling. */
      .text table { border-collapse: collapse; display: block; overflow-x: auto;
        overflow-wrap: break-word; }
      .text th, .text td { padding: .15rem .45rem; border: 1px solid #23272e; }
      .text a { color: #9ecbff; }
      .text hr { border: 0; border-top: 1px solid #23272e; }
      /* An image is capped at the column's width. Its width and height
         attributes (a pasted image's stored size) keep its box's shape while
         it loads (ADR-0042). */
      .text img { max-width: 100%; height: auto; vertical-align: middle; }
      img.blob-image { cursor: zoom-in; border: 1px solid #23272e; }
      /* A clicked blob image, over the page (blob-image.tsx). Its img has no
         width or height attributes, so it draws at its own size; the maxima
         shrink it to fit and keep its ratio. */
      dialog.image-viewer { padding: 0; border: 0; background: none; max-width: none; max-height: none;
        cursor: zoom-out; }
      dialog.image-viewer::backdrop { background: rgb(0 0 0 / .8); }
      dialog.image-viewer img { display: block; max-width: 95vw; max-height: 95vh; }
      .text img { max-width: 100%; }
      .text .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .fork-dot { display: inline-block; width: 10px; height: 10px; padding: 0; margin-left: .4rem;
        border-radius: 50%; vertical-align: middle; background: var(--track); }
      .actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
        margin-top: .25rem; font-size: .75rem; }
      /* One row over the message's top right. Its last button, →, sits in the
         right gutter, since what it opens appears to the right: `right` is
         less than .column-body's right padding. Hidden, it keeps its box, so
         where → is can be measured before a hover. */
      .tools { position: absolute; top: -.2rem; right: -1.6rem; display: flex; gap: .3rem;
        font-size: .72rem; background: #1b1e24; padding: .15rem; border-radius: 4px;
        visibility: hidden; }
      .msg:hover .tools, .msg:focus-within .tools { visibility: visible; }
      .tools .branch { color: #9ecbff; }
      /* The row stretches it to the word buttons' height; flex centres its icon. */
      .tools .copy { display: flex; align-items: center; }
      /* The column's side padding hovers its message too: the → sits in the right
         gutter, and a hidden → takes no hover to bring itself back. ::before for
         the right, so .tools (later in the tree) paints over it and takes the
         click; .column-body's padding sets both widths. */
      .msg::before, .msg::after { content: ""; position: absolute; top: 0; bottom: 0; }
      .msg::before { left: 100%; width: 1.75rem; }
      .msg::after { right: 100%; width: .75rem; }
      /* A streaming reply's mark: a 2px bar in the gutter, 4px clear of the
         text. A border image drawn 6px outside the box (the outset) takes no
         width, so live text wraps as its entry will (S35). Not ::before:
         .msg's ::before and ::after are its hover gutters. Not a shadow: an
         outer shadow meets the box's edge, and masking the gap left a
         hairline there. */
      .msg.streaming {
        border-image: linear-gradient(transparent 4px, #9ecbff 4px, #9ecbff calc(100% - 4px),
          transparent 0) 0 0 0 1 / 0 0 0 2px / 0 0 0 6px; }
      .msg.streaming { opacity: .75; }
      /* A tool call: what it touched, its status, and its result folded away
         (`rowSize`, tool-row.ts). */
      .tool { margin: .3rem 0; font-size: .8rem; }
      .tool summary { cursor: pointer; color: #aab4c3; }
      /* Not a scroll container: a long path wraps, or it runs out of the column. */
      .tool-label { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
      .tool[data-status="ok"] .tool-status { color: #7bd88f; }
      .tool[data-status="error"] .tool-status { color: #f28b82; }
      .tool-output { overflow: auto; margin: .3rem 0 0; padding: .4rem;
        background: #11141a; border: 1px solid #23272e; white-space: pre-wrap; font-size: .75rem; }
      /* Block: a ResizeObserver sees an inline element as 0 × 0. */
      .tool-output-text { display: block; }
      /* A result's images, in place of its text (`toolBody`). A capped row
         caps an image at 10rem tall, as it caps output, through its width. */
      .tool-images { margin: .3rem 0 0; }
      .tool-images img { display: block; max-width: 100%; height: auto; margin-bottom: .3rem; }
      .tool[data-size="capped"] .tool-images img { max-width: min(100%, calc(10rem * var(--ratio))); }
      /* A cut label, uncut, in its place while the row is open. */
      .tool-label-whole { display: none; font-family: ui-monospace, monospace;
        white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%;
        overflow: auto; vertical-align: top; }
      /* A row the work opened: about 15rem at most, command and output
         together, so it fits in a column with text left above it. A heredoc
         or a build log can run to hundreds of lines; the reader's click
         shows them whole (data-size="full"). */
      .tool[data-size="capped"] .tool-label-whole { max-height: 5rem; }
      .tool[data-size="capped"] .tool-output { max-height: 10rem; }
      .tool[open] > summary:has(.tool-label-whole) .tool-label { display: none; }
      .tool[open] > summary .tool-label-whole { display: inline-block; }
      .tool.live { opacity: .85; }
      /* A command the work opened, still running: a ring, absolutely placed, so
         it takes no layout and the column does not move when it comes or goes.
         A call that ends within REVEAL_MS is never revealed, so it never shows
         one. The ring reaches 1rem past the row's right edge, into the gutter
         .column-body keeps for → (1.75rem, against .75rem on the left), so it
         sits as far from the column's right edge as from its left. */
      .tool.live[data-revealed] { position: relative; }
      .tool.live[data-revealed]::after { content: ""; position: absolute;
        inset: -4px calc(-1rem - 4px) -4px -4px; border: 1px solid transparent;
        border-radius: 3px; pointer-events: none;
        animation: tool-working 1.2s ease-in-out infinite; }
      @keyframes tool-working { 0%, 100% { border-color: rgb(232 192 122 / .3); }
        50% { border-color: rgb(232 192 122 / .9); } }
      /* Where the agent's next text will appear, while its lane runs. Zero
         height, so its margins collapse through it: as the content's last
         child or between two messages, it leaves the gap, and the height the
         follow rule reads (`.column-content`'s own), as they were. The shadow
         draws it 2px tall, and the transform lifts it to the middle of the
         gap above; neither takes layout. */
      .working-line { height: 0; width: 3rem; margin: 0 auto; box-shadow: 0 0 0 1px #9ecbff;
        transform: translateY(-.5rem); animation: pulse-line 1.2s ease-in-out infinite; }
      @keyframes pulse-line { 50% { opacity: .35; transform: translateY(-.5rem) scaleX(1.6); } }
      /* The outline says a command is running; the line would say the model is. */
      .column-content:has(.tool.live[data-revealed]) .working-line { visibility: hidden; }
      /* Asks (ADR-0056). A column's density: outline, story or raw. */
      .column-head .density { display: inline-flex; flex: 0 0 auto; border: 1px solid #2c313a;
        border-radius: 4px; overflow: hidden; }
      .column-head .density-choice { padding: 0 .35rem; border-radius: 0; background: none;
        color: #6f7784; font-size: .68rem; line-height: 1.4; }
      .column-head .density-choice[aria-pressed="true"] { background: #23272e; color: #e6e6e6; }
      /* An ask's work, folded to one line, or opened under it. */
      .ask-fold, .ask-line { display: block; width: 100%; margin: 0 0 1rem; padding: .1rem .5rem;
        text-align: left; font-size: .78rem; background: none; color: #8b93a1;
        border-left: 2px solid #2f4a66; border-radius: 0; }
      .ask-fold[aria-expanded="true"] { margin-bottom: .6rem; }
      .ask-fold-head .ask-fold { padding-right: 4.5rem; }

      .ask-fold:hover, .ask-line:hover { color: #e6e6e6; }
      .ask-fold-head { position: relative; }
      /* The files an ask changed: opens their review beside the column. */
      .ask-files { position: absolute; top: .05rem; right: 0; padding: 0 .4rem; font-size: .72rem;

      .ask-line.running { animation: pulse-ask 1.2s ease-in-out infinite; color: #9ecbff; }
      @keyframes pulse-ask { 50% { opacity: .45; } }
      /* A model's words about an ask's work (ADR-0075): its headline, marked

      .ask-headline { color: #c9d3dc; }
      .ask-headline::before { content: "✦ "; color: #6f7784; }
      .ask-digest { margin: -.6rem 0 1rem; padding: .1rem .5rem .1rem 1rem; font-size: .78rem;

         bar takes no room and the content's height is as it was. */
      .ask-bar-slot { position: sticky; top: -.75rem; height: 0; z-index: 2; }
      .ask-bar { position: absolute; top: 0; left: 0; right: 0; overflow: hidden;

      /* Where this device last left the thread. Zero height, as the working

      /* In outline, the running ask's own line says the agent works. */

      .stop { margin: 0 .75rem .35rem; padding: .1rem .6rem; font-size: .75rem;

      .composer { padding: .5rem .75rem .75rem; border-top: 1px solid #23272e; }

      .archive-empty, .archive-hint { color: #6f7784; }
      .archive-preview { flex: 1; display: flex; min-width: 0; }
      .preview { flex: 1; display: flex; min-height: 0; }
      .preview-strip { display: flex; min-width: 0; }
      .typing { font-size: .75rem; color: #8b93a1; margin-bottom: .3rem; font-style: italic; }
      .card-editor .input { display: block; width: 100%; resize: vertical; }
      /* Commands matching what is typed (ADR-0036), above the input. */

      .card-editor .command-name { color: #d2a8ff; }

      .unqueue { padding: .05rem .45rem; font-size: .72rem; }

      .take { padding: .05rem .45rem; font-size: .72rem; cursor: grab; }

      dialog.restore-ask::backdrop { background: rgb(0 0 0 / .5); }
      /* A card's command (ADR-0055), above its box: what sending it does first. */

      .card-command-clear { padding: 0 .3rem; font-size: .72rem; background: none; border: none; color: #8b93a1; }
      /* Where a new thread's agent works, said as what it does to your files:

      .where-line .where-menu { flex: 1; min-width: 0; display: flex; }

      .where-menu .where-trigger:hover { color: #e6e6e6; }

      .where-menu .where-caret { flex: none; margin-left: .35rem; }
      .where-line:has(.where-fork-conflict) { flex-direction: column; }
      .where-fork-conflict { font-size: .72rem; color: #d0a15f; }
      .menu-section:has([role="menuitemradio"]) [role="menuitem"] { padding-left: 1.6rem; }
      .where-menu .where-detail { display: block; margin-left: 1.1rem; font-size: .72rem; color: #8b93a1; }
      .status { font-size: .75rem; color: #d0a15f; }
      input, .card-editor textarea {
        flex: 1; padding: .5rem .7rem; border-radius: 6px;
        border: 1px solid #2c313a; background: #1b1e24; color: inherit; font: inherit;
      }

      /* A branch's header and its fork dots share a colour slot; hovering one
         outlines the other. */
      #strip:has(.column-head[data-color="0"]:hover) .fork-dot[data-color="0"],
      #strip:has(.fork-dot[data-color="0"]:hover) .column-head[data-color="0"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="1"]:hover) .fork-dot[data-color="1"],
      #strip:has(.fork-dot[data-color="1"]:hover) .column-head[data-color="1"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="2"]:hover) .fork-dot[data-color="2"],
      #strip:has(.fork-dot[data-color="2"]:hover) .column-head[data-color="2"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="3"]:hover) .fork-dot[data-color="3"],
      #strip:has(.fork-dot[data-color="3"]:hover) .column-head[data-color="3"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="4"]:hover) .fork-dot[data-color="4"],
      #strip:has(.fork-dot[data-color="4"]:hover) .column-head[data-color="4"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="5"]:hover) .fork-dot[data-color="5"],
      #strip:has(.fork-dot[data-color="5"]:hover) .column-head[data-color="5"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="6"]:hover) .fork-dot[data-color="6"],
      #strip:has(.fork-dot[data-color="6"]:hover) .column-head[data-color="6"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="7"]:hover) .fork-dot[data-color="7"],
      #strip:has(.fork-dot[data-color="7"]:hover) .column-head[data-color="7"] { outline: 2px solid var(--track); outline-offset: 2px; }
      #strip:has(.column-head[data-color="pending"]:hover) .fork-dot[data-color="pending"],
      #strip:has(.fork-dot[data-color="pending"]:hover) .column-head[data-color="pending"] { outline: 2px solid var(--track); outline-offset: 2px; }
      /* The header's right: who is here, what needs you (ADR-0069), the
         project, then your inventory and you. Nothing here animates: the tab,
         the column and the rail show where the agent works. */
      .header-right { display: flex; align-items: center; gap: .75rem; }
      .here { display: flex; align-items: center; gap: .25rem; }
      .here-trigger, .activity-trigger, .me-trigger { display: inline-flex; align-items: center; gap: .3rem;
        padding: .1rem .3rem; background: none; color: #ddd; border-radius: 999px; }
      .here-trigger .initial, .activity-trigger .initial, .me-trigger .initial { width: 22px; height: 22px;
        line-height: 22px; font-size: 12px; }
      .activity-trigger .agent-mark { background: #3a3f48; color: #aab4c3; }
      .activity-trigger:has(.activity-working) .agent-mark { background: #9ecbff; color: #111; }
      .activity-working { font-size: .75rem; color: #aab4c3; }
      .activity-badge { min-width: 1.1rem; padding: 0 .3rem; border-radius: 999px; background: #f28b82;
        color: #111; font-size: .72rem; font-weight: 600; text-align: center; }
      .line-trigger { padding: .15rem .6rem; font-size: .8rem; background: none; color: #ddd;
        border: 1px solid #3a3f48; border-radius: 999px; }
      .header-tools { display: flex; align-items: center; gap: .5rem; margin-left: .75rem; }
      .menu-heading { margin: .1rem .5rem .3rem; font-size: .75rem; color: #8b93a1; }
      /* A later section of a menu: its heading under a rule. Notes say how
         things stand, as text, not as items. A choice's ✓ keeps its column
         whether it is chosen or not, so the names line up. */
      .menu-section { display: flex; flex-direction: column; }
      fieldset.menu-section { min-width: 0; margin: 0; padding: 0; border: 0; }
      .menu-section + .menu-section { margin-top: .25rem; padding-top: .25rem;
        border-top: 1px solid #2c313a; }
      /* A first section that only names its menu draws nothing, and no rule
         under it. */
      .menu-section:empty { display: none; }
      .menu-section:empty + .menu-section { margin-top: 0; padding-top: 0; border-top: 0; }
      .menu-note { margin: .1rem .5rem .3rem; font-size: .75rem; color: #aab4c3; }
      .menu .menu-check { display: inline-block; width: 1.1rem; color: #9ecbff; }
      .here-thread, .inbox-row { display: flex; flex-direction: column; max-width: 22rem; }
      .here-root, .inbox-who { font-size: .72rem; color: #8b93a1; }
      .here-name { font-family: ui-monospace, monospace; font-size: .75rem; color: #d7dde6; }
      .here-at, .inbox-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .inbox-row.unseen .inbox-text { font-weight: 600; }
      .inbox-row.unseen .inbox-who::before { content: "● "; color: #f28b82; font-size: .6rem; }
      /* Who you are, asked once per device before anything connects (ADR-0037). */
      #identity { display: flex; flex-direction: column; gap: .6rem; width: 20rem;
        margin: 20vh auto 0; padding: 1.25rem; border: 1px solid #23272e; border-radius: 8px;
        background: #1b1e24; }
      #identity label, #profile label { display: flex; justify-content: space-between;
        align-items: center; gap: .5rem; }
      #identity input, #profile input { flex: 1; padding: .3rem .45rem; }
      #identity button { align-self: flex-end; padding: .3rem .9rem; }
      .identity-problem, .name-problem { margin: 0; color: #f0a0a0; font-size: .85rem; }
      .name-handle { margin: 0; color: #8b93a1; font-size: .8rem; }
      /* Your profile, from your avatar at the header's right. */
      .profile { min-width: 18rem; padding: .5rem .75rem .75rem; gap: .5rem; }
      .profile form { display: flex; flex-direction: column; gap: .4rem; }
      .profile-save { align-self: flex-end; padding: .25rem .8rem; }
      .profile-email { margin: .25rem 0 0; padding-top: .5rem; border-top: 1px solid #2a2e36;
        color: #aab4c3; font-size: .85rem; }
      .not-you { align-self: flex-start; background: none; border: 0; padding: 0; color: #8b93a1;
        font: inherit; font-size: .8rem; cursor: pointer; }
      .not-you:hover { color: #d6dce5; text-decoration: underline; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
