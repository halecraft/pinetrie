<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pineta</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      button { padding: .5rem .9rem; border-radius: 6px; border: 0; background: #2f6feb; color: #fff; font: inherit; cursor: pointer; }
      .actions button, .tools button { background: none; border: 1px solid #3a3f48; color: #aaa;
        padding: .05rem .45rem; border-radius: 3px; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        background: #14161a; color: #e6e6e6;
      }
      #root { display: contents; }
      #top { padding: .75rem 1rem .5rem; border-bottom: 1px solid #23272e; }
      h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: #8b93a1; margin: 0 0 .25rem; }
      .meta { font-size: 12px; color: #6f7784; }
      #name { width: 9rem; padding: .2rem .4rem; }

      /* The workspace: the rail (E, everything) beside the columns (paths). */
      #workspace { flex: 1; display: flex; min-height: 0; }
      #rail { position: relative; flex: 0 0 auto; min-width: 3rem; padding-right: .5rem;
        overflow-y: auto; border-right: 1px solid #23272e; }
      /* How a thread at the root begins: a declared purpose, before any message. */
      .start { display: flex; gap: .5rem; padding: .75rem; }
      .column > .start { justify-content: center; border-top: 1px solid #23272e; }
      .rail-tree { position: relative; }
      /* A new thread at the root: above the root threads, where the tree starts. */
      .new-thread { display: block; margin: .3rem auto .4rem .1rem; padding: 0 .45rem;
        background: none; border: 1px solid #3a3f48; color: #aaa; }
      #rail .start { flex-direction: column; margin: 0 0 .5rem; }
      #rail .start button { font-size: .72rem; padding: .15rem .4rem; }
      .rail-dot { position: absolute; width: 8px; height: 8px; padding: 0; border-radius: 50%; }
      .rail-dot.pulse { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.8); } }
      #strip { flex: 1; display: flex; overflow-x: auto; min-width: 0; }

      /* A column is one path, on its own scroll, its composer at its foot. */
      .column { flex: 0 0 28rem; display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid #23272e; }
      .column-head { display: flex; gap: .5rem; align-items: center; padding: .4rem .75rem;
        border-top: 3px solid #777; font-size: .8rem; color: #aaa; }
      .column-head .fork-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .column-head button { padding: .1rem .5rem; font-size: .75rem; background: none;
        border: 1px solid #444; color: #bbb; }
      .column-body { flex: 1; overflow-y: auto; padding: .75rem 1.75rem .75rem .75rem; }

      .msg { position: relative; margin: 0 0 1rem; transition: opacity .2s; }
      /* While the agent replies: what it reads stays; the rest steps back. */
      .msg.dim { opacity: .35; }
      .role { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f7784; }
      .msg.chat .role { color: #e0c080; }
      .msg.assistant .role { color: #9ecbff; }
      /* A message that compelled the agent: it was asked, so a reply follows. */
      .msg.asked { border-left: 2px solid #9ecbff; padding-left: .75rem; }
      .joined { margin: 0 0 .5rem; font-size: .8rem; color: #9ecbff; }
      .text { white-space: pre-wrap; margin-top: .2rem; }
      .fork-dot { display: inline-block; width: 10px; height: 10px; padding: 0; margin-left: .4rem;
        border-radius: 50%; vertical-align: middle; }
      .actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
        margin-top: .25rem; font-size: .75rem; }
      .tools { position: absolute; top: -.2rem; right: 0; display: none; gap: .3rem;
        font-size: .72rem; background: #1b1e24; padding: .15rem; border-radius: 4px; }
      .msg:hover .tools, .msg:focus-within .tools { display: flex; }
      /* In the right margin: what it opens appears to the right. */
      .msg .branch { position: absolute; top: 1.1rem; right: -1.5rem; padding: 0 .3rem;
        background: none; border: 1px solid #3a3f48; color: #9ecbff; visibility: hidden; }
      .msg:hover .branch, .msg:focus-within .branch { visibility: visible; }
      .cites, .cited-by { color: #9ecbff; }
      .streaming { opacity: .75; border-left: 2px solid #9ecbff; padding-left: .75rem; }
      /* Waiting for the thread's lane: not in the tree yet. */
      .msg.waiting { opacity: .5; border-left: 2px dashed #777; padding-left: .75rem; }
      /* Someone else asked first: the sender chooses to wait or to branch. */
      .conflict { font-size: .8rem; color: #d0a15f; margin-bottom: .35rem; }
      .conflict button { padding: .1rem .5rem; font-size: .75rem; }

      .composer { padding: .5rem .75rem .75rem; border-top: 1px solid #23272e; }
      .compose-row { display: flex; gap: .5rem; }
      .status { font-size: .75rem; color: #d0a15f; }
      input {
        flex: 1; padding: .5rem .7rem; border-radius: 6px;
        border: 1px solid #2c313a; background: #1b1e24; color: inherit; font: inherit;
      }

      /* A branch's header and its fork dots share a colour slot; hovering one
         outlines the other. */
      #strip:has(.column-head[data-color="0"]:hover) .fork-dot[data-color="0"],
      #strip:has(.fork-dot[data-color="0"]:hover) .column-head[data-color="0"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="1"]:hover) .fork-dot[data-color="1"],
      #strip:has(.fork-dot[data-color="1"]:hover) .column-head[data-color="1"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="2"]:hover) .fork-dot[data-color="2"],
      #strip:has(.fork-dot[data-color="2"]:hover) .column-head[data-color="2"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="3"]:hover) .fork-dot[data-color="3"],
      #strip:has(.fork-dot[data-color="3"]:hover) .column-head[data-color="3"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="4"]:hover) .fork-dot[data-color="4"],
      #strip:has(.fork-dot[data-color="4"]:hover) .column-head[data-color="4"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="5"]:hover) .fork-dot[data-color="5"],
      #strip:has(.fork-dot[data-color="5"]:hover) .column-head[data-color="5"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="6"]:hover) .fork-dot[data-color="6"],
      #strip:has(.fork-dot[data-color="6"]:hover) .column-head[data-color="6"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="7"]:hover) .fork-dot[data-color="7"],
      #strip:has(.fork-dot[data-color="7"]:hover) .column-head[data-color="7"] { outline: 2px solid currentColor; outline-offset: 2px; }
      #strip:has(.column-head[data-color="pending"]:hover) .fork-dot[data-color="pending"],
      #strip:has(.fork-dot[data-color="pending"]:hover) .column-head[data-color="pending"] { outline: 2px solid currentColor; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.tsx"></script>
  </body>
</html>
