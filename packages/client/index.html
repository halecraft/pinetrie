<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pineta — walking skeleton</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 2rem; max-width: 46rem; margin-inline: auto;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        background: #14161a; color: #e6e6e6;
      }
      h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: #8b93a1; margin: 0 0 .25rem; }
      .meta { font-size: 12px; color: #6f7784; margin-bottom: 1.5rem; }
      .meta code { color: #9ecbff; }
      .msg { margin: 0 0 1rem; }
      .role { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f7784; }
      .msg.user .role { color: #7bd88f; }
      .msg.assistant .role { color: #9ecbff; }
      button { padding: .6rem 1rem; border-radius: 6px; border: 0; background: #2f6feb; color: #fff; font: inherit; cursor: pointer; }
      /* The spine is what is in context, so it stays at full contrast.
         Branches are dimmed AND labelled: dimming alone would not survive
         greyscale or low vision. */
      .fork { margin: -0.5rem 0 1rem; font-size: 0.85rem; }
      .fork > button { background: none; border: 1px dashed #555;
        color: #bbb; cursor: pointer; padding: 0.15rem 0.5rem;
        border-radius: 3px; }
      .branches { margin: 0.5rem 0 0 1rem; padding-left: 0.75rem;
        border-left: 2px dotted #555; opacity: 0.6; }
      .outside { color: #d0a15f; font-style: italic; margin-bottom: 0.35rem; }
      .branch { display: flex; gap: 0.6rem; align-items: center;
        margin-bottom: 0.25rem; }
      .branch .branch-id { font-family: monospace; color: #888; }
      /* References: a semantic link, shown beside the causal spine. */
      .refs { display: flex; gap: 0.5rem; align-items: center;
        margin-top: 0.25rem; font-size: 0.8rem; }
      .refs .cite { background: none; border: 1px solid #444; color: #aaa;
        padding: 0.05rem 0.45rem; border-radius: 3px; cursor: pointer; }
      .cites, .cited-by { color: #9ecbff; }
      #reading { margin: 0 0 1rem; color: #d0a15f; font-size: 0.85rem; }
      .msg.chat .role { color: #e0c080; }
      /* A message that compelled the agent: it was asked, so a reply follows. */
      .msg.asked { border-left: 2px solid #9ecbff; padding-left: .75rem; }
      .joined { margin: 0 0 .5rem; font-size: .8rem; color: #9ecbff; }
      #thread, #audience { font-size: .85rem; color: #aaa; margin: 0 0 .5rem; }
      #name { width: 9rem; }
      .text { white-space: pre-wrap; margin-top: .2rem; }
      #streaming { opacity: .75; border-left: 2px solid #9ecbff; padding-left: .75rem; margin-bottom: 1rem; }
      form { display: flex; gap: .5rem; margin-top: 1.5rem; }
      input {
        flex: 1; padding: .6rem .75rem; border-radius: 6px;
        border: 1px solid #2c313a; background: #1b1e24; color: inherit; font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.tsx"></script>
  </body>
</html>
