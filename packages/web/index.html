<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pine·trie</title>
    <style>
      /* --page is the paper the columns are on, --chrome the darker list and
         footer around it (ADR-0081, ADR-0122). --surface is whatever a thing
         sits on, set by its context: a ring that must read as a gap around a
         dot uses it. --side is the sidebar's width, which the footer's own
         cell shares, so the two split along one line; folded to icons, it is
         3rem (ADR-0088). */
      :root { color-scheme: dark; --page: #14161a; --chrome: #0e1013; --edge: #23272e;
        --on: #c9d1d9; --surface: var(--page); --side: 15rem; }
      @media (width < 56rem) { :root { --side: 11.5rem; } }
      /* The sidebar folded to icons (ADR-0088), at any window width. */
      :root[data-list="icons"] { --side: 3rem; }
      * { box-sizing: border-box; }
      button { padding: .5rem .9rem; border-radius: 6px; border: 0; background: #2f6feb; color: #fff; font: inherit; cursor: pointer; }
      .actions button, .tools button { background: none; border: 1px solid #3a3f48; color: #aaa;
        padding: .05rem .45rem; border-radius: 3px; }
      /* The sidebar down the left, the stage beside it, and the footer under
         both (ADR-0122). There is no header: the columns start at the top. */
      body {
        margin: 0; height: 100vh; display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        background: var(--page); color: #e6e6e6;
      }
      #root { display: contents; }
      /* The identity form's title. */
      h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: #8b93a1; margin: 0 0 .25rem; }


      /* The sidebar (ADR-0122): your open roots, in your order, then new tabs,
         then ＋. Its right edge is an inset shadow: a descendant's fill paints
         over it, so the root you are on, filled with the page's colour,
         opens into the page beside it (ADR-0081, turned sideways). An item is
         its wrap: its button, ⋯ and ×. At rest it has no fill, and its
         border is there but clear, so it takes the same room chosen or not. */
      #sidebar { grid-column: 1; grid-row: 1; display: flex; flex-direction: column;
        gap: .6rem; min-height: 0; overflow-y: auto; padding: .6rem 0 .6rem .45rem;
        background: var(--chrome); --surface: var(--chrome);
        box-shadow: inset -1px 0 0 var(--edge); font-size: .8rem; --item-control: 1.4rem; }
      .sidebar-items { display: flex; flex-direction: column; gap: .1rem; }
      .sidebar-item { position: relative; display: flex; align-items: center; min-width: 0;
        border: 1px solid transparent; border-left-width: 2px; border-right: 0;
        border-radius: 6px 0 0 6px; }
      .sidebar-item:hover { background: #1b1e24; --surface: #1b1e24; }
      /* The root you are on is the page's colour, and covers the list's edge. */
      .sidebar-item[data-selected] { background: var(--page); --surface: var(--page);
        border-color: var(--edge); border-left-color: var(--on); }
      .open-root { flex: 1; display: flex; gap: .35rem; align-items: center;
        min-width: 0; padding: .45rem .6rem; border-radius: 0; background: none;
        color: #aab4c3; text-align: left; }
      .sidebar-item[data-selected] > .open-root {
        color: #e6e6e6; font-weight: 600; }
      /* A title wraps to two lines before it is cut. */
      .open-label { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
      .open-root.archived .open-label { text-decoration: line-through; color: #777; }
      /* A root while it is renamed: a field in the item's place. */
      .open-title-input { flex: 1; min-width: 0; margin: .2rem .3rem; padding: .2rem .5rem;
        border-radius: 4px; background: #1b1e24; color: #e6e6e6; border: 1px solid #3a3f48;
        font: inherit; }
      .open-title-input[aria-invalid="true"] { border-color: #d66; }
      .open-close, .open-menu { width: var(--item-control); padding: 0; background: none; color: #aaa; }
      .open-more { position: relative; }
      /* ⋯ and × only while an item is hovered or focused, the one you are on
         too. Hidden with visibility, and laid over the label's end in the
         colour behind them, so the label keeps its room. */
      .sidebar-item .open-more, .sidebar-item .open-close { visibility: hidden; }
      .sidebar-item > .open-close { position: absolute; top: 0; bottom: 0; right: 0;
        background: var(--surface); }
      .sidebar-item > .open-more { position: absolute; top: 0; bottom: 0;
        right: var(--item-control); display: flex; background: var(--surface); }
      .sidebar-item:hover .open-more, .sidebar-item:focus-within .open-more, .open-more.open,
      .sidebar-item:hover .open-close, .sidebar-item:focus-within .open-close { visibility: visible; }
      /* Where a root dragged to the end of the sidebar lands. */
      .open-end { display: block; min-height: .6rem; }
      /* Where a dragged root would land (use-drag.ts): a line in the gap
         above the item it goes before, or at the list's end. */
      .sidebar-item[data-root-drop]::before { content: ""; position: absolute; z-index: 1;
        left: 0; right: 0; top: calc(-.05rem - 1.5px); height: 3px; border-radius: 2px;
        background: #8ab4f8; pointer-events: none; }
      .open-end[data-root-drop] { box-shadow: inset 0 3px 0 #8ab4f8; }
      /* A root's status, before its label (ADR-0077), in the sidebar and on the
         board. Working is a still ring: it needs nothing from you, so it does
         not move. What needs you is a filled amber dot, the colour of the
         "since you were here" line the root opens onto, which pulses three
         times as it arrives and then stays; what is worth a read is a dim one.
         Done is a ✓ that fades. */
      .signal { flex: 0 0 auto; display: inline-block; width: 6px; height: 6px;
        box-sizing: border-box; border-radius: 50%; }
      .signal[data-signal="running"] { border: 1.5px solid #9ecbff; }
      .signal[data-signal="needs-you"] { background: #e0c080; box-shadow: 0 0 0 1.5px var(--surface); }
      .signal[data-signal="worth-a-read"] { background: #e0c080; opacity: .45; }
      .signal[data-signal="needs-you"][data-arrived] { animation: arrive .6s ease-in-out 3; }
      @keyframes arrive { 50% { transform: scale(1.8); } }
      .signal[data-signal="done"] { width: .7rem; height: auto; overflow: hidden; border-radius: 0;
        font-size: .7rem; line-height: 1; color: #9ecbff;
        animation: done-fade 3s ease-out forwards; }
      /* It ends taking no room, so nothing need be redrawn to remove it. */
      @keyframes done-fade { to { opacity: 0; width: 0; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
      /* In the top layer, placed inline (`popover.tsx`). `margin`, `inset`,
         `color` and `overflow` undo the browser's own `[popover]` rules. */
      .popover { display: flex; flex-direction: column; min-width: 12rem; margin: 0; inset: auto;
        padding: .25rem; overflow-y: auto; color: inherit; background: #1b1e24;
        border: 1px solid #3a3f48; border-radius: 6px; }
      .menu-items { display: flex; flex-direction: column; }
      .menu button { text-align: left; background: none; color: #ddd; padding: .3rem .5rem; }
      .menu button:disabled { color: #777; cursor: default; }
      .menu .why { font-size: .75rem; }
      /* ＋: a split button, dashed, at the foot of the sidebar and of each
         board column, and past a canvas's last column. */
      .add-root { position: relative; display: inline-flex; flex: 0 0 auto; align-self: flex-start;
        margin-left: .2rem; }
      /* Its own two buttons: its menu's items are a menu's. */
      .add-root > button, .add-root .add-menu { padding: .3rem .6rem; background: none; color: #aab4c3;
        border: 1px dashed #3a3f48; border-radius: 0; }
      .add-root .add-agent { border-radius: 6px 0 0 6px; }
      .add-root .add-menu { border-radius: 0 6px 6px 0; border-left: 0; }
      .add-root > button:hover, .add-root .add-menu:hover { color: #e6e6e6; background: #1b1e24; }
      /* The control at the list's foot that folds it, or shows its titles. */
      .list-fold { margin-top: auto; align-self: flex-start; padding: .2rem .55rem; background: none;
        color: #6f7784; font-size: .9rem; }
      .list-fold:hover, .list-fold:focus-visible { color: #e6e6e6; }

      /* The sidebar folded (ADR-0088): an icon per item, the item's own menu
         behind a right-click, ＋ over its ▾. The item's wrap, its selected
         fill and its left edge are the full list's. */
      :root[data-list="icons"] #sidebar { padding-left: .3rem; }
      .open-icon-menu { position: relative; flex: 1; min-width: 0; display: flex; }
      .open-icon-menu > .open-root { justify-content: center;
        padding: .35rem 0; }
      .open-icon { position: relative; flex: 0 0 auto; display: inline-flex; width: 1.75rem;
        height: 1.75rem; }
      .open-sprite, .open-initials { width: 100%; height: 100%; border-radius: 6px; }
      /* A banner is drawn on black, which lighten takes out; a built-in icon's
         ground is transparent, and lighten would take out its dark outline. */
      .open-sprite { object-fit: contain; }
      .open-sprite[data-kind="banner"] { mix-blend-mode: lighten; }
      .open-initials { display: flex; align-items: center; justify-content: center; color: var(--page);
        font-size: .68rem; font-weight: 700; font-style: normal; line-height: 1; letter-spacing: .02em; }
      .open-root.archived .open-initials { opacity: .45; }
      /* A new tab: hollow, as its rail's dot is, until its first message. */
      /* Its signals sit on its corners: the working ring round it. */
      .open-icon .signal { position: absolute; top: -3px; right: -3px; }
      .open-icon .signal[data-signal="running"] { inset: -4px; width: auto; height: auto; border-radius: 9px; }
      .open-icon .signal[data-signal="done"] { top: -.35rem; right: -.2rem; font-size: .6rem; }
      /* Fixed, as the list scrolls and would clip them (packages/web/TECHNICAL.md, Gotchas). */
      .open-tip, .open-rename { position: fixed; z-index: 5; }
      .open-tip { display: flex; flex-direction: column; gap: .25rem; max-width: 20rem;
        padding: .3rem .55rem; background: #1b1e24; border: 1px solid #3a3f48; border-radius: 6px;
        color: #e6e6e6; font-size: .8rem; pointer-events: none; }
      .open-rename { display: flex; width: 16rem; }
      .add-root.folded { flex-direction: column; align-items: stretch; align-self: center;
        margin-left: 0; }
      .add-root.folded .add-more { display: flex; }
      .add-root.folded .add-menu { flex: 1; }
      .add-root.folded .add-agent { border-radius: 6px 6px 0 0; }
      .add-root.folded .add-menu { border-radius: 0 0 6px 6px; border-left: 1px dashed #3a3f48;
        border-top: 0; padding: 0 .6rem; }
      :root[data-list="icons"] .list-fold { align-self: center; }
      .connecting, .nothing-here { margin: 1rem; color: #6f7784; }

      /* The stage: the rail (E, everything in this root) beside the columns
         (paths), under a search's bar while one is open (ADR-0101). */
      #stage { grid-column: 2; grid-row: 1; position: relative; display: flex;
        flex-direction: column; min-height: 0; min-width: 0; background: var(--page); }
      .stage-row { flex: 1; display: flex; min-height: 0; min-width: 0; }
      /* The rail and, on a task, the 🔍 above it. As wide around a new tab's
         rail as around a task's, so the strip keeps its place. */
      .rail-side { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid #23272e; }
      .rail { position: relative; flex: 1; min-height: 0; min-width: 3rem; padding: 0 .25rem;
        overflow-y: auto; }
      /* Centred in the rail, whose min-width is wider than a narrow tree. */
      .rail-tree { position: relative; width: fit-content; margin: 0 auto; isolation: isolate; }
      /* A new tab's rail: where its first message will be drawn. */
      .rail-start { position: absolute; width: 8px; height: 8px; box-sizing: border-box;
        border: 1.5px solid #777; border-radius: 50%; }
      .rail-dot { position: absolute; width: 8px; height: 8px; padding: 0; border-radius: 50%; }
      /* A running lane: a rail tip, a column's mark. */
      .pulse { animation: pulse 1s ease-in-out infinite; }
      /* A run of uneventful messages: a capsule, its length and fill inline. */
      .rail-stretch { position: absolute; width: 8px; padding: 0; border: 1.5px solid; border-radius: 4px;
        box-sizing: border-box; }
      /* What a column shows (ADR-0058): an outline in its colour around the
         whole dots and capsules in view, under them, and a tick over a capsule
         it shows only part of. Their place and colours are inline. The tree
         is its own stacking context, so the outline's -1 stays above the rail. */
      .rail-view { position: absolute; z-index: -1; width: 14px; box-sizing: border-box;
        border: 1.5px solid; border-radius: 7px; pointer-events: none; }
      .rail-tick { position: absolute; z-index: 1; border-radius: 1px; pointer-events: none; }
      .rail-anchor { position: absolute; }
      /* A fork to a thread on another canvas or in an inventory (ADR-0117). */
      .rail-stub { position: absolute; transform: translateY(-50%); padding: 0 .2rem;
        font-size: .65rem; white-space: nowrap; color: #8b93a1; background: var(--page);
        border: 1px dashed #3a3f48; border-radius: 3px; cursor: pointer; }
      .rail-stub:disabled { cursor: default; opacity: .7; }
      /* Others here (ADR-0024): the ring is inline style; several share a count. */
      .here-count { position: absolute; top: -9px; left: 7px; font-size: 9px; line-height: 1;
        color: #ddd; pointer-events: none; }
      @keyframes pulse { 50% { transform: scale(1.8); } }
      /* An unsent card of yours (ADR-0048): a round pip in your colour, ringed in
         the colour behind it (--surface) so it reads on whatever it sits on. */
      .signal[data-signal="unsent"] { box-shadow: 0 0 0 1.5px var(--surface); }
      /* On a rail dot: centred, with no ring, so the track's colour shows
         around it. 4 px in the 8 px dot keeps it on whole pixels. */
      .rail-dot > .signal[data-signal="unsent"] { position: absolute; left: 2px; top: 2px; width: 4px; height: 4px;
        box-shadow: none; }
      /* The pane's container: `100cqw` is the strip's width (S109). */
      #strip { flex: 1; display: flex; overflow-x: auto; min-width: 0;
        container-type: inline-size; }

      /* A column is its thread, and its pane beside it while you have opened
         something there (ADR-0078). The thread is one path, on its own scroll, its
         composer at its foot. Its width and min-width: 0 hold it at 28rem: a
         flex item's automatic minimum is its widest unbreakable line,
         so a long line in a code block or a tool's output would widen the
         column (S37). */
      .column { flex: 0 0 auto; min-width: 0; display: flex; min-height: 0;
        border-right: 1px solid #23272e; }
      .column-thread { flex: 0 0 28rem; width: 28rem; min-width: 0; display: flex;
        flex-direction: column; min-height: 0; }
      /* A card two columns wide (ADR-0116): its width is everyone's. */
      .column[data-width="2"] .column-thread { flex-basis: 56rem; width: 56rem; }
      /* A column's header (ADR-0040): who works in it, then where it forks. Every
         track colour in a column is `var(--track)`, set inline on `.column`
         (`trackStyle`), and on the narrow pane's dialog, which is outside it. */
      .column-head { display: flex; flex-direction: column; gap: .2rem; padding: .4rem .75rem;
        border-top: 4px solid var(--track, #777); font-size: .8rem; color: #aaa; }
      .column-head button { background: none; border: none; border-radius: 0; padding: 0; color: inherit; }
      .column-head .head-row { display: flex; gap: .5rem; align-items: center; min-height: 1.5rem; }
      .column-head .head-space { flex: 1; }
      /* The thread's base has new work it lacks (`behindMark`). */
      .column-head .thread-behind { color: #e8c07a; cursor: help; }
      /* The mark before a thread's name: a fixed square holding the star, and
         the thread's icon laid over it, so the name never moves when one
         arrives. The same mark, larger, heads the thread's details, and at
         the header's size, its folded strip.
         A banner is a sprite on black: `isolation` on what holds it makes that
         element's own background what `lighten` blends with, so the black
         goes. A built-in icon has a transparent ground and is not blended,
         since lighten would take out its dark outline. A new icon fades
         in once loaded, and the star out; the one there as the column mounts
         does not. The head row is the square's height, with or without one.
         That isolation would trap a menu opened in the header under the
         column's messages, were it not in the top layer: the browser check
         "a column's ⋯ opens over the column's messages" relies on it. */
      .column-head { isolation: isolate; background: var(--page); }
      .column-head .agent-name { flex: 0 0 auto; display: inline-flex; align-items: center;
        gap: .3rem; white-space: nowrap; font-size: .85rem;
        font-weight: 600; color: var(--track, #9ecbff); }
      .thread-mark, .note-column-mark { position: relative; flex: 0 0 auto; width: 1.5rem; height: 1.5rem;
        display: inline-flex; align-items: center; justify-content: center; }
      .thread-mark .thread-star { transition: opacity .6s ease-in; }
      .thread-mark .thread-star[data-gone] { opacity: 0; }
      .thread-mark .thread-icon { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; pointer-events: none; }
      .thread-mark .thread-icon[data-kind="banner"] { mix-blend-mode: lighten; }
      .thread-mark .thread-icon[data-fade] { opacity: 0; transition: opacity .6s ease-in; }
      .thread-mark .thread-icon[data-fade][data-loaded] { opacity: 1; }
      /* A named thread's name opens and closes its details (ADR-0073). Its
         chevron is drawn here, so the name's text is the mark and the name. */
      .column-head button.agent-name::after { content: "▸"; display: inline-block;
        font-size: .7rem; color: #6f7784; transition: transform .15s ease-out, color .15s; }
      .column-head button.agent-name[aria-expanded="true"]::after { transform: rotate(90deg); }
      .column-head button.agent-name:hover::after,
      .column-head button.agent-name:focus-visible::after { color: #e6e6e6; }
      .column-head .agent-name.pending { color: #8b93a1; font-weight: 400; font-style: italic; }
      /* The mark pulses while its lane runs. Scaled as far as a rail dot, the
         square would cover the name's first letter; at 1.25 it stays within
         the .3rem gap. */
      .column-head .thread-mark.pulse { animation-name: pulse-mark; }
      @keyframes pulse-mark { 50% { transform: scale(1.25); } }
      /* A thread's details, under its header and outside it, so they are no
         drag handle and their text can be selected (ADR-0073). The mark spins
         in as they are opened, and at each click; a new animation name each
         time (`data-spin` odd or even) restarts it. */
      .thread-details { flex: 0 0 auto; display: flex; gap: .75rem; align-items: center;
        padding: .5rem .75rem .6rem; isolation: isolate; background: var(--page);
        border-bottom: 1px solid #23272e; font-size: .8rem; color: #aaa; }
      .thread-details-icon { flex: 0 0 auto; padding: 0; border: none; border-radius: 0;
        background: none; color: var(--track, #9ecbff); cursor: pointer; }
      .thread-details .thread-mark { width: 7rem; height: 7rem; font-size: 4rem; }
      /* Magnified, a built-in icon's 32×32 pixels stay square: ×7 at 2× DPR.
         Shrunk or scaled under ×2 elsewhere, it is smoothed. */
      .thread-details .thread-mark .thread-icon[data-kind="built-in"] { image-rendering: pixelated; }
      /* Its pulse while the lane runs stays within the .75rem gap. */
      .thread-details .thread-mark.pulse { animation-name: pulse-mark-large; }
      @keyframes pulse-mark-large { 50% { transform: scale(1.08); } }
      .thread-details-icon[data-spin="odd"] { animation: thread-spin-a .7s cubic-bezier(.34, 1.56, .64, 1); }
      .thread-details-icon[data-spin="even"] { animation: thread-spin-b .7s cubic-bezier(.34, 1.56, .64, 1); }
      @keyframes thread-spin-a { from { transform: scale(.25) rotate(0); }
        60% { transform: scale(1.15) rotate(360deg); } to { transform: scale(1) rotate(360deg); } }
      @keyframes thread-spin-b { from { transform: scale(.25) rotate(0); }
        60% { transform: scale(1.15) rotate(360deg); } to { transform: scale(1) rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .thread-details-icon[data-spin] { animation: none; }
      }
      .thread-details-facts { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
      .thread-details-name { font-size: 1rem; font-weight: 600; color: var(--track, #9ecbff); }
      .thread-details-behind { color: #e8c07a; }
      .thread-details-start { align-self: flex-start; padding: 0; border: none; border-radius: 0;
        background: none; color: #7f8896; text-decoration: underline; cursor: pointer; }
      .thread-details-start:hover, .thread-details-start:focus-visible { color: #d0d4da; }
      .column-head .origin { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; text-align: left; font-size: .75rem; color: #7f8896; }
      .column-head .origin:hover, .column-head .origin:focus-visible { color: #d0d4da; }
      /* A column's path above its own thread, folded (ADR-0117). */
      .column-head .agents-row { padding: .1rem 0; font-size: .75rem; color: #8b93a1; }
      .column-head .earlier { display: block; padding: .1rem 0; font-size: .75rem; color: #8b93a1;
        background: none; border: 0; cursor: pointer; }
      .column-head .earlier:hover, .column-head .earlier:focus-visible { color: #d0d4da; }
      .column-head .origin-dot { display: inline-block; width: 8px; height: 8px; margin-right: .35rem;
        border-radius: 50%; vertical-align: middle; background: var(--track, #777); }
      .column-head .close { padding: 0 .2rem; font-size: 1rem; line-height: 1; color: #8b93a1; }
      .column-head .close:hover, .column-head .close:focus-visible { color: #e6e6e6; }
      /* Every handle a drag starts from (use-drag.ts): a column's header, a
         card's, a slot's, a task's. */
      .column-head { user-select: none; }
      [data-drag-card], [data-drag-task] { cursor: grab; }
      /* The handle holds the pointer while it drags, so its cursor is the one shown. */
      [data-dragging] [data-drag-card], [data-dragging] [data-drag-task],
      [data-dragging][data-drag-card], [data-dragging][data-drag-task] { cursor: grabbing; }
      /* Past the last column: a drop there is a spot on the canvas (ADR-0126),
         marked while a card is dragged. */
      #strip > .canvas-end { flex: 0 0 4rem; display: flex; justify-content: center;
        align-items: flex-start; padding-top: .5rem; }
      #strip > .canvas-end > .add-root { align-self: flex-start; }
      body[data-card-drag] #strip > .canvas-end { box-shadow: inset 2px 0 0 #555; }
      /* A column folded to a strip in its place on the canvas: its head a drag
         handle, the rest a button that unfolds it, holding ⇥, a thread's mark,
         its name on its side and its detail. The strip is its header turned
         on its side: the name at the header's size and colour, so a fold's
         turn lands on it exactly (`use-fold-motion.ts`). Every row above the
         name has a fixed height, summed in the registered properties below,
         which the strip is laid out by and which a fold reads from the live
         column before its strip exists. Its divider is a shadow, not a
         border, so the name centres in the strip's whole width. */
      @property --strip-width { syntax: "<length>"; inherits: true; initial-value: 0px; }
      @property --strip-mark-top { syntax: "<length>"; inherits: true; initial-value: 0px; }
      @property --strip-name-top { syntax: "<length>"; inherits: true; initial-value: 0px; }
      @property --strip-name-max { syntax: "<length>"; inherits: true; initial-value: 0px; }
      #strip { --strip-width: 2.2rem; --strip-head: 2rem; --strip-pad: .5rem; --strip-unfold: 1rem;
        --strip-gap: .4rem; --strip-mark: 1.5rem; --strip-name-max: 60vh;
        --strip-mark-top: calc(var(--strip-head) + var(--strip-pad) + var(--strip-unfold) + var(--strip-gap));
        --strip-name-top: calc(var(--strip-mark-top) + var(--strip-mark) + var(--strip-gap)); }
      /* A note column's strip has no mark; the task column's (below), no head either. */
      #strip [data-kind="note-column"] { --strip-name-top: var(--strip-mark-top); }
      .folded-column { flex: 0 0 var(--strip-width); width: var(--strip-width); min-height: 0; display: flex;
        flex-direction: column; box-shadow: inset -1px 0 0 #23272e; }
      .folded-column .folded-head { flex: 0 0 var(--strip-head); height: var(--strip-head); align-items: center;
        justify-content: center; padding: 0; }
      /* A note column's track is grey, folded or not: its head's top border. */
      .note-column, .folded-column[data-kind="note-column"] { --track: #6f7784; }
      .folded-grip { color: #6f7784; font-size: .9rem; line-height: 1; }
      /* Its own background, isolated, is what a banner's black blends with
         (the `.thread-mark` rule). */
      .folded-title { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--strip-gap);
        padding: var(--strip-pad) 0; border: 0; border-radius: 0; color: #aaa; cursor: pointer;
        isolation: isolate; background: var(--strip-paper, var(--page)); }
      .folded-title:hover, .folded-title:focus-visible { color: #e6e6e6; background: #1b1e23; }
      .folded-title > .unfold { flex: 0 0 var(--strip-unfold); height: var(--strip-unfold);
        line-height: var(--strip-unfold); }
      .folded-title > .thread-mark { flex: 0 0 var(--strip-mark); height: var(--strip-mark); }
      .folded-name, .folded-detail { writing-mode: vertical-rl; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; max-height: var(--strip-name-max); }
      .folded-name { font-weight: 600; }
      .folded-column[data-kind="thread"] .folded-name,
      .folded-column[data-kind="thread"] .folded-title > .thread-mark { font-size: .85rem; color: var(--track, #9ecbff); }
      .folded-column[data-kind="note-column"] .folded-name { font-size: .8rem; color: #ddd; }
      .task-column.folded-column .folded-name { font-size: .9rem; color: #e6e6e6; }
      .folded-detail { font-size: .7rem; color: #8b93a1; }
      /* The name a fold turns: a line box of a line height a fold can read
         (`normal` reads as no length), as tall as the strip's name is wide. */
      [data-fold-name] { display: inline-block; line-height: 1.5; }
      /* The task column: first on the canvas, outside its order. */
      .task-column { flex: 0 0 18rem; width: 18rem; min-width: 0; display: flex; flex-direction: column;
        min-height: 0; border-right: 1px solid #23272e; background: #15171b; --strip-paper: #15171b;
        --strip-name-top: calc(var(--strip-pad) + var(--strip-unfold) + var(--strip-gap)); }
      .task-column.folded-column { flex: 0 0 var(--strip-width); width: var(--strip-width); border-right: 0; }
      .task-column-head { display: flex; align-items: center; gap: .5rem; padding: .4rem .75rem;
        border-top: 4px solid #8ab4f8; font-size: .8rem; color: #aaa; }
      .task-column-title { flex: 1; text-align: left; background: none; border: 0; padding: 0;
        color: #e6e6e6; font-weight: 600; font-size: .9rem; cursor: text; }
      .task-column-title:disabled { cursor: default; }
      /* ⇤ in the task column's head folds it; only you see your folds. */
      .task-column-head .fold { background: none; border: 0; padding: 0; color: #6f7784;
        cursor: pointer; font-size: .9rem; line-height: 1; }
      .task-column-head .fold:hover { color: #e6e6e6; }
      .task-column-body { flex: 1; overflow-y: auto; padding: .4rem .75rem; display: flex;
        flex-direction: column; gap: .6rem; font-size: .8rem; color: #aaa; }
      .task-state { display: flex; align-items: center; gap: .5rem; }
      .task-state-move { background: none; border: 0; padding: 0; color: #8b93a1; cursor: pointer;
        font-size: .75rem; }
      .task-state-move:hover { color: #e6e6e6; }
      .task-pins { display: flex; flex-direction: column; gap: .3rem; padding: .3rem 0; }
      .task-pins-heading { font-size: .72rem; color: #b392f0; }
      body[data-card-drag] .task-pins { outline: 1px dashed #6f7784; outline-offset: 2px; }
      .task-told summary { font-size: .72rem; color: #8b93a1; cursor: pointer; }
      .task-trash summary { font-size: .72rem; color: #8b93a1; cursor: pointer; }
      /* Title and restore on one line, the words under them: each row the
         same height, every left edge and button lined up. */
      .trash-row { display: grid; grid-template-columns: minmax(0, 1fr) auto;
        column-gap: .5rem; align-items: baseline; font-size: .72rem;
        padding: .2rem 0 .2rem .6rem; }
      .trash-title { color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .trash-why { grid-column: 1 / -1; font-size: .68rem; color: #8b93a1;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .trash-restore { background: none; border: 0; padding: 0;
        font-size: .72rem; color: #8b93a1; cursor: pointer; }
      .trash-restore:hover:not(:disabled) { color: #e6e6e6; }
      .task-told-line, .canvas-read-line { font-size: .72rem; color: #aaa; padding-left: .6rem;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .avatars { display: inline-flex; gap: 2px; flex: 0 0 auto; }
      /* The circle. `.avatar` has no rule: it marks a person shown here, which
         the browser suite counts. */
      .initial { position: relative; display: inline-block; width: 16px; height: 16px;
        overflow: hidden; border-radius: 50%; font-size: 10px; line-height: 16px;
        text-align: center; color: #111; font-weight: 600; }
      /* A person's picture (ADR-0098), over their initial, which shows while
         it loads. */
      .initial img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .initial.more { background: #3a3f48; color: #bbb; }
      /* What became of a column's files, in its header (ADR-0040): the offer
         in your repo (ADR-0038), or where a lane that works directly writes. */
      .work { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem;
        padding: .35rem .75rem; border-top: 1px solid #23272e; font-size: .75rem; color: #8b93a1; }
      /* A row of the column's header (ADR-0113). */
      .column-head .work { padding: .15rem 0 0; border-top: 0; user-select: text; }
      .work .work-space { flex: 1; }
      .work button { padding: .1rem .5rem; font-size: .75rem; background: none;
        border: 1px solid #444; color: #bbb; }
      .work .offer-line { color: #a8d8a8; }
      /* An offer that can be reviewed: its line is the review's toggle, and
         its bookmark copies; both read as text, not as the strip's buttons. */
      .work button.offer-line, .work button.offer-bookmark { border: none; padding: 0;
        font-size: inherit; text-align: left; cursor: pointer; }
      .work button.offer-line { font-size: .75rem; }
      .work button.offer-line::after { content: " ▸"; }
      .work button.offer-line[aria-expanded="true"]::after { content: " ◂"; }
      .work button.offer-line:hover { text-decoration: underline; }
      .work[data-state="nothing"] .offer-line, .work[data-state="taken"] .offer-line,
      .work[data-state="running"] .offer-line, .work[data-state="busy"] .offer-line { color: #8b93a1; }
      .work[data-state="conflicts"] .offer-line,
      .work[data-state="needs_you"] .offer-line { color: #e8c07a; }
      .work .offer-bookmark { font-family: ui-monospace, monospace; font-size: .7rem; color: #6f7784;
        user-select: text; }
      .work button.offer-bookmark:hover { color: #aab; }
      /* Your last offer command: in flight, or why it was not done. */
      .work .offer-note { font-size: .75rem; color: #8b93a1; }
      .work .offer-note[data-acting="said"] { color: #e8c07a; }
      .work button:disabled { opacity: .5; cursor: progress; }
      .work.access .access-line { font-size: .75rem; color: #aab; }
      .work.access[data-state="waiting"] .access-line { color: #e8c07a; }
      .work.access[data-state="refused"] .access-line,
      .work.access[data-state="unanswered"] .access-line { color: #8b93a1; }
      .work .access-note { font-size: .75rem; color: #e8c07a; }
      .work .access-approve { border-color: #4f7a4f; color: #a8d8a8; }

      /* A column's pane (ADR-0078, ADR-0087): beside the thread, filling what
         the strip has beside it, or, where the strip can't hold the thread
         and 40rem (`narrowStrip` in pane.ts, which pane.test.ts holds to these
         numbers), a modal dialog over the page. One thing at a time: a
         review, a table or an image, each under one head. */
      .pane { flex: 0 0 auto; width: clamp(40rem, 100cqw - 28rem - 1px, 64rem); min-height: 0;
        display: flex; flex-direction: column; border-top: 4px solid var(--track, #777);
        border-left: 1px solid #23272e; font-size: .8rem; }
      dialog.pane { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0;
        padding: 0; border: 0; border-top: 4px solid var(--track, #777); background: var(--page);
        color: inherit; }
      dialog.pane::backdrop { background: var(--page); }
      dialog.pane:not([open]) { display: none; }
      .pane-head { display: flex; align-items: center; gap: .6rem; padding: .4rem .75rem;
        border-bottom: 1px solid #23272e; color: #aaa; outline: none; }
      .pane-head .pane-line { color: #a8d8a8; }
      .pane-head .pane-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: #ddd; }
      .pane-head .pane-link { color: #9ecbff; white-space: nowrap; }
      .pane-head .pane-close { margin-left: auto; background: none; border: none; color: #8b93a1;
        font-size: 1rem; padding: 0 .25rem; }
      .pane-head .pane-close:hover, .pane-head .pane-close:focus-visible { color: #e6e6e6; }
      .pane-head .review-pref { background: none; border: 1px solid transparent; border-radius: 4px;
        color: #8b93a1; padding: 0 .35rem; }
      .pane-head .review-pref:hover, .pane-head .review-pref:focus-visible { color: #e6e6e6; }
      .pane-head .review-pref[aria-pressed="true"] { color: #e6e6e6; border-color: #3a3f48; }
      .pane-body { flex: 1; min-height: 0; overflow: auto; }

      /* A review (ADR-0047): a file list (for more than one file), and one
         scroll of every file's diff, each file's head pinned while its diff
         shows. */
      .review { flex: 1; min-height: 0; display: flex; flex-direction: column; --diff-line: 1.35em; }
      .review-body { flex: 1; display: flex; min-height: 0; }
      .review-list { flex: 0 0 12rem; overflow: auto; padding: .4rem 0; border-right: 1px solid #23272e; }
      .review-list-title { padding: .4rem .6rem .15rem; color: #8b93a1; font-size: .72rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file { display: block; width: 100%; text-align: left; background: none; border: none;
        border-radius: 0; padding: .15rem .6rem; color: #bbb; font-family: ui-monospace, monospace;
        font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file:hover { background: #1c2027; }
      .review-list-file[aria-current] { background: #222833; color: #eee; }
      .review-list-file[data-conflicts] { color: #e8c07a; }
      .review-diffs { flex: 1; min-width: 0; overflow: auto; }
      .review-description { padding: .6rem .75rem; border-bottom: 1px solid #23272e; }
      .review-revision-title { color: #ddd; font-weight: 600; }
      .review-revision-body { margin-top: .3rem; white-space: pre-wrap; color: #aab; }
      .review-widens { margin-top: .3rem; color: #d29922; }
      .review-file { border-bottom: 1px solid #23272e; }
      .review-file-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center;
        gap: .5rem; padding: .3rem .75rem; background: #181b20; border-bottom: 1px solid #23272e;
        font-family: ui-monospace, monospace; font-size: .75rem; }
      .review-file-head .review-path { color: #ddd; overflow-wrap: anywhere; }
      .review-toggle { background: none; border: none; padding: 0; color: #8b93a1; width: 1em; }
      .review-letter { color: #8b93a1; }
      .review-file[data-letter="A"] .review-letter { color: #a8d8a8; }
      .review-file[data-letter="D"] .review-letter { color: #e89a9a; }
      .review-lines { color: #8b93a1; }
      .review-flag { padding: 0 .35rem; border-radius: 3px; background: #3a3220; color: #e8c07a;
        font-family: system-ui, sans-serif; font-size: .7rem; }
      .review-show { margin: .4rem .75rem; background: none; border: 1px solid #444; color: #bbb;
        font-size: .75rem; }
      .review-note { padding: .4rem .75rem; color: #8b93a1; font-style: italic; }
      .review-placeholder { font-size: .75rem; }
      .review-diff { margin: 0; padding: .3rem 0; overflow-x: auto; white-space: pre;
        font-family: ui-monospace, monospace; font-size: .75rem; line-height: var(--diff-line); }
      .review-diff span { display: block; padding: 0 .75rem; min-width: max-content; }
      /* Wrapped (ADR-0087): a line's continuation hangs under its text, one
         character in, clear of its +/− column. */
      .review[data-wrap] .review-diff { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
      .review[data-wrap] .review-diff span { min-width: 0; padding-left: calc(.75rem + 1ch); text-indent: -1ch; }
      .review[data-list-folded] .review-list { display: none; }
      .review-diff [data-kind="add"] { color: #a8d8a8; background: #1b2a1d; }
      .review-diff [data-kind="del"] { color: #e89a9a; background: #2d1c1e; }
      .review-diff [data-kind="hunk"] { color: #7fa7d8; }
      .review-diff [data-kind="meta"] { color: #6f7784; }
      .work .offer-take { border-color: #4f7a4f; color: #a8d8a8; }
      .work .offer-update { border-color: #6b5a33; color: #e8c07a; }
      .column-body { flex: 1; overflow-y: auto; padding: .75rem 1.75rem .75rem .75rem; }

      .msg { position: relative; margin: 0 0 1rem; }
      .role { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f7784; }
      .msg.chat .role { color: #e0c080; }
      .msg.assistant .role { color: #9ecbff; }
      .msg.land .role, .msg.update .role, .msg.stack .role,
      .msg.carry-on .role, .msg.fact .role, .msg.behind .role { color: #c8a8e8; }
      /* A message that compelled the agent: it was asked, so a reply follows. */
      .msg.asked { border-left: 2px solid #9ecbff; padding-left: .75rem; }
      /* Where a lane starts on the path: a rule with the lane's name on it. */
      .lane-join { display: flex; align-items: center; gap: .5rem; margin: 0 0 .6rem;
        font-size: .8rem; color: #9ecbff; }
      .lane-join::after { content: ""; flex: 1; border-top: 1px solid #2f4a66; }
      /* Message text is markdown (markdown.ts). pre-line shows a soft break as
         a line break, as people type them; the tree has no whitespace between
         blocks for it to show. */
      .text { white-space: pre-line; margin-top: .2rem; overflow-wrap: anywhere; }
      .text > :first-child { margin-top: 0; }
      .text > :last-child { margin-bottom: 0; }
      .text p, .text ul, .text ol, .text blockquote, .text pre, .text table { margin: .45rem 0; }
      .text ul, .text ol { padding-left: 1.3rem; }
      .text li > p { margin: .2rem 0; }
      .text h1, .text h2, .text h3, .text h4, .text h5, .text h6 { margin: .7rem 0 .3rem; font-size: 1rem; }
      .text h1 { font-size: 1.15rem; }
      .text h2 { font-size: 1.07rem; }
      .text blockquote { margin-left: 0; padding-left: .6rem; border-left: 2px solid #3a3f48; color: #aab4c3; }
      .text code { font-family: ui-monospace, monospace; font-size: .85em; padding: .05rem .25rem;
        background: #11141a; border-radius: 3px; }
      .text pre { padding: .45rem; overflow-x: auto; white-space: pre; background: #11141a;
        border: 1px solid #23272e; }
      .text pre code { padding: 0; font-size: .78rem; background: none; }
      /* `break-word`, not the text's `anywhere`: `anywhere` lets a word break
         when the table sizes its columns, so a narrow column splits its words
         ("Wo/rki/ng") rather than the table scrolling. */
      .text table { border-collapse: collapse; display: block; overflow-x: auto;
        overflow-wrap: break-word; }
      /* A message's table, under its bar of actions (ADR-0078): always shown,
         as a touch screen has no hover. Outlined while the pane shows it. */
      .text .table-wrap { margin: .45rem 0; }
      .text .table-wrap > table { margin: 0; }
      .table-bar { display: flex; justify-content: flex-end; line-height: 1; }
      .table-open, .take-block { padding: 0 .3rem; border: none; border-radius: 3px; background: none;
        color: #6f7784; font-size: .85rem; line-height: 1.2; }
      .table-open:hover:not(:disabled), .table-open:focus-visible, .take-block:hover:not(:disabled) { color: #e6e6e6; }
      .table-open[aria-pressed="true"] { color: var(--track, #9ecbff); }
      .table-open:disabled { opacity: .4; cursor: default; }
      .table-wrap[data-shown] > table, img.blob-image[data-shown] {
        outline: 2px solid var(--track, #9ecbff); outline-offset: 1px; }
      .text th, .text td { padding: .15rem .45rem; border: 1px solid #23272e; }
      .text a { color: #9ecbff; }
      .text hr { border: 0; border-top: 1px solid #23272e; }
      /* An image is capped at the column's width. Its width and height
         attributes (a pasted image's stored size) keep its box's shape while
         it loads (ADR-0042). */
      .text img { max-width: 100%; height: auto; vertical-align: middle; }
      img.blob-image { cursor: zoom-in; border: 1px solid #23272e; }
      .text img { max-width: 100%; }
      .text .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      /* A table in the pane scrolls with the pane's body, both ways, and is
         no scroller of its own as it is in the thread: its header row then
         pins to the body's top. After the `.text` rules, which it overrides. */
      .pane-table { margin-top: 0; padding: 0 .75rem .75rem; font-size: .85rem; }
      .pane-table table { display: table; overflow: visible; margin: 0; }
      .pane-table thead th { position: sticky; top: 0; z-index: 1; background: #181b20; }
      .pane-image { padding: .75rem; }
      .pane-image img { display: block; max-width: 100%; height: auto; cursor: zoom-in; }
      .pane-image img[data-zoom] { max-width: none; cursor: zoom-out; }
      .fork-dot { display: inline-block; width: 10px; height: 10px; padding: 0; margin-left: .4rem;
        border-radius: 50%; vertical-align: middle; background: var(--track); }
      .actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
        margin-top: .25rem; font-size: .75rem; }
      /* One row over the message's top right. Its last button, →, sits in the
         right gutter, since what it opens appears to the right: `right` is
         less than .column-body's right padding. Hidden, it keeps its box, so
         where → is can be measured before a hover. */
      .tools { position: absolute; top: -.2rem; right: -1.6rem; display: flex; gap: .3rem;
        font-size: .72rem; background: #1b1e24; padding: .15rem; border-radius: 4px;
        visibility: hidden; }
      .msg:hover .tools, .msg:focus-within .tools { visibility: visible; }
      .tools .branch { color: #9ecbff; }
      /* The row stretches it to the word buttons' height; flex centres its icon. */
      .tools .copy { display: flex; align-items: center; }
      /* The column's side padding hovers its message too: the → sits in the right
         gutter, and a hidden → takes no hover to bring itself back. ::before for
         the right, so .tools (later in the tree) paints over it and takes the
         click; .column-body's padding sets both widths. */
      .msg::before, .msg::after { content: ""; position: absolute; top: 0; bottom: 0; }
      .msg::before { left: 100%; width: 1.75rem; }
      .msg::after { right: 100%; width: .75rem; }
      /* A streaming reply's mark: a 2px bar in the gutter, 4px clear of the
         text. A border image drawn 6px outside the box (the outset) takes no
         width, so live text wraps as its entry will (S35). Not ::before:
         .msg's ::before and ::after are its hover gutters. Not a shadow: an
         outer shadow meets the box's edge, and masking the gap left a
         hairline there. */
      .msg.streaming {
        border-image: linear-gradient(transparent 4px, #9ecbff 4px, #9ecbff calc(100% - 4px),
          transparent 0) 0 0 0 1 / 0 0 0 2px / 0 0 0 6px; }
      .msg.streaming { opacity: .75; }
      /* A tool call: its head, what it touched, what it returned, and its
         toggle, each as much as `rowView` (tool-row.ts, ADR-0123) says. Its
         right margin takes the rem .column-body's right gutter has over its
         left padding, so a row sits as far from the column's right edge as
         from its left. */
      .tool { margin: .3rem -1rem .3rem 0; font-size: .8rem; }
      /* The tool's word and the call's status, at the row's top right, where a
         code block's language sits, so neither reads as part of the command
         (ADR-0114). A float, first in the row, so the command's first line
         runs beside it and the rest have the row's width. */
      .tool-head { float: right; display: flex; gap: .4rem; align-items: baseline;
        margin-left: .6rem; }
      .tool-tag { font-size: 11px; line-height: 1.6; text-transform: uppercase;
        letter-spacing: .1em; color: #6f7784; }
      /* Not a scroll container: a long line wraps, or it runs out of the column.
         Its lines are as `rowView` cut them, so pre-wrap keeps them. */
      .tool-command { font-family: ui-monospace, monospace; color: #aab4c3;
        white-space: pre-wrap; overflow-wrap: anywhere; }
      /* A command's runs by role (`rowSummary`, @pinetrie/shell). */
      .sh-command { color: #9ecbff; }
      .sh-option, .sh-redirect { color: #8a93a2; }
      .sh-string { color: #7bd88f; }
      .sh-variable { color: #e8c07a; }
      .sh-keyword, .sh-operator { color: #c8d0dc; }
      .sh-comment { color: #6f7784; font-style: italic; }
      /* How long a running call has run, in the ring's colour. Tabular figures,
         so a tick that keeps its count of digits keeps its width. */
      .tool-elapsed { font-size: 11px; line-height: 1.6; color: #e8c07a;
        font-variant-numeric: tabular-nums; }
      .tool[data-status="ok"] .tool-status { color: #7bd88f; }
      .tool[data-status="error"] .tool-status { color: #f28b82; }
      /* Its last lines, or all of them: never a scroll of its own. */
      .tool-output { clear: both; margin: .3rem 0 0; padding: .4rem;
        background: #11141a; border: 1px solid #23272e; white-space: pre-wrap;
        overflow-wrap: anywhere; font-size: .75rem; }
      /* A result's images, in place of its text (`toolBody`). A tall one is a
         thumbnail in the summary, 10rem tall (THUMB_HEIGHT) through its width. */
      .tool-images { clear: both; margin: .3rem 0 0; }
      .tool-images img { display: block; max-width: 100%; height: auto; margin-bottom: .3rem; }
      .tool-images[data-thumb] img { max-width: min(100%, calc(10rem * var(--ratio))); }
      /* What the summary hides, in words, or "less". Never selected with the
         row: the copy fallback selects `.tool` (`useCopy`). */
      .tool-more { display: block; clear: both; margin-top: .2rem; padding: 0;
        background: none; border: none; color: #6f7784; font-size: .72rem;
        cursor: pointer; user-select: none; }
      .tool-more:hover { color: #aab4c3; }
      .tool.live { opacity: .85; }
      /* A command the work opened, still running: a ring, absolutely placed, so
         it takes no layout and the column does not move when it comes or goes.
         A call that ends within REVEAL_MS is never revealed, so it never shows
         one. The ring is 4px clear of the row on every side; the row is centred
         in the column (`.tool`'s margin). */
      .tool.live[data-revealed] { position: relative; }
      .tool.live[data-revealed]::after { content: ""; position: absolute;
        inset: -4px; border: 1px solid transparent;
        border-radius: 3px; pointer-events: none;
        animation: tool-working 1.2s ease-in-out infinite; }
      @keyframes tool-working { 0%, 100% { border-color: rgb(232 192 122 / .3); }
        50% { border-color: rgb(232 192 122 / .9); } }
      /* Where the agent's next text will appear, while its lane runs. Zero
         height, so its margins collapse through it: as the content's last
         child or between two messages, it leaves the gap, and the height the
         follow rule reads (`.column-content`'s own), as they were. The shadow
         draws it 2px tall, and the transform lifts it to the middle of the
         gap above; neither takes layout. */
      .working-line { height: 0; width: 3rem; margin: 0 auto; box-shadow: 0 0 0 1px #9ecbff;
        transform: translateY(-.5rem); animation: pulse-line 1.2s ease-in-out infinite; }
      @keyframes pulse-line { 50% { opacity: .35; transform: translateY(-.5rem) scaleX(1.6); } }
      /* The outline says a command is running; the line would say the model is. */
      .column-content:has(.tool.live[data-revealed]) .working-line { visibility: hidden; }
      /* Asks (ADR-0056). A column's density: outline, story or raw. */
      .column-head .density { display: inline-flex; flex: 0 0 auto; border: 1px solid #2c313a;
        border-radius: 4px; overflow: hidden; }
      .column-head .density-choice { padding: 0 .35rem; border-radius: 0; background: none;
        color: #6f7784; font-size: .68rem; line-height: 1.4; }
      .column-head .density-choice[aria-pressed="true"] { background: #23272e; color: #e6e6e6; }
      /* An ask's work, folded to one line, or opened under it. */
      .ask-fold, .ask-line { display: block; width: 100%; margin: 0 0 1rem; padding: .1rem .5rem;
        text-align: left; font-size: .78rem; background: none; color: #8b93a1;
        border-left: 2px solid #2f4a66; border-radius: 0; }
      .ask-fold[aria-expanded="true"] { margin-bottom: .6rem; }
      .ask-fold-head .ask-fold { padding-right: 4.5rem; }
      .ask-fold::before, .ask-line::before { content: "▸ "; color: #6f7784; }
      .ask-fold[aria-expanded="true"]::before, .ask-line[aria-expanded="true"]::before { content: "▾ "; }
      .ask-fold:hover, .ask-line:hover { color: #e6e6e6; }
      .ask-fold-head { position: relative; }
      /* The files an ask changed: opens their review beside the column. */
      .ask-files { position: absolute; top: .05rem; right: 0; padding: 0 .4rem; font-size: .72rem;
        background: none; color: #9ecbff; border: 1px solid #2f4a66; border-radius: 3px; }
      /* Outline's line is one line: a running command can be long. */
      .ask-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* The running ask's line stands in for the working line (ADR-0054): it
         pulses by its brightness, never its size, which would spill a line
         as wide as the column past it. */
      .ask-line.running { animation: pulse-ask 1.2s ease-in-out infinite; color: #9ecbff; }
      @keyframes pulse-ask { 50% { opacity: .45; } }
      /* A model's words about an ask's work (ADR-0075): its headline, marked
         wherever it is drawn, and its points, a short list under the fold. */
      .ask-headline { color: #c9d3dc; }
      .ask-headline::before { content: "✦ "; color: #6f7784; }
      .ask-digest { margin: -.6rem 0 1rem; padding: .1rem .5rem .1rem 1rem; font-size: .78rem;
        line-height: 1.45; color: #b2ccd6; border-left: 2px dotted #4a6577; }
      .ask-digest .text { margin-top: 0; }
      .ask-digest p, .ask-digest ul { margin: 0; }
      .ask-digest ul { padding-left: 1rem; }
      .ask-outcome { margin: -.6rem 0 1rem; padding-left: .5rem; font-size: .78rem; color: #e0a080; }
      /* Which ask the work at the top answers, while its message is out of
         sight. The slot is sticky and zero-height, as .jump-slot is, so the
         bar takes no room and the content's height is as it was. */
      .ask-bar-slot { position: sticky; top: -.75rem; height: 0; z-index: 2; }
      .ask-bar { position: absolute; top: 0; left: 0; right: 0; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: .15rem .5rem;
        font-size: .75rem; background: #1b1e24ee; color: #e0c080; border-radius: 0;
        border-bottom: 1px solid #2c313a; }
      /* Where this device last left the thread. Zero height, as the working
         line is, so its arrival moves nothing; the rule and its words are
         drawn in the gap above. */
      .left-line { position: relative; height: 0; outline: 1px dashed #e0c080;
        transform: translateY(-.5rem); }
      .left-line::after { content: attr(data-words); position: absolute; right: 0; top: -.6rem;
        padding: 0 .3rem; font-size: .65rem; line-height: 1.1rem; color: #e0c080; background: var(--page); }
      /* In outline, the running ask's own line says the agent works. */
      .column[data-density="outline"] .working-line { display: none; }
      /* A column's dock (ADR-0113): the queue's header, the queued cards, the
         line, your message and the notes line, pinned to the column's foot.
         At most a third of the column: past that it scrolls within, its
         queue header kept in view. */
      .dock { flex: 0 0 auto; max-height: 33%; overflow-y: auto; border-top: 1px solid #23272e; }
      .queue-head { position: sticky; top: 0; z-index: 1; display: flex; gap: .5rem;
        align-items: center; padding: .3rem .75rem; font-size: .72rem; color: #8b949e;
        background: var(--page); }
      .queue-head .next-state { flex: 1; }
      .queue-head .next-state[data-next="held"] { color: #e8c07a; }
      .queue-head .next-state[data-next="running"] { color: #8ab4f8; }
      .queue-head[data-next="run"] .next-state::before { content: "▸ "; }
      .next-button { padding: .05rem .55rem; font-size: .72rem; background: none;
        border: 1px solid #3a3f47; color: #c3c8d0; }
      .next-button.stop { border-color: #f28b82; color: #f28b82; }
      .next-button.resume { border-color: #8ab4f8; color: #8ab4f8; }
      .next-button.release-queue { border-color: #e8c07a; color: #e8c07a; }
      .queue-menu-trigger { padding: 0 .35rem; background: none; border: 0; color: #8b93a1; }
      .queue-cards { padding: 0 .75rem; }
      /* A queued card at rest is folded to its header and first line; it
         opens while it holds the focus. ▸ marks the one that goes next. */
      .queued-card { position: relative; }
      .queued-card[data-next]::before { content: "▸"; position: absolute; left: -.65rem; top: .2rem;
        font-size: .72rem; color: #58a6ff; }
      .dock .card-editor.queued { margin-bottom: .3rem; }
      .add-to-queue { margin: 0 .75rem .3rem; padding: 0; background: none; border: 0;
        font-size: .72rem; color: #8b93a1; cursor: pointer; }
      .add-to-queue:hover { color: #ddd; }
      .the-line { margin: 0 .75rem; border: 0; border-top: 1px dashed #3a3f47; }
      .dock[data-next="message"] .composer .send::before { content: "▸ "; }
      /* Someone else asked first: the sender chooses to wait or to branch. */
      .conflict { font-size: .8rem; color: #d0a15f; margin-bottom: .35rem; }
      .conflict button { padding: .1rem .5rem; font-size: .75rem; }

      /* Released, with more below: a way back to the end. The slot is sticky and
         zero-height, so it takes no room and does not move that end. */
      .jump-slot { position: sticky; bottom: 0; height: 0; z-index: 2; }
      .jump-latest { position: absolute; bottom: .5rem; left: 50%; transform: translateX(-50%);
        padding: .15rem .6rem; font-size: .75rem; background: #1d2a3a; color: #9ecbff;
        border: 1px solid #9ecbff; border-radius: 1rem; white-space: nowrap; }

      .composer { padding: .5rem .75rem .75rem; }
      /* An archived root, or a send on its way: what was typed
         stays, and nothing more is typed. */
      .card-editor .input[readonly] { opacity: .5; }
      /* A note column (ADR-0116): a title, and its notes one under another,
         each folded to its first line until it holds the focus; a drop on it
         makes a note at its end. */
      .note-column { flex: 0 0 20rem; width: 20rem; min-width: 0; display: flex;
        flex-direction: column; min-height: 0; border-right: 1px solid #23272e; }
      .note-column[data-width="2"] { flex-basis: 40rem; width: 40rem; }
      /* Its head is a `.column-head`, a thread's row: its mark in the square
         a thread's takes, so the two names line up side by side. */
      .note-column-mark { font-size: .85rem; color: #8b93a1; }
      .column-head .note-column-title { flex: 1; min-width: 0; text-align: left; font-size: .85rem;
        font-weight: 600; color: #ddd; cursor: text; }
      .column-head .note-column-title:disabled { cursor: default; }
      /* Renamed, its field holds the row's height, the name where it was. */
      .column-head .open-title-input { box-sizing: border-box; height: 1.5rem; margin: 0 0 0 calc(-.4rem - 1px);
        padding: 0 .4rem; font-size: .85rem; font-weight: 600; }
      .note-count { font-size: .72rem; color: #8b93a1; }
      /* As tall as its notes, so the new card's box follows the last one;
         past the column's height they scroll, and the box stays in view. */
      .note-column-notes { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: .4rem .75rem 0; }
      .note-column-notes .card-editor.note { margin-bottom: .3rem; }
      /* An entry's margin (ADR-0126): shut, its count under the entry; open,
         its comments, indented as notes beside what they are on. */
      .margin-face { background: none; border: 0; padding: 0 .75rem; color: #999;
        font-size: .8rem; cursor: pointer; }
      .margin-face:hover { color: #ddd; }
      .margin { margin: 0 .75rem .5rem 1.5rem; border-left: 2px solid #555;
        padding-left: .5rem; }
      .margin .card-editor.note { margin-bottom: .3rem; }
      .margin-foot { display: flex; gap: .75rem; font-size: .8rem; }
      .margin-foot button { background: none; border: 0; padding: 0; color: #999; cursor: pointer; }
      .margin-foot button:hover { color: #ddd; }
      /* The entry the column's keys select (`j`, `k`). */
      .column-content:focus { outline: none; }
      .msg[data-selected] { box-shadow: inset 2px 0 0 #8ab4f8; }
      .notes-empty { font-size: .75rem; color: #6f7784; }
      body[data-card-drag] .note-column { outline: 1px dashed #6f7784; outline-offset: -2px; }
      /* While a card is dragged, the places it can become a thread (ADR-0111):
         a workflow state, on the board or the footer's strip, and the sidebar. */
      body[data-card-drag] [data-put-state],
      body[data-card-drag] .sidebar-items { outline: 1px dashed #6f7784; outline-offset: -2px; }
      /* A text card's frame (ADR-0111), coloured by its place, which says who
         reads it: your inventory yours, a draft neutral, queued blue (the
         agent reads it once), pinned violet (on every run). */
      .card-frame { --tone: #6f7784; margin: 0 0 .5rem; background: #181b20;
        border: 1px solid #2d333b; border-left: 3px solid var(--tone); border-radius: 6px; }
      .card-frame[data-tone="queued"] { --tone: #58a6ff; }
      .card-frame[data-tone="pinned"] { --tone: #b392f0; }
      .card-frame[data-tone="inventory"] { --tone: var(--you, #e3b341); }
      .composer .card-frame { margin: 0; }
      .card-head { display: flex; align-items: center; gap: .4rem; min-height: 1.6rem;
        padding: .15rem .5rem; font-size: .72rem; color: #8b93a1; }
      .card-icon, .card-place { color: var(--tone); }
      .card-icon { font-weight: 600; }
      .card-state { color: #c3c8d0; }
      .card-state[data-state="unsent"], .card-state[data-status="changed"],
      .card-state[data-status="unread"] { color: #e8c07a; }
      .card-chip { padding: 0 .45rem; border-radius: .6rem; background: #2a2140; color: #d2a8ff; }
      .card-chip button { background: none; border: 0; padding: 0 0 0 .3rem; color: inherit; cursor: pointer; }
      /* Room for ⋯ and × before the card exists: the header does not shift. */
      .card-head-acts { display: flex; gap: .15rem; justify-content: flex-end; min-width: 3rem; margin-left: auto; }
      .card-head-acts button { padding: 0 .35rem; font-size: .8rem; background: none; border: 0;
        color: #8b93a1; cursor: pointer; }
      .card-head-acts button:hover { color: #ddd; }
      .card-body { padding: 0 .5rem; }
      .card-foot { display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem .4rem; }
      .card-foot:empty { display: none; }
      .card-tools { display: flex; gap: .2rem; }
      .card-tools button { width: 1.6rem; padding: .05rem 0; font-size: .72rem; }
      .pane-text { margin: 0; white-space: pre-wrap; overflow: auto; font-size: .8rem; }
      .card-share { display: flex; align-items: center; gap: .3rem; }
      .card-share .share-file { padding: .05rem .35rem; font-size: .72rem; }
      .share-status { color: #8b93a1; font-size: .72rem; }
      .card-frame .primary { background: var(--tone); border-color: var(--tone); color: #0d1117; }
      .card-frame .primary:disabled { opacity: .5; }
      /* Closing a new branch that holds text asks first. */
      .close-ask { font-size: .75rem; color: #d0a15f; margin-top: .25rem; }
      .close-ask button { padding: .05rem .45rem; font-size: .72rem; }
      .read-only { display: flex; gap: .5rem; align-items: center; justify-content: flex-end;
        margin-top: .4rem; font-size: .8rem; color: #aab4c3; }

      .typing { font-size: .75rem; color: #8b93a1; margin-bottom: .3rem; font-style: italic; }
      .card-editor .input { display: block; width: 100%; resize: vertical; }
      /* A queued card in the dock, at rest: its header and one line. */
      .dock .card-editor.queued:not(:focus-within) .card-foot { display: none; }
      .dock .card-editor.queued:not(:focus-within) .input { height: 1.9rem;
        padding: .2rem .7rem; line-height: 1.4rem; overflow: hidden; resize: none;
        white-space: nowrap; text-overflow: ellipsis; }
      /* A note in its note column, at rest: its header and one line (ADR-0116). */
      .note-column .card-editor.note:not(:focus-within) .card-foot { display: none; }
      .note-column .card-editor.note:not(:focus-within) .input { height: 1.9rem;
        padding: .2rem .7rem; line-height: 1.4rem; overflow: hidden; resize: none;
        white-space: nowrap; text-overflow: ellipsis; }
      /* The box a new card is written in: at rest a dashed line, headed
         only once it holds the focus. */
      .new-card .card-frame:not(:focus-within) { background: none; border-style: dashed; }
      .new-card .card-frame:not(:focus-within) .card-head { display: none; }
      .new-card .card-frame:not(:focus-within) .input { background: none; border-color: transparent; }
      .note-column .new-card { flex: 0 0 auto; padding: 0 .75rem .5rem; }
      .note-column .new-card .card-frame { margin: 0; }
      /* Commands (ADR-0036) or mentions (ADR-0128) matching what is typed, above the input. */
      .card-editor .command-menu { margin: 0 0 .25rem; padding: .25rem 0; max-height: 12rem; overflow-y: auto; background: #1b1f25; border: 1px solid #2d333b; border-radius: 4px; }
      .card-editor .command { padding: .15rem .5rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-editor .command.highlighted { background: #2d333b; }
      .card-editor .command-name { color: #d2a8ff; }
      .card-editor .command-hint, .card-editor .command-kind, .card-editor .command-description { color: #8b949e; }
      .msg .cross-task-link { margin-left: .3rem; padding: 0; border: 0; background: none; color: #8b93a1; font: inherit; font-size: .85em; cursor: pointer; }
      .msg .cross-task-link:disabled { cursor: default; }
      .msg .command-label { margin-left: .4rem; color: #d2a8ff; font-size: .85em; }
      /* Under the text: where a new agent works, then send, at the right. A
         label too wide for the row is cut, and its title names everyone. */
      .compose-row { display: flex; gap: .5rem; align-items: center; justify-content: flex-end;
        margin-top: .4rem; }
      .compose-row .send { max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-foot .compose-row { flex: 1; margin-top: 0; }
      /* Something of yours refused, said where you acted (ADR-0059). */
      .refused-move { font-size: .75rem; color: #d0a15f; margin: 0 0 1rem; }
      .dock > .refused-move { margin: .3rem .75rem 0; }
      #board > .refused-move { margin: .5rem 1rem 0; }
      /* A host's fact in the queue: nobody edits or moves it (ADR-0080). */
      .queued-fact { font-size: .75rem; color: #8b949e; margin: 0 0 .3rem; }
      /* Pinned cards (ADR-0048 step 5): the thread's direction, at the top of
         its column and outside its scrolling body; the agent reads them on
         every run. Empty, a slim drop zone. */
      .pinned-strip { max-height: 30vh; overflow-y: auto; padding: .35rem .75rem;
        border-bottom: 1px solid #23272e; background: #16181d; }
      .pinned-empty { display: block; font-size: .72rem; color: #6f7784; }
      .pinned-strip[data-empty] { display: none; }
      body[data-card-drag] .pinned-strip[data-empty] { display: block; }
      .pinned-size { font-size: .72rem; color: #8b93a1; }
      .new-pin { padding: .05rem .45rem; font-size: .72rem; }
      /* A card's history (ADR-0048 step 6): a small list in its body, from its ⋯. */
      .card-history-events { margin: 0; padding: .25rem .5rem .25rem 1.4rem; font-size: .75rem; }
      .card-history-at, .card-history-writers { color: #8b93a1; }
      .card-history-writers { list-style: none; margin-left: -1rem; padding-top: .25rem; }
      .moved-back { font-size: .72rem; color: #d0a15f; }
      /* Where your card was when someone else moved it: a line that leads to it. */
      .traces { padding: .25rem .75rem 0; }
      .trace { display: block; background: none; border: 0; padding: .1rem 0;
        font-size: .75rem; color: #d0a15f; cursor: pointer; text-align: left; }
      .trace:hover { text-decoration: underline; }
      /* Where a run read pinned cards: a small marker above its prompt. */
      .pinned-read, .context-read { font-size: .72rem; color: #8b93a1; margin: 0 0 .4rem; }
      .pinned-read summary, .context-read summary { cursor: pointer; }
      .pinned-read-card { margin: .3rem 0 0 .75rem; }
      .pinned-read-by { color: #6f7784; }
      .pinned-read-text { white-space: pre-wrap; color: #c3c8d0; }
      .pinned-read-retired { margin: .3rem 0 0 .75rem; font-style: italic; }
      /* Your inventory (ADR-0048): floating over the columns' middle, docked
         left, centre or right, a 3 × 6 card grid. */
      .inventory { position: fixed; z-index: 5; top: 30vh; width: max-content; max-width: 94vw;
        background: #171a1f; border: 1px solid #3a3f48; border-radius: 8px;
        box-shadow: 0 8px 32px rgb(0 0 0 / .5); }
      .inventory[data-dock="left"] { left: 1rem; }
      .inventory[data-dock="centre"] { left: 50%; transform: translateX(-50%); }
      .inventory[data-dock="right"] { right: 1rem; }
      .inventory-frame { padding: .3rem .75rem; font-size: .75rem; color: #8b93a1;
        cursor: grab; user-select: none; border-bottom: 1px solid #23272e; touch-action: none; }
      .inventory-body { padding: .75rem; }
      /* The selected card's preview (ADR-0126): beside the grid, away from the
         panel's dock edge, one column wide, normal and read only. */
      .inventory-grid-row { display: flex; gap: .75rem; align-items: flex-start; }
      .inventory-grid-row > .preview { flex: 0 0 min(28rem, 40vw); width: min(28rem, 40vw); }
      .inventory-grid-row > .preview[data-side="left"] { order: -1; }
      /* The clipboard cell (ADR-0132): beside the grid, away from the preview;
         never a slot. */
      .clipboard-cell { flex: 0 0 9rem; width: 9rem; display: flex; flex-direction: column;
        gap: .35rem; padding: .5rem; border: 1px dashed #3a4150; border-radius: 6px;
        font-size: .75rem; color: #8b93a1; }
      .clipboard-cell[data-side="left"] { order: -2; }
      .clipboard-cell:focus { outline: 2px solid var(--you, #e3b341); outline-offset: 1px; }
      .clipboard-cell-head { display: flex; gap: .3rem; align-items: center; }
      .clipboard-cell-face { display: flex; flex-direction: column; gap: .15rem; color: #c9d1d9; min-width: 0; }
      .clipboard-cell-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .clipboard-cell .keep { align-self: flex-start; }
      .card-head:focus-visible { outline: 2px solid var(--tone, #8b93a1); outline-offset: -2px; }
      /* A card drawn normal: the card itself, bounded at a column's height. */
      .card-normal { display: flex; flex-direction: column; max-height: 18rem;

      .note-column-face-title { font-weight: 600; }
      .note-column-face-count { margin-left: auto; color: #8b93a1; }

      .thread-face { display: flex; flex-direction: column; gap: .1rem; height: 100%;

      .thread-face-sprite { width: 1.1rem; height: 1.1rem; }
      .thread-face-sprite[data-kind="banner"] { image-rendering: pixelated; }

      .thread-face-status { margin-top: auto; color: #e3b341; }
      .thread-preview { flex: 1; display: flex; flex-direction: column; max-height: 24rem;

      .thread-preview-path { margin: 0; padding: .5rem .75rem; overflow-y: auto; list-style: none; }
      .thread-preview-path > li { margin-bottom: .5rem; }
      .thread-preview-who { font-size: .7rem; color: #8b93a1; }
      .thread-preview-foot { padding: .4rem .75rem; border-top: 1px solid #23272e;
        display: flex; justify-content: flex-end; }
      /* A card folded: its place's colour as a strip, its owner, its lines. */
      .card-face { --tone: #6f7784; display: flex; flex-direction: column; height: 100%;
        border-top: 3px solid var(--tone); padding: .2rem .35rem; font-size: .72rem; }
      .card-face[data-tone="queued"] { --tone: #58a6ff; }
      .card-face[data-tone="pinned"] { --tone: #b392f0; }
      .card-face[data-tone="inventory"] { --tone: var(--you, #e3b341); }
      .card-face-head { display: flex; align-items: center; gap: .3rem; color: #8b93a1; }
      .card-face-head .card-icon { color: var(--tone); }
      .card-face-owner { width: 1rem; height: 1rem; font-size: .6rem; }
      .card-face-key { margin-left: auto; color: #6f7784; font-size: .65rem; }
      .card-face-lines { margin-top: .15rem; white-space: pre-wrap; color: #c3c8d0;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      dialog.restore-ask { background: #171a1f; color: inherit; border: 1px solid #3a3f48;
        border-radius: 8px; }
      dialog.restore-ask::backdrop { background: rgb(0 0 0 / .5); }
      /* A card's command (ADR-0055), above its box: what sending it does first. */
      .card-command { margin-bottom: .3rem; font-size: .75rem; color: #e8c07a; }
      .card-command-clear { padding: 0 .3rem; font-size: .72rem; background: none; border: none; color: #8b93a1; }
      /* What a new thread starts from, when there is a choice: a line of

        border: none; color: #8b93a1; font-size: .75rem; text-align: left; }
      .start-menu .start-trigger:hover { color: #e6e6e6; }
      .start-menu .start-words { min-width: 0; overflow: hidden; white-space: nowrap;
