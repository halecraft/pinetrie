<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pine·trie</title>
    <script>
      // A theme chosen on this device, set before the first paint so the page
      // never flashes the system's: `THEME_KEY` and `themeAttribute`
      // (`storage-keys.ts`, web-core's `theme.ts`), which `App` keeps after.
      try {
        const theme = JSON.parse(localStorage.getItem("pinetrie-theme") ?? "null")
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <style>
      /* The page's colours, by role, each light-dark(light, dark): the page
         follows the system's scheme unless `data-theme` on the root names
         one. Only this rule holds a colour literal (`stylesheet.test.ts`): a
         tint is a `color-mix()` of a hue and the surface under it, so it
         follows both. Surfaces, darkest first in dark; lines; text,
         brightest first in dark. A light value keeps its dark value's
         contrast on the page, and a hue its hue and chroma. */
      :root { color-scheme: light dark;
        --chrome: light-dark(#eceef1, #0e1013);
        --sunk: light-dark(#f2f4f6, #11141a);
        --page: light-dark(#fbfbfc, #14161a);
        --panel: light-dark(#f4f5f7, #181b20);
        --raised: light-dark(#ffffff, #1b1e24);
        --edge: light-dark(#dde1e6, #23272e);
        --line: light-dark(#d3d8de, #2c313a);
        --line-strong: light-dark(#bcc2ca, #3a3f48);
        --line-hover: light-dark(#8f96a1, #5a606b);
        --text-bright: light-dark(#13161c, #fff);
        --text: light-dark(#23272c, #e6e6e6);
        --text-soft: light-dark(#2a2d33, #ddd);
        --text-dim: light-dark(#30363d, #c9d1d9);
        --text-muted: light-dark(#424a56, #aab4c3);
        --text-faint: light-dark(#5b6370, #8b93a1);
        --text-quiet: light-dark(#757d8a, #6f7784);
        /* What a hue means: blue is what you act on, the agent's own blue
           what it said, amber what needs you. */
        --accent: light-dark(#456baa, #8ab4f8);
        --agent: light-dark(#3a6392, #9ecbff);
        --queued: light-dark(#2575ca, #58a6ff);
        --attention: light-dark(#654a00, #e0c080);
        --caution: light-dark(#966a26, #d0a15f);
        --inventory: light-dark(#816000, #e3b341);
        --highlight: light-dark(#765e00, #f2c94c);
        --pinned: light-dark(#8463bd, #b392f0);
        --command: light-dark(#7c53a3, #d2a8ff);
        --danger: light-dark(#b75650, #f28b82);
        --danger-soft: light-dark(#7d393c, #e89a9a);
        --ok: light-dark(#037030, #7bd88f);
        --ok-soft: light-dark(#2a552c, #a8d8a8);
        /* The same on both pages: the action's fill and the white on it, an
           image's checker, and a branch not yet started. */
        --action: #2f6feb; --white: #fff; --checker: #eee; --slot-pending: #777;
        /* The shadow under what floats, and the tile under a banner: drawn on
           black for `lighten`, it needs a dark ground on a light page. */
        --shadow: light-dark(rgb(0 0 0 / .18), rgb(0 0 0 / .5));
        --banner-ground: light-dark(#14161a, transparent);
        /* People's colours (`presence.tsx`), apart from the tracks so a ring
           or an avatar never reads as one: the first three people's, far
           apart and lighter or more saturated than any track, and the tone
           whose saturation and lightness a later person's hue, from their id,
           is drawn at. */
        --person-1: light-dark(#fe5dd9, #ff4fd8);
        --person-2: light-dark(#1f2328, #ffffff);
        --person-3: light-dark(#b59d02, #ffe030);
        --person-tone: light-dark(hsl(0 50% 38%), hsl(0 45% 62%));
        /* A track's colour per palette slot (`palette.ts`), in hue order: in
           dark at OKLCH lightness 0.72 and chroma 0.14, in light between 4.5
           and 6:1 on the page. Each is 4.5:1 or more on --page and apart from
           the others and from the colours that already mean something
           (`colors.test.ts`). */
        --slot-0: light-dark(#b84b01, #eb8656);
        --slot-1: light-dark(#8d5801, #dc932e);
        --slot-2: light-dark(#897203, #c0a320);
        --slot-3: light-dark(#5d6d04, #9ab140);
        --slot-4: light-dark(#037f20, #67bb6b);
        --slot-5: light-dark(#077f63, #13c097);
        --slot-6: light-dark(#057295, #03b4e9);
        --slot-7: light-dark(#0471cf, #60a8fa);
        --slot-8: light-dark(#5d5be2, #919afb);
        --slot-9: light-dark(#8947ce, #b68dec);
        --slot-10: light-dark(#a733a8, #d383d1);
        --slot-11: light-dark(#c52d7f, #e67dac); }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      /* The scales every size is drawn from. A size left literal is held to
         another number: a gutter a button sits in, a circle's initial. */
      :root {
        --font-2xs: .65rem; --font-xs: .72rem; --font-sm: .75rem; --font-md: .8rem;
        --font-lg: .85rem; --font-xl: .9rem; --font-2xl: 1rem; --font-3xl: 1.1rem;
        --radius-xs: 2px; --radius-sm: 3px; --radius-md: 4px; --radius-lg: 6px;
        --radius-xl: 8px; --radius-pill: 999px;
        --space-1: .1rem; --space-2: .2rem; --space-3: .25rem; --space-4: .3rem;
        --space-5: .4rem; --space-6: .5rem; --space-7: .6rem; --space-8: .75rem;
        --space-9: 1rem; --space-10: 1.25rem; --space-11: 1.5rem; --space-12: 2rem; }
      /* --surface is whatever a thing sits on, set by its context: --page,
         the paper the columns are on, or --chrome, the darker list and footer
         around it (ADR-0081, ADR-0122). A ring that must read as a gap around
         a dot uses it. --side is the sidebar's width, which the footer's own
         cell shares, so the two split along one line; folded to icons, it is
         3rem (ADR-0088). */
      :root { --surface: var(--page); --side: 15rem;
        /* A card's sizes (ADR-0171): a column, and compact, half a column's
           inside, as your inventory's bag lays two out (S241). A surface lays
           out in these and sets no card's size of its own. */
        --column: 28rem; --bag-pad: .75rem; --slot-gap: .35rem;
        --compact-w: calc((var(--column) - 2 * var(--bag-pad) - var(--slot-gap)) / 2);
        --compact-h: 4rem; }
      @media (width < 56rem) { :root { --side: 11.5rem; } }
      /* The sidebar folded to icons (ADR-0088), at any window width. */
      :root[data-list="icons"] { --side: 3rem; }
      /* A sideways scroll that runs past a scroller's edge chains to the
         page, where a trackpad swipe would go Back and leave pine·trie.
         `none` on the root ends the chain there, in a browser that ties
         its swipe to overscroll (Chrome does). */
      html, body { overscroll-behavior-x: none; }
      * { box-sizing: border-box; }
      /* Every button is a `Button` or an `IconButton` (`button.tsx`), drawn
         by its look. Under `:where`, so any rule of a button's own wins. */
      :where(button[data-look]) { padding: var(--space-6) var(--space-9); border: 0;
        border-radius: var(--radius-lg); font: inherit; cursor: pointer; }
      :where(button[data-look="primary"]) { background: var(--action); color: var(--white); }
      :where(button[data-look="outline"]) { border: 1px solid var(--line-strong);
        background: none; color: inherit; }
      :where(button[data-look="plain"]) { background: none; color: inherit; }
      /* Text on a fill (`--fill`) is ink on a light fill and white on a dark
         one: switched at OKLCH lightness 0.56, near where the two contrasts
         cross, so each page's fills read without a colour of their own.
         `infinity` makes the switch a step: any finite factor leaves a grey
         for a fill at the threshold. Under `:where`, so a rule that must win
         over another colour names `var(--on-fill)` itself. */
      :where(.initial, .inbox-badge, .menu-badge, .match-text mark, .card-frame .card-action,
        .access-approve) { --on-fill: oklch(from var(--fill) clamp(0.178, (0.56 - l) * infinity, 1) 0 0);
        color: var(--on-fill); }
      .actions button, .tools button { color: var(--text-muted);
        padding: var(--space-1) var(--space-5); border-radius: var(--radius-sm); }
      /* The sidebar down the left, the stage beside it, and the footer under
         both (ADR-0122). There is no header: the columns start at the top. */
      body {
        margin: 0; height: 100vh; display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        background: var(--page); color: var(--text);
      }
      #root { display: contents; }
      /* The identity form's title. */
      h1 { font-size: var(--font-2xl); letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 var(--space-3); }


      /* The sidebar (ADR-0122): your open roots, in your order, then new tabs,
         then ＋. Its right edge is an inset shadow: a descendant's fill paints
         over it, so the root you are on, filled with the page's colour,
         opens into the page beside it (ADR-0081, turned sideways). An item is
         its wrap: its button, ⋯ and ×. At rest it has no fill, and its
         border is there but clear, so it takes the same room chosen or not. */
      #sidebar { grid-column: 1; grid-row: 1; display: flex; flex-direction: column;
        gap: var(--space-7); min-height: 0; overflow-y: auto; padding: var(--space-7) 0 var(--space-7) var(--space-5);
        background: var(--chrome); --surface: var(--chrome);
        box-shadow: inset -1px 0 0 var(--edge); font-size: var(--font-md); --item-control: 1.4rem; }
      .sidebar-items { display: flex; flex-direction: column; gap: var(--space-1); }
      .sidebar-item { position: relative; display: flex; align-items: center; min-width: 0;
        border: 1px solid transparent; border-left-width: 2px; border-right: 0;
        border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
      .sidebar-item:hover { background: var(--raised); --surface: var(--raised); }
      /* The root you are on is the page's colour, and covers the list's edge. */
      .sidebar-item[data-selected] { background: var(--page); --surface: var(--page);
        border-color: var(--edge); border-left-color: var(--text-dim); }
      .open-root { flex: 1; display: flex; gap: var(--space-5); align-items: center;
        min-width: 0; padding: var(--space-5) var(--space-7); border-radius: 0;
        color: var(--text-muted); text-align: left; }
      .sidebar-item[data-selected] > .open-root {
        color: var(--text); font-weight: 600; }
      /* A title wraps to two lines before it is cut. */
      .open-label { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
      .open-root.archived .open-label { text-decoration: line-through; color: var(--text-quiet); }
      /* A root while it is renamed: a field in the item's place. */
      .open-title-input { flex: 1; min-width: 0; margin: var(--space-2) var(--space-4); padding: var(--space-2) var(--space-6);
        border-radius: var(--radius-md); background: var(--raised); color: var(--text); border: 1px solid var(--line-strong);
        font: inherit; }
      .open-title-input[aria-invalid="true"] { border-color: var(--danger); }
      .open-close, .open-menu { width: var(--item-control); padding: 0; color: var(--text-muted); }
      .open-more { position: relative; }
      /* ⋯ and × only while an item is hovered or focused, the one you are on
         too. Hidden with visibility, and laid over the label's end in the
         colour behind them, so the label keeps its room. */
      .sidebar-item .open-more, .sidebar-item .open-close { visibility: hidden; }
      .sidebar-item > .open-close { position: absolute; top: 0; bottom: 0; right: 0;
        background: var(--surface); }
      .sidebar-item > .open-more { position: absolute; top: 0; bottom: 0;
        right: var(--item-control); display: flex; background: var(--surface); }
      .sidebar-item:hover .open-more, .sidebar-item:focus-within .open-more, .open-more.open,
      .sidebar-item:hover .open-close, .sidebar-item:focus-within .open-close { visibility: visible; }
      /* Where a root dragged to the end of the sidebar lands. */
      .open-end { display: block; min-height: .6rem; }
      /* Where a dragged root would land (use-drag.ts): a line in the gap
         above the item it goes before, or at the list's end. */
      .sidebar-item[data-root-drop]::before { content: ""; position: absolute; z-index: 1;
        left: 0; right: 0; top: calc(-.05rem - 1.5px); height: 3px; border-radius: var(--radius-xs);
        background: var(--accent); pointer-events: none; }
      .open-end[data-root-drop] { box-shadow: inset 0 3px 0 var(--accent); }
      /* A root's status, before its label (ADR-0077), in the sidebar and on the
         board. Working is a still ring: it needs nothing from you, so it does
         not move. What needs you is a filled amber dot, the colour of the
         "since you were here" line the root opens onto, which pulses three
         times as it arrives and then stays; what is worth a read is a dim one.
         Done is a ✓ that fades. */
      .signal { flex: 0 0 auto; display: inline-block; width: 6px; height: 6px;
        box-sizing: border-box; border-radius: 50%; }
      .signal[data-signal="running"] { border: 1.5px solid var(--agent); }
      .signal[data-signal="needs-you"] { background: var(--attention); box-shadow: 0 0 0 1.5px var(--surface); }
      .signal[data-signal="worth-a-read"] { background: var(--attention); opacity: .45; }
      /* A column's dot (ADR-0198): one level of its thread's status. Ready is
         an amber ring, conflicts a red dot, accepted a ring in the track's
         colour; a status not raised for you is grey, and with none, a faint
         dot keeps the line's shape. */
      .signal[data-signal="ready"] { border: 1.5px solid var(--attention); }
      .signal[data-signal="conflicts"] { background: var(--danger); }
      .signal[data-signal="accepted"] { border: 1.5px solid var(--text-quiet); }
      .signal[data-signal="none"] { background: var(--text-quiet); opacity: .5; }
      .signal[data-quiet] { background: var(--text-quiet); border-color: var(--text-quiet); opacity: 1;
        box-shadow: none; }
      .signal:is([data-signal="needs-you"], [data-signal="conflicts"], [data-signal="ready"])[data-arrived] {
        animation: arrive .6s ease-in-out 3; }
      @keyframes arrive { 50% { transform: scale(1.8); } }
      .signal[data-signal="done"] { width: .7rem; height: auto; overflow: hidden; border-radius: 0;
        font-size: var(--font-xs); line-height: 1; color: var(--agent);
        animation: done-fade 3s ease-out forwards; }
      /* It ends taking no room, so nothing need be redrawn to remove it. */
      @keyframes done-fade { to { opacity: 0; width: 0; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
      /* In the top layer, placed inline (`popover.tsx`). `margin`, `inset`,
         `color` and `overflow` undo the browser's own `[popover]` rules. */
      .popover { display: flex; flex-direction: column; min-width: 12rem; margin: 0; inset: auto;
        padding: var(--space-3); overflow-y: auto; color: inherit; background: var(--raised);
        border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
        /* A choice's ✓ column, which an item without one and a choice's
           detail are indented by, so the names line up. */
        --menu-check: 1.1rem; }
      .menu-items { display: flex; flex-direction: column; }
      .menu button { text-align: left; color: var(--text-soft); padding: var(--space-4) var(--space-6); }
      .menu button:disabled { color: var(--text-quiet); cursor: default; }
      .menu .why { font-size: var(--font-sm); }
      /* ＋: a split button, dashed, at the foot of the sidebar and of each
         board column, and past a canvas's last column. */
      .add-root { position: relative; display: inline-flex; flex: 0 0 auto; align-self: flex-start;
        margin-left: var(--space-2); }
      /* Its own two buttons: its menu's items are a menu's. */
      .add-root > button, .add-root .add-menu { padding: var(--space-4) var(--space-7); color: var(--text-muted);
        border: 1px dashed var(--line-strong); border-radius: 0; }
      .add-root .add-agent { border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
      .add-root .add-menu { border-radius: 0 var(--radius-lg) var(--radius-lg) 0; border-left: 0; }
      .add-root > button:hover, .add-root .add-menu:hover { color: var(--text); background: var(--raised); }
      /* The send button's ▾ (ADR-0203): "resolve and send", beside send. */
      .send-root { display: inline-flex; flex: 0 0 auto; }
      .send-root:has(.send-more) > .send { border-radius: var(--radius-md) 0 0 var(--radius-md); }
      .send-root .send-menu { padding: var(--space-4) var(--space-5); border-radius: 0 var(--radius-md) var(--radius-md) 0;
        border-left: 1px solid color-mix(in srgb, var(--page) 40%, transparent); }
      /* The control at the list's foot that folds it, or shows its titles. */
      .list-fold { margin-top: auto; align-self: flex-start; padding: var(--space-2) var(--space-7);
        color: var(--text-quiet); font-size: var(--font-xl); }
      .list-fold:hover, .list-fold:focus-visible { color: var(--text); }

      /* The sidebar folded (ADR-0088): an icon per item, the item's own menu
         behind a right-click, ＋ over its ▾. The item's wrap, its selected
         fill and its left edge are the full list's. */
      :root[data-list="icons"] #sidebar { padding-left: var(--space-4); }
      .open-icon-menu { position: relative; flex: 1; min-width: 0; display: flex; }
      .open-icon-menu > .open-root { justify-content: center;
        padding: var(--space-5) 0; }
      .open-icon { position: relative; flex: 0 0 auto; display: inline-flex; width: 1.75rem;
        height: 1.75rem; }
      .open-sprite, .open-initials { width: 100%; height: 100%; border-radius: var(--radius-lg); }
      /* A banner is drawn on black, which lighten takes out; a built-in icon's
         ground is transparent, and lighten would take out its dark outline. */
      .open-sprite { object-fit: contain; }
      .open-sprite[data-kind="banner"] { mix-blend-mode: lighten; }
      .open-icon:has(> .open-sprite[data-kind="banner"]) { border-radius: var(--radius-lg);
        background: var(--banner-ground); }
      .open-initials { display: flex; align-items: center; justify-content: center; color: var(--page);
        font-size: var(--font-2xs); font-weight: 700; font-style: normal; line-height: 1; letter-spacing: .02em; }
      .open-root.archived .open-initials { opacity: .45; }
      /* A new tab: hollow, as its rail's dot is, until its first message. */
      /* Its signals sit on its corners: the working ring round it. */
      .open-icon .signal { position: absolute; top: -3px; right: -3px; }
      .open-icon .signal[data-signal="running"] { inset: -4px; width: auto; height: auto; border-radius: 9px; }
      .open-icon .signal[data-signal="done"] { top: -.35rem; right: -.2rem; font-size: var(--font-2xs); }
      /* Fixed, as the list scrolls and would clip them (packages/web/TECHNICAL.md, Gotchas). */
      .open-tip, .open-rename { position: fixed; z-index: 5; }
      .open-tip { display: flex; flex-direction: column; gap: var(--space-3); max-width: 20rem;
        padding: var(--space-4) var(--space-7); background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
        color: var(--text); font-size: var(--font-md); pointer-events: none; }
      .open-rename { display: flex; width: 16rem; }
      .add-root.folded { flex-direction: column; align-items: stretch; align-self: center;
        margin-left: 0; }
      .add-root.folded .add-more { display: flex; }
      .add-root.folded .add-menu { flex: 1; }
      .add-root.folded .add-agent { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
      .add-root.folded .add-menu { border-radius: 0 0 var(--radius-lg) var(--radius-lg); border-left: 1px dashed var(--line-strong);
        border-top: 0; padding: 0 var(--space-7); }
      :root[data-list="icons"] .list-fold { align-self: center; }
      .connecting, .nothing-here { margin: var(--space-9); color: var(--text-quiet); }

      /* The stage: the rail (E, everything in this root) beside the columns
         (paths), under a search's bar while one is open (ADR-0101). */
      #stage { grid-column: 2; grid-row: 1; position: relative; display: flex;
        flex-direction: column; min-height: 0; min-width: 0; background: var(--page); }
      .stage-row { flex: 1; display: flex; min-height: 0; min-width: 0; }
      /* The rail and, on a canvas, the 🔍 above it. As wide around a new tab's
         rail as around a canvas's, so the strip keeps its place. */
      .rail-side { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid var(--edge); }
      .rail { position: relative; flex: 1; min-height: 0; min-width: 3rem; padding: 0 var(--space-3);
        overflow-y: auto; }
      /* Centred in the rail, whose min-width is wider than a narrow tree. */
      .rail-tree { position: relative; width: fit-content; margin: 0 auto; isolation: isolate; }
      /* A new tab's rail: where its first message will be drawn. */
      .rail-start { position: absolute; width: 8px; height: 8px; box-sizing: border-box;
        border: 1.5px solid var(--text-quiet); border-radius: 50%; }
      .rail-dot { position: absolute; width: 8px; height: 8px; padding: 0; border-radius: 50%; }
      /* A running lane: a rail tip, a column's mark. */
      .pulse { animation: pulse 1s ease-in-out infinite; }
      /* A run of uneventful messages: a capsule, its length and fill inline. */
      .rail-stretch { position: absolute; width: 8px; padding: 0; border: 1.5px solid; border-radius: var(--radius-md);
        box-sizing: border-box; }
      /* What a column shows (ADR-0058): an outline in its colour around the
         whole dots and capsules in view, under them, and a tick over a capsule
         it shows only part of. Their place and colours are inline. The tree
         is its own stacking context, so the outline's -1 stays above the rail. */
      .rail-view { position: absolute; z-index: -1; width: 14px; box-sizing: border-box;
        border: 1.5px solid; border-radius: 7px; pointer-events: none; }
      .rail-tick { position: absolute; z-index: 1; border-radius: var(--radius-xs); pointer-events: none; }
      .rail-anchor { position: absolute; }
      /* A fork to a thread on another canvas or in an inventory (ADR-0117). */
      .rail-stub { position: absolute; transform: translateY(-50%); padding: 0 var(--space-2);
        font-size: var(--font-2xs); white-space: nowrap; color: var(--text-faint); background: var(--page);
        border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); }
      .rail-stub:disabled { cursor: default; opacity: .7; }
      /* Others here (ADR-0024): the ring is inline style; several share a count. */
      .here-count { position: absolute; top: -9px; left: 7px; font-size: 9px; line-height: 1;
        color: var(--text-soft); pointer-events: none; }
      @keyframes pulse { 50% { transform: scale(1.8); } }
      /* An unsent card of yours (ADR-0048): a round pip in your colour, ringed in

      .pane-head .pane-close { margin-left: auto; color: var(--text-faint);
        font-size: var(--font-2xl); padding: 0 var(--space-3); }
      .pane-head .pane-close:hover, .pane-head .pane-close:focus-visible { color: var(--text); }
      .pane-head .review-pref { border: 1px solid transparent; border-radius: var(--radius-md);
        color: var(--text-faint); padding: 0 var(--space-5); }
      .pane-head .review-pref:hover, .pane-head .review-pref:focus-visible { color: var(--text); }
      .pane-head .review-pref[aria-pressed="true"] { color: var(--text); border-color: var(--line-strong); }
      .pane-body { flex: 1; min-height: 0; overflow: auto; }

      /* A review (ADR-0047): a file list (for more than one file), and one
         scroll of every file's diff, each file's head pinned while its diff
         shows. */
      .review { flex: 1; min-height: 0; display: flex; flex-direction: column; --diff-line: 1.35em; }
      .review-body { flex: 1; display: flex; min-height: 0; }
      .review-list { flex: 0 0 12rem; overflow: auto; padding: var(--space-5) 0; border-right: 1px solid var(--edge); }
      .review-list-title { padding: var(--space-5) var(--space-7) var(--space-2); color: var(--text-faint); font-size: var(--font-xs);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file { display: block; width: 100%; text-align: left;
        border-radius: 0; padding: var(--space-2) var(--space-7); color: var(--text-muted); font-family: ui-monospace, monospace;
        font-size: var(--font-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .review-list-file:hover { background: var(--raised); }
      .review-list-file[aria-current] { background: var(--edge); color: var(--text); }
      .review-list-file[data-conflicts] { color: var(--attention); }
      .review-diffs { flex: 1; min-width: 0; overflow: auto; }
      .review-description { padding: var(--space-7) var(--space-8); border-bottom: 1px solid var(--edge); }
      .review-revision-title { color: var(--text-soft); font-weight: 600; }
      .review-revision-body { margin-top: var(--space-4); white-space: pre-wrap; color: var(--text-muted); }
      .review-widens { margin-top: var(--space-4); color: var(--caution); }
      .review-file { border-bottom: 1px solid var(--edge); }
      .review-file-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center;
        gap: var(--space-6); padding: var(--space-4) var(--space-8); background: var(--panel); border-bottom: 1px solid var(--edge);
        font-family: ui-monospace, monospace; font-size: var(--font-sm); }
      .review-file-head .review-path { color: var(--text-soft); overflow-wrap: anywhere; }
      .review-toggle { padding: 0; color: var(--text-faint); width: 1em; }
      .review-letter { color: var(--text-faint); }
      .review-file[data-letter="A"] .review-letter { color: var(--ok-soft); }
      .review-file[data-letter="D"] .review-letter { color: var(--danger-soft); }
      .review-lines { color: var(--text-faint); }
      .review-flag { padding: 0 var(--space-5); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--attention) 18%, var(--page)); color: var(--attention);
        font-family: system-ui, sans-serif; font-size: var(--font-xs); }
      .review-show { margin: var(--space-5) var(--space-8); color: var(--text-muted);
        font-size: var(--font-sm); }
      .review-note { padding: var(--space-5) var(--space-8); color: var(--text-faint); font-style: italic; }
      .review-placeholder { font-size: var(--font-sm); }
      .review-media { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); padding: var(--space-6) var(--space-8); }
      .review-media-side { margin: 0; min-width: 0; }
      .review-media-side figcaption { font-size: var(--font-sm); color: var(--text-faint); margin-bottom: var(--space-3); }
      .review-media-side img { max-width: 100%; max-height: 24rem; display: block;
        background: repeating-conic-gradient(var(--checker) 0 25%, var(--white) 0 50%) 0 0 / 16px 16px; }
      .review-media-missing { color: var(--text-faint); font-style: italic; }
      .review-diff { margin: 0; padding: var(--space-4) 0; overflow-x: auto; white-space: pre;
        font-family: ui-monospace, monospace; font-size: var(--font-sm); line-height: var(--diff-line); }
      .review-diff span { display: block; padding: 0 var(--space-8); min-width: max-content; }
      /* Wrapped (ADR-0087): a line's continuation hangs under its text, one
         character in, clear of its +/− column. */
      .review[data-wrap] .review-diff { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
      .review[data-wrap] .review-diff span { min-width: 0; padding-left: calc(var(--space-8) + 1ch); text-indent: -1ch; }
      .review[data-list-folded] .review-list { display: none; }
      .review-diff [data-kind="add"] { color: var(--ok-soft); background: color-mix(in srgb, var(--ok) 10%, var(--page)); }
      .review-diff [data-kind="del"] { color: var(--danger-soft); background: color-mix(in srgb, var(--danger) 8%, var(--page)); }
      .review-diff [data-kind="hunk"] { color: color-mix(in srgb, var(--agent) 80%, var(--page)); }
      .review-diff [data-kind="meta"] { color: var(--text-quiet); }
      .work .work-update { border-color: color-mix(in srgb, var(--attention) 42%, var(--page)); color: var(--attention); }
      .column-body { flex: 1; overflow-y: auto; padding: var(--space-8) 1.75rem var(--space-8) var(--space-8); }

      .msg { position: relative; margin: 0 0 var(--space-9); }
      .role { font-size: var(--font-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--text-quiet); }
      .msg.person .role { color: var(--attention); }
      .msg.assistant .role { color: var(--agent); }
      .msg.host .role { color: var(--command); }
      /* A message that compelled the agent: it was asked, so a reply follows. */
      .msg.asked { border-left: 2px solid var(--agent); padding-left: var(--space-8); }
      /* Where a lane starts on the path: a rule with the lane's name on it. */
      .lane-join { display: flex; align-items: center; gap: var(--space-6); margin: 0 0 var(--space-7);
        font-size: var(--font-md); color: var(--agent); }
      .lane-join::after { content: ""; flex: 1; border-top: 1px solid color-mix(in srgb, var(--agent) 33%, var(--page)); }
      /* Message text is markdown (markdown.ts). pre-line shows a soft break as
         a line break, as people type them; the tree has no whitespace between
         blocks for it to show. */
      .text { white-space: pre-line; margin-top: var(--space-2); overflow-wrap: anywhere; }
      .text > :first-child { margin-top: 0; }
      .text > :last-child { margin-bottom: 0; }
      .text p, .text ul, .text ol, .text blockquote, .text pre, .text table { margin: var(--space-5) 0; }
      .text ul, .text ol { padding-left: var(--space-10); }
      .text li > p { margin: var(--space-2) 0; }
      .text h1, .text h2, .text h3, .text h4, .text h5, .text h6 { margin: var(--space-8) 0 var(--space-4); font-size: var(--font-2xl); }
      .text h1 { font-size: var(--font-3xl); }
      .text h2 { font-size: var(--font-3xl); }
      .text blockquote { margin-left: 0; padding-left: var(--space-7); border-left: 2px solid var(--line-strong); color: var(--text-muted); }
      .text code { font-family: ui-monospace, monospace; font-size: .85em; padding: var(--space-1) var(--space-3);
        background: var(--sunk); border-radius: var(--radius-sm); }
      .text pre { padding: var(--space-5); overflow-x: auto; white-space: pre; background: var(--sunk);
        border: 1px solid var(--edge); }
      .text pre code { padding: 0; font-size: var(--font-sm); background: none; }
      /* `break-word`, not the text's `anywhere`: `anywhere` lets a word break
         when the table sizes its columns, so a narrow column splits its words
         ("Wo/rki/ng") rather than the table scrolling. */
      .text table { border-collapse: collapse; display: block; overflow-x: auto;
        overflow-wrap: break-word; }
      /* A message's table, under its bar of actions (ADR-0078): always shown,
         as a touch screen has no hover. Outlined while the pane shows it. */
      .text .table-wrap { margin: var(--space-5) 0; }
      .text .table-wrap > table { margin: 0; }
      .table-bar { display: flex; justify-content: flex-end; line-height: 1; }
      .table-open { padding: 0 var(--space-4); border-radius: var(--radius-sm);
        color: var(--text-quiet); font-size: var(--font-lg); line-height: 1.2; }
      .table-open:hover:not(:disabled), .table-open:focus-visible { color: var(--text); }
      .table-open[aria-pressed="true"] { color: var(--track, var(--agent)); }
      .table-open:disabled { opacity: .4; cursor: default; }
      .table-wrap[data-shown] > table, img.blob-image[data-shown] {
        outline: 2px solid var(--track, var(--agent)); outline-offset: 1px; }
      .text th, .text td { padding: var(--space-2) var(--space-5); border: 1px solid var(--edge); }
      .text a { color: var(--agent); }
      .text hr { border: 0; border-top: 1px solid var(--edge); }
      /* An image is capped at the column's width. Its width and height
         attributes (a pasted image's stored size) keep its box's shape while
         it loads (ADR-0042). */
      .text img { max-width: 100%; height: auto; vertical-align: middle; }
      img.blob-image { cursor: zoom-in; border: 1px solid var(--edge); }
      .text img { max-width: 100%; }
      .text .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      /* A table in the pane scrolls with the pane's body, both ways, and is
         no scroller of its own as it is in the thread: its header row then
         pins to the body's top. After the `.text` rules, which it overrides. */
      .pane-table { margin-top: 0; padding: 0 var(--space-8) var(--space-8); font-size: var(--font-lg); }
      .pane-table table { display: table; overflow: visible; margin: 0; }
      .pane-table thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); }
      .pane-image { padding: var(--space-8); }
      .pane-image img { display: block; max-width: 100%; height: auto; cursor: zoom-in; }
      .pane-image img[data-zoom] { max-width: none; cursor: zoom-out; }
      .fork-dot { display: inline-block; width: 10px; height: 10px; padding: 0; margin-left: var(--space-5);
        border-radius: 50%; vertical-align: middle; background: var(--track); }
      .actions { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: center;
        margin-top: var(--space-3); font-size: var(--font-sm); }
      /* One row over the message's top right. Its last button, →, sits in the
         right gutter, since what it opens appears to the right: `right` is
         less than .column-body's right padding. Hidden, it keeps its box, so
         where → is can be measured before a hover. */
      .tools { position: absolute; top: -.2rem; right: -1.6rem; display: flex; gap: var(--space-4);
        font-size: var(--font-xs); background: var(--raised); padding: var(--space-2); border-radius: var(--radius-md);
        visibility: hidden; }
      .msg:hover .tools, .msg:focus-within .tools { visibility: visible; }
      .tools .branch { color: var(--agent); }
      /* The row stretches it to the word buttons' height; flex centres its icon. */
      .tools .copy { display: flex; align-items: center; }
      /* The column's side padding hovers its message too: the → sits in the right
         gutter, and a hidden → takes no hover to bring itself back. ::before for
         the right, so .tools (later in the tree) paints over it and takes the
         click; .column-body's padding sets both widths. */
      .msg::before, .msg::after { content: ""; position: absolute; top: 0; bottom: 0; }
      .msg::before { left: 100%; width: 1.75rem; }
      .msg::after { right: 100%; width: .75rem; }
      /* A streaming reply's mark: a 2px bar in the gutter, 4px clear of the
         text. A border image drawn 6px outside the box (the outset) takes no
         width, so live text wraps as its entry will (S35). Not ::before:
         .msg's ::before and ::after are its hover gutters. Not a shadow: an
         outer shadow meets the box's edge, and masking the gap left a
         hairline there. */
      .msg.streaming {
        border-image: linear-gradient(transparent 4px, var(--agent) 4px, var(--agent) calc(100% - 4px),
          transparent 0) 0 0 0 1 / 0 0 0 2px / 0 0 0 6px; }
      .msg.streaming { opacity: .75; }
      /* A tool call: its head, what it touched, what it returned, and its
         toggle, each as much as `rowView` (tool-row.ts, ADR-0123) says. Its
         right margin takes the rem .column-body's right gutter has over its
         left padding, so a row sits as far from the column's right edge as
         from its left. */
      .tool { margin: var(--space-4) calc(-1 * var(--space-9)) var(--space-4) 0; font-size: var(--font-md); }
      /* The tool's word and the call's status, at the row's top right, where a
         code block's language sits, so neither reads as part of the command
         (ADR-0114). A float, first in the row, so the command's first line
         runs beside it and the rest have the row's width. */
      .tool-head { float: right; display: flex; gap: var(--space-5); align-items: baseline;
        margin-left: var(--space-7); }
      .tool-tag { font-size: var(--font-xs); line-height: 1.6; text-transform: uppercase;
        letter-spacing: .1em; color: var(--text-quiet); }
      /* Not a scroll container: a long line wraps, or it runs out of the column.
         Its lines are as `rowView` cut them, a block each, so pre-wrap keeps
         their indents. A wrapped line's rest hangs 2ch in, so it never reads
         as a line of its own; a blank line keeps its height. */
      .tool-command { font-family: ui-monospace, monospace; color: var(--text-muted);
        white-space: pre-wrap; overflow-wrap: anywhere; }
      .tool-line { padding-left: 2ch; text-indent: -2ch; }
      .tool-line:empty::before { content: " "; }
      /* A line that begins a top-level statement, past the first: a gap, not
         a blank line, so it costs none of the summary's lines. */
      .tool-line[data-starts] { margin-top: var(--space-6); }
      /* A command's runs by role (`rowSummary`, @pinetrie/shell). */
      .sh-command { color: var(--agent); }
      .sh-option, .sh-redirect { color: var(--text-faint); }
      .sh-string { color: var(--ok); }
      .sh-variable { color: var(--attention); }
      .sh-keyword, .sh-operator { color: var(--text-dim); }
      .sh-comment { color: var(--text-quiet); font-style: italic; }
      /* What a call is for (ADR-0173): in story, it leads the row in plain
         words where the command would, beside the tag; in raw, a caption
         under the command, whose first line keeps its place beside the tag. */
      .tool-intent { color: var(--text-dim); overflow-wrap: anywhere; }
      .tool-caption { font-size: var(--font-sm); color: var(--text-faint); overflow-wrap: anywhere; }
      /* How long a running call has run, in the ring's colour. Tabular figures,
         so a tick that keeps its count of digits keeps its width. */
      .tool-elapsed { font-size: var(--font-xs); line-height: 1.6; color: var(--attention);
        font-variant-numeric: tabular-nums; }
      .tool[data-status="ok"] .tool-status { color: var(--ok); }
      .tool[data-status="error"] .tool-status { color: var(--danger); }
      /* Its last lines, or all of them: never a scroll of its own. */
      .tool-output { clear: both; margin: var(--space-4) 0 0; padding: var(--space-5);
        background: var(--sunk); border: 1px solid var(--edge); white-space: pre-wrap;
        overflow-wrap: anywhere; font-size: var(--font-sm); }
      /* A result's images, in place of its text (`toolBody`). A tall one is a
         thumbnail in the summary, 10rem tall (THUMB_HEIGHT) through its width. */
      .tool-images { clear: both; margin: var(--space-4) 0 0; }
      .tool-images img { display: block; max-width: 100%; height: auto; margin-bottom: var(--space-4); }
      .tool-images[data-thumb] img { max-width: min(100%, calc(10rem * var(--ratio))); }
      /* What the summary hides, in words, or "less". Never selected with the
         row: the copy fallback selects `.tool` (`useCopy`). */
      .tool-more { display: block; clear: both; margin-top: var(--space-2); padding: 0;
        color: var(--text-quiet); font-size: var(--font-xs);
        user-select: none; }
      .tool-more:hover { color: var(--text-muted); }
      .tool.live { opacity: .85; }
      /* A command the work opened, still running: a ring, absolutely placed, so
         it takes no layout and the column does not move when it comes or goes.
         A call that ends within REVEAL_MS is never revealed, so it never shows
         one. The ring is 4px clear of the row on every side; the row is centred
         in the column (`.tool`'s margin). */
      .tool.live[data-revealed] { position: relative; }
      .tool.live[data-revealed]::after { content: ""; position: absolute;
        inset: -4px; border: 1px solid transparent;
        border-radius: var(--radius-sm); pointer-events: none;
        animation: tool-working 1.2s ease-in-out infinite; }
      @keyframes tool-working { 0%, 100% { border-color: color-mix(in srgb, var(--attention) 30%, transparent); }
        50% { border-color: color-mix(in srgb, var(--attention) 90%, transparent); } }
      /* Where the agent's next text will appear, while its lane runs. Zero
         height, so its margins collapse through it: as the content's last
         child or between two messages, it leaves the gap, and the height the
         follow rule reads (`.column-content`'s own), as they were. The shadow
         draws it 2px tall, and the transform lifts it to the middle of the
         gap above; neither takes layout. */
      .working-line { height: 0; width: 3rem; margin: 0 auto; box-shadow: 0 0 0 1px var(--agent);
        transform: translateY(-.5rem); animation: pulse-line 1.2s ease-in-out infinite; }
      @keyframes pulse-line { 50% { opacity: .35; transform: translateY(-.5rem) scaleX(1.6); } }
      /* The outline says a command is running; the line would say the model is. */
      .column-content:has(.tool.live[data-revealed]) .working-line { visibility: hidden; }
      /* An ask's work, folded to one line, or opened under it. */
      .ask-fold, .ask-line { display: block; width: 100%; margin: 0 0 var(--space-9); padding: var(--space-1) var(--space-6);
        text-align: left; font-size: var(--font-sm); color: var(--text-faint);
        border-left: 2px solid color-mix(in srgb, var(--agent) 33%, var(--page)); border-radius: 0; }
      .ask-fold[aria-expanded="true"] { margin-bottom: var(--space-7); }
      .ask-fold-head .ask-fold { padding-right: 4.5rem; }
      .ask-fold::before, .ask-line::before { content: "▸ "; color: var(--text-quiet); }
      .ask-fold[aria-expanded="true"]::before, .ask-line[aria-expanded="true"]::before { content: "▾ "; }
      .ask-fold:hover, .ask-line:hover { color: var(--text); }
      .ask-fold-head { position: relative; }
      /* The files an ask changed: opens their review beside the column. */
      .ask-files { position: absolute; top: .05rem; right: 0; padding: 0 var(--space-5); font-size: var(--font-xs);
        color: var(--agent); border: 1px solid color-mix(in srgb, var(--agent) 33%, var(--page)); border-radius: var(--radius-sm); }
      /* Outline's line is one line: a running command can be long. */
      .ask-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* The running ask's line stands in for the working line (ADR-0054): it
         pulses by its brightness, never its size, which would spill a line
         as wide as the column past it. */
      .ask-line.running { animation: pulse-ask 1.2s ease-in-out infinite; color: var(--agent); }
      @keyframes pulse-ask { 50% { opacity: .45; } }
      /* A model's words about an ask's work (ADR-0075, ADR-0173): one row,
         its headline marked as a model's, and its points a short list. */
      .ask-headline { color: var(--text-dim); }
      .ask-headline::before { content: "✦ "; color: var(--text-quiet); }
      .ask-digest { margin: calc(-1 * var(--space-7)) 0 var(--space-9); padding: var(--space-1) var(--space-6) var(--space-1) var(--space-9); font-size: var(--font-sm);
        line-height: 1.45; color: color-mix(in srgb, var(--agent) 23%, var(--text-dim)); border-left: 2px dotted color-mix(in srgb, var(--agent) 43%, var(--page)); }
      .ask-digest .text { margin-top: 0; }
      .ask-digest p, .ask-digest ul { margin: 0; }
      .ask-digest ul { padding-left: var(--space-9); }
      .ask-outcome { margin: calc(-1 * var(--space-7)) 0 var(--space-9); padding-left: var(--space-6); font-size: var(--font-sm); color: var(--caution); }
      /* An agent's proposal of branches, after its ask's work: never folded. */
      .proposal { margin: calc(-1 * var(--space-5)) 0 var(--space-9); padding: var(--space-6) var(--space-7); border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg); background: var(--raised); font-size: var(--font-md); }
      .proposal-rows { margin: 0 0 var(--space-6); padding-left: var(--space-10); }
      .proposal-row { margin: var(--space-2) 0; }
      .proposal-row[data-dropped] { opacity: .45; text-decoration: line-through; }
      .proposal-title { padding: 0;
        font-weight: 600; }
      .proposal-line { margin-left: var(--space-5); color: var(--text-muted); white-space: pre-wrap; }
      .proposal-brief { display: block; width: 100%; min-height: 4rem; margin: var(--space-2) 0;
        font: inherit; }
      .proposal-drop { margin-left: var(--space-4); padding: 0 var(--space-4); }
      .proposal-actions { display: flex; gap: var(--space-5); align-items: center; flex-wrap: wrap; }
      .proposal-start { font-weight: 600; }
      .proposal-open, .proposal-send { font-size: var(--font-sm); }
      .proposal-state { color: var(--text-muted); font-size: var(--font-sm); }
      /* Which ask the work at the top answers, while its message is out of
         sight. The slot is sticky and zero-height, as .jump-slot is, so the
         bar takes no room and the content's height is as it was. */
      .ask-bar-slot { position: sticky; top: -.75rem; height: 0; z-index: 2; }
      .ask-bar { position: absolute; top: 0; left: 0; right: 0; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: var(--space-2) var(--space-6);
        font-size: var(--font-sm); background: color-mix(in srgb, var(--raised) 93%, transparent); color: var(--attention); border-radius: 0;
        border-bottom: 1px solid var(--line); }
      /* Where this device last left the thread. Zero height, as the working
         line is, so its arrival moves nothing; the rule and its words are
         drawn in the gap above. */
      .left-line { position: relative; height: 0; outline: 1px dashed var(--attention);
        transform: translateY(-.5rem); }
      .left-line::after { content: attr(data-words); position: absolute; right: 0; top: -.6rem;
        padding: 0 var(--space-4); font-size: var(--font-2xs); line-height: 1.1rem; color: var(--attention); background: var(--page); }
      /* In outline, the running ask's own line says the agent works. */
      .column[data-density="outline"] .working-line { display: none; }
      /* A column's dock (ADR-0113): the queue's header, the queued cards, the
         line, your message and the notes line, pinned to the column's foot.
         At most a third of the column: past that it scrolls within, its
         head (the changes row and the queue header, one block) kept in view. */
      .dock { flex: 0 0 auto; max-height: 33%; overflow-y: auto; border-top: 1px solid var(--edge); }
      .dock-head { position: sticky; top: 0; z-index: 1; background: var(--page); }

      /* What a line command refused or failed says, above the footer, until
         dismissed or your next command there. */
      .toast { position: fixed; right: .75rem; bottom: 52px; z-index: 20; display: flex;
        align-items: center; gap: var(--space-7); max-width: min(36rem, calc(100vw - 1.5rem));
        padding: var(--space-6) var(--space-7) var(--space-6) var(--space-8); background: var(--chrome); --surface: var(--chrome);
        color: var(--attention); border: 1px solid color-mix(in srgb, var(--attention) 33%, var(--page)); border-radius: var(--radius-lg); font-size: var(--font-md);
        box-shadow: 0 4px 16px var(--shadow); }
      .toast-text { flex: 1 1 auto; min-width: 0; }
      .toast-action { flex: 0 0 auto; padding: var(--space-2) var(--space-6); color: var(--text-soft);
        border-radius: var(--radius-pill); white-space: nowrap; }
      .toast-dismiss { flex: 0 0 auto; padding: 0 var(--space-2); color: var(--text-faint);
        font-size: var(--font-2xl); line-height: 1; }
      .menu-heading { margin: var(--space-1) var(--space-6) var(--space-4); font-size: var(--font-sm); color: var(--text-faint); }
      /* A later section of a menu: its heading under a rule. Notes say how
         things stand, as text, not as items. A choice's ✓ keeps its column
         whether it is chosen or not, so the names line up. */
      .menu-section { display: flex; flex-direction: column; }
      fieldset.menu-section { min-width: 0; margin: 0; padding: 0; border: 0; }
      .menu-section + .menu-section { margin-top: var(--space-3); padding-top: var(--space-3);
        border-top: 1px solid var(--line); }
      /* A first section that only names its menu draws nothing, and no rule
         under it. */

      .menu-note { margin: var(--space-1) var(--space-6) var(--space-4); font-size: var(--font-sm); color: var(--text-muted); }
      .menu .menu-check { display: inline-block; width: var(--menu-check); color: var(--agent); }
      .here-thread, .inbox-row { display: flex; flex-direction: column; max-width: 22rem; }
      .here-root, .inbox-who { font-size: var(--font-xs); color: var(--text-faint); }
      .here-name { font-family: ui-monospace, monospace; font-size: var(--font-sm); color: var(--text-soft); }
      .here-at, .inbox-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .inbox-row.unseen .inbox-text { font-weight: 600; }
      .inbox-row.unseen .inbox-who::before { content: "● "; color: var(--attention); font-size: var(--font-2xs); }
      /* A row a thread you follow raises (ADR-0077): its reason in amber, and
         its "not needed" a quiet item under it. */
      .here-thread.raised.needs-you .here-at { color: var(--attention); }
      .here-thread.raised.worth-a-read .here-at { color: color-mix(in srgb, var(--attention) 73%, var(--text-faint)); }
      .menu button.not-needed { padding: 0 var(--space-6) var(--space-4) var(--space-10); font-size: var(--font-xs); color: var(--text-faint); }
      /* The name field (`name-input.tsx`), on your profile page as on the
         identification screen below. */
      .profile-name label { display: flex; justify-content: space-between;
        align-items: center; gap: var(--space-6); }
      .profile-name input { flex: 1; padding: var(--space-4) var(--space-5); }
      /* Who you are, asked once per device before anything connects (ADR-0037). */
      #identity { grid-column: 1 / 3; align-self: start; display: flex; flex-direction: column;
        gap: var(--space-7); width: 20rem; margin: 20vh auto 0; padding: var(--space-10); border: 1px solid var(--edge); border-radius: var(--radius-xl);
        background: var(--raised); }
      #identity label { display: flex; justify-content: space-between;
        align-items: center; gap: var(--space-6); }
      #identity input { flex: 1; padding: var(--space-4) var(--space-5); }
      #identity button { align-self: flex-end; padding: var(--space-4) var(--space-9); }
      .identity-problem, .name-problem { margin: 0; color: var(--danger-soft); font-size: var(--font-lg); }
      .name-handle { margin: 0; color: var(--text-faint); font-size: var(--font-md); }
      /* The menu your avatar opens (ADR-0098): who you are, above its items,
         then, folded, a count beside an item's name. */
      .account .menu { min-width: 15rem; }
      .account-lead { display: flex; align-items: center; gap: var(--space-7); margin: var(--space-3) var(--space-6) var(--space-5);
        padding-bottom: var(--space-6); border-bottom: 1px solid var(--line); }
      .account-lead .initial { flex: none; width: 32px; height: 32px; line-height: 32px; font-size: 15px; }
      .account-who { display: flex; flex-direction: column; min-width: 0; }
      .account-name { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; }
      .account-who .profile-email { color: var(--text-faint); font-size: var(--font-sm); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .account-inbox, .account-inventory { display: flex; align-items: center; gap: var(--space-6); }
      .menu-badge, .menu-count { margin-left: auto; padding: 0 var(--space-4); border-radius: var(--radius-pill);
        font-size: var(--font-xs); font-weight: 600; }
      .menu-badge { --fill: var(--attention); background: var(--fill); }
      .menu-count { color: var(--text-faint); font-weight: 400; }

      /* A page over the stage (ADR-0098): in the stage's cell, after
         it and as high as the board, so it covers both; the footer's menus
         (4) open over it. */
      .page { grid-column: 2; grid-row: 1; position: relative; z-index: 3; min-height: 0;
        overflow-y: auto; background: var(--page); }
      .page-head { display: flex; align-items: center; gap: var(--space-9); max-width: 36rem;
        margin: 0 auto; padding: var(--space-10) var(--space-11) var(--space-6); }
      .page-head h1 { margin: 0; font-size: var(--font-3xl); letter-spacing: 0; text-transform: none;
        color: var(--text); outline: none; }
      .page-back { padding: var(--space-2) var(--space-7); color: var(--text-muted);
        border-radius: var(--radius-pill); font-size: var(--font-md); }
      .page-back:hover { color: var(--text); border-color: var(--line-hover); }
      .page-body { max-width: 36rem; margin: 0 auto; padding: var(--space-6) var(--space-11) var(--space-12); }
      /* Your profile page: your picture (ADR-0098), then your name. */
      .picture-field { display: flex; flex-direction: column; gap: var(--space-6); margin-bottom: var(--space-10); }
      .picture-current { display: flex; align-items: center; gap: var(--space-9); }
      .initial.picture-large { width: 96px; height: 96px; line-height: 96px; font-size: 40px; }
      .picture-actions { display: flex; align-items: center; gap: var(--space-6); }
      .picture-actions button { padding: var(--space-3) var(--space-8); color: var(--text-muted);
        border: 1px solid var(--line-strong); border-radius: var(--radius-pill); font-size: var(--font-md); }
      .picture-actions button:hover:not(:disabled) { color: var(--text); border-color: var(--line-hover); }
      .picture-actions .picture-use { border-color: var(--action); }
      .picture-crop { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-7); }
      /* The canvas is drawn at twice its size, for sharp pixels on a dense screen. */
      .picture-preview { width: 200px; height: 200px; border-radius: 50%; cursor: grab;
        touch-action: none; box-shadow: 0 0 0 1px var(--line-strong); }
      .picture-preview:active { cursor: grabbing; }
      .picture-zoom { display: flex; align-items: center; gap: var(--space-6); color: var(--text-faint); font-size: var(--font-md); }
      .picture-problem { margin: 0; color: var(--danger-soft); font-size: var(--font-lg); }
      /* Your profile page. */
      .profile-name { display: flex; flex-direction: column; gap: var(--space-5); }
      .profile-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-8); }
      .profile-save { padding: var(--space-4) var(--space-9); }
      .profile-saved { color: var(--text-faint); font-size: var(--font-md); }
      .profile-page .profile-email { margin: var(--space-10) 0 0; padding-top: var(--space-8);
        border-top: 1px solid var(--line); color: var(--text-muted); font-size: var(--font-lg); }
      /* The setup page: what the host read of its config. */
      .setup-page h2 { margin: var(--space-10) 0 var(--space-5); font-size: var(--font-md); color: var(--text-faint);
        text-transform: uppercase; letter-spacing: .04em; }
      .setup-page h3 { margin: var(--space-8) 0 var(--space-3); font-size: var(--font-md); color: var(--text-muted); }
      .setup-page p, .setup-page li, .setup-page dd { color: var(--text-dim); font-size: var(--font-lg); }
      .setup-page ul { margin: 0; padding-left: var(--space-9); }
      .setup-page dl { margin: 0; }
      .setup-page dl > div { display: grid; grid-template-columns: 11rem 1fr; gap: var(--space-6);
        padding: var(--space-2) 0; }
      .setup-page dt { color: var(--text-faint); font-size: var(--font-md); overflow-wrap: anywhere; }
      .setup-page dd { margin: 0; overflow-wrap: anywhere; }
      .setup-page dd span { color: var(--text-faint); font-size: var(--font-sm); }
      .setup-model[data-none="true"], .setup-refusals li { color: var(--attention); }
      .setup-hint { color: var(--text-faint); }
      .composer-setup { color: var(--attention); font-size: var(--font-md); }

      /* The sidebar folded (ADR-0088), after the rules these refine: your pip
         on an icon's corner, and the footer's corner holding only your
         avatar, which carries the inbox's badge (ADR-0098). */
      .open-icon .signal[data-signal="unsent"] { position: absolute; top: auto; bottom: -2px; right: -2px; }
      :root[data-list="icons"] .footer-you { justify-content: center; padding: 0; }
      :root[data-list="icons"] .footer-you .account { flex: none; }
      :root[data-list="icons"] .me-trigger { padding: var(--space-2); }

      /* A search of the root you are on (ADR-0101). The bar lies across the
         workspace's top, its 🔍 over the rail where it sat, in a tint and a
         shadow of its own: what is under it is not the threads. */
      .search-lead { display: flex; justify-content: center; align-items: center;
        min-width: 3rem; padding: var(--space-4) var(--space-3); }
      .search-toggle { padding: var(--space-1) var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md);
        color: var(--text-muted); font-size: var(--font-lg); line-height: 1.2; }
      .search-toggle:hover { border-color: var(--line-strong); }
      .search-toggle[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 20%, var(--page)); border-color: color-mix(in srgb, var(--agent) 40%, var(--page)); color: var(--text-bright); }
      .search-bar { position: relative; z-index: 4; flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-7);
        padding-right: var(--space-8); background: color-mix(in srgb, var(--accent) 8%, var(--page)); border-bottom: 1px solid color-mix(in srgb, var(--accent) 24%, var(--page));
        box-shadow: 0 2px 10px var(--shadow); font-size: var(--font-lg); color: var(--text-dim);
        animation: search-in .14s ease-out; }
      .search-box { position: relative; display: flex; align-items: center; flex: 0 1 24rem; }
      .search-field { flex: 1; min-width: 0; padding: var(--space-4) 1.8rem var(--space-4) var(--space-6); border: 1px solid color-mix(in srgb, var(--accent) 31%, var(--page));
        border-radius: var(--radius-md); background: var(--sunk); color: var(--text); font: inherit; }
      .search-clear { position: absolute; right: .25rem; padding: 0 var(--space-3);
        color: var(--text-muted); font-size: var(--font-lg); }
      .search-line { flex: 1; min-width: 0; color: var(--text-muted); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; }
      .search-done { padding: var(--space-2) var(--space-8); border: 1px solid color-mix(in srgb, var(--agent) 40%, var(--page)); border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--accent) 20%, var(--page)); color: var(--text-bright); }
      @keyframes search-in { from { transform: translateY(-100%); opacity: 0; } }

      /* While a search finds something, the rail dims what it does not find,
         rings what it does, and hides the columns' views, which are covered. */
      .rail[data-searching] [data-match="0"], .rail[data-searching] svg path { opacity: .25; }
      .rail[data-searching] [data-match]:not([data-match="0"]) { outline: 2px solid var(--highlight);
        outline-offset: 1px; }
      .rail[data-searching] .rail-view, .rail[data-searching] .rail-tick { display: none; }
      /* A column under a search: its thread stays, covered and inert, and its
         matches are laid over it (S126). Only .column-content must stay
         unpositioned (above); .column-below is the messages' offsetParent. */
      .column-below { position: relative; flex: 1; min-height: 0; display: flex;
        flex-direction: column; }
      .column-under { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .match-list { position: absolute; inset: 0; z-index: 3; overflow-y: auto; display: flex;
        flex-direction: column; gap: var(--space-5); padding: var(--space-7) var(--space-8); background: var(--panel); }
      .match-row { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-5) var(--space-7);
        border: 1px solid var(--line); border-left: 3px solid var(--track, var(--slot-pending)); border-radius: var(--radius-md);
        background: var(--raised); text-align: left; }
      .match-row:hover, .match-row:focus-visible { border-color: var(--track, var(--slot-pending)); }
      .match-head { display: flex; gap: var(--space-6); font-size: var(--font-sm); color: var(--text-faint); }
      .match-who { color: var(--text-soft); font-weight: 600; }
      .match-ask { font-size: var(--font-sm); color: var(--text-faint); }
      .match-text { font-size: var(--font-lg); line-height: 1.4; overflow-wrap: anywhere; }
      .match-text mark { padding: 0 1px; border-radius: var(--radius-xs); --fill: var(--highlight); background: var(--fill); }
      .match-gap { padding: var(--space-2) 0; color: var(--text-quiet); font-size: var(--font-sm); text-align: center; }
      .match-none { margin: var(--space-3) 0; color: var(--text-quiet); }
      .match-count { color: var(--highlight); font-size: var(--font-sm); white-space: nowrap; }
      /* Where leaving a search landed: an outline in the column's colour, fading. */
      .msg[data-landed] { animation: landed 1.6s ease-out; }
      @keyframes landed { 0%, 50% { outline: 2px solid var(--track, var(--slot-pending)); outline-offset: 2px; }
        100% { outline: 2px solid transparent; outline-offset: 2px; } }
      /* The drag engine's looks (use-drag.ts), last: they draw over a card's own. */
      /* What is dragged only translates: a scaled, rotated or shadowed column
         costs frames on a slow machine. Its header rises instead, leaning with
         the pointer's speed (--lean). */
      #strip > [data-dragging] { position: relative; z-index: 2; background: var(--page); }
      [data-dragging] > [data-column-head], [data-dragging] > .card-head,
      [data-dragging] > [data-drag-canvas] {
        box-shadow: 0 10px 24px var(--shadow); transform: rotate(var(--lean, 0deg));
        transition: transform 80ms linear; position: relative; z-index: 1; }
      .card-frame[data-dragging], .card-grid-cell[data-dragging], .thread-card[data-dragging],
      .sidebar-item[data-dragging] { position: relative; z-index: 20; }
      /* A column off the strip is drawn at compact's size, under the pointer:
         its header, copied. */
      .drag-ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
        width: var(--compact-w); height: var(--compact-h); overflow: hidden;
        margin: -1rem 0 0 calc(var(--compact-w) / -2);
        background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
        box-shadow: 0 12px 28px var(--shadow); }
      /* A card flying into your inventory: a ghost on the page, as its slot
         draws it, landing on the slot's box as laid out (S243). */
      .flight-ghost { position: fixed; z-index: 30; pointer-events: none; transform-origin: 0 0;
        overflow: hidden; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-md); }
      .flight-ghost > * { width: 100%; height: 100%; padding: 0; text-align: left;
        background: none; border: 0; }
      /* What a drop there would do. */
      [data-drop-mark="move"] { outline: 2px solid var(--accent); outline-offset: -2px; }
      [data-drop-mark="copy"] { outline: 2px dashed var(--accent); outline-offset: -2px; }
      [data-drop-mark="replace"] { outline: 2px solid var(--inventory); outline-offset: -2px; }
      [data-drop-mark="refused"] { outline: 2px solid var(--text-quiet); outline-offset: -2px; opacity: .6; }
      /* Held over a canvas in the sidebar, or ▦: a ring fills until it opens. */
      [data-hover-open] { position: relative; }
      [data-hover-open]::after { content: ""; position: absolute; inset: -2px; border-radius: var(--radius-lg);
        border: 2px solid var(--accent); animation: hover-open 600ms linear forwards; pointer-events: none; }
      @keyframes hover-open { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @media (prefers-reduced-motion: reduce) {

        [data-dragging] > [data-drag-canvas] { transform: none; transition: none; }
        [data-hover-open]::after { animation: none; }
      }
