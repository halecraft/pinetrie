      .start-menu .start-trigger:hover .start-words { text-decoration: underline; }
      .start-menu .start-caret { flex: none; margin-left: .35rem; }
      .start-line:has(.start-fork-conflict) { flex-direction: column; }
      .start-fork-conflict { font-size: .72rem; color: #d0a15f; }
      .menu-section:has([role="menuitemradio"]) [role="menuitem"] { padding-left: 1.6rem; }
      .start-menu .start-detail { display: block; margin-left: 1.1rem; font-size: .72rem; color: #8b93a1; }
      .status { font-size: .75rem; color: #d0a15f; }
      input, .card-editor textarea {
        flex: 1; padding: .5rem .7rem; border-radius: 6px;
        border: 1px solid #2c313a; background: #1b1e24; color: inherit; font: inherit;
      }

      /* A branch's header and its fork dots share a colour slot; hovering one
         outlines the other. CSS can't match two attributes' values, so there
         is a selector pair per palette slot (`palette.ts`, held by
         colors.test.ts), all sharing one outline. */
      #strip:has(.column-head[data-color="0"]:hover) .fork-dot[data-color="0"],
      #strip:has(.fork-dot[data-color="0"]:hover) .column-head[data-color="0"],
      #strip:has(.column-head[data-color="1"]:hover) .fork-dot[data-color="1"],
      #strip:has(.fork-dot[data-color="1"]:hover) .column-head[data-color="1"],
      #strip:has(.column-head[data-color="2"]:hover) .fork-dot[data-color="2"],
      #strip:has(.fork-dot[data-color="2"]:hover) .column-head[data-color="2"],
      #strip:has(.column-head[data-color="3"]:hover) .fork-dot[data-color="3"],
      #strip:has(.fork-dot[data-color="3"]:hover) .column-head[data-color="3"],
      #strip:has(.column-head[data-color="4"]:hover) .fork-dot[data-color="4"],
      #strip:has(.fork-dot[data-color="4"]:hover) .column-head[data-color="4"],
      #strip:has(.column-head[data-color="5"]:hover) .fork-dot[data-color="5"],
      #strip:has(.fork-dot[data-color="5"]:hover) .column-head[data-color="5"],
      #strip:has(.column-head[data-color="6"]:hover) .fork-dot[data-color="6"],
      #strip:has(.fork-dot[data-color="6"]:hover) .column-head[data-color="6"],
      #strip:has(.column-head[data-color="7"]:hover) .fork-dot[data-color="7"],
      #strip:has(.fork-dot[data-color="7"]:hover) .column-head[data-color="7"],
      #strip:has(.column-head[data-color="8"]:hover) .fork-dot[data-color="8"],
      #strip:has(.fork-dot[data-color="8"]:hover) .column-head[data-color="8"],
      #strip:has(.column-head[data-color="9"]:hover) .fork-dot[data-color="9"],
      #strip:has(.fork-dot[data-color="9"]:hover) .column-head[data-color="9"],
      #strip:has(.column-head[data-color="10"]:hover) .fork-dot[data-color="10"],
      #strip:has(.fork-dot[data-color="10"]:hover) .column-head[data-color="10"],
      #strip:has(.column-head[data-color="11"]:hover) .fork-dot[data-color="11"],
      #strip:has(.fork-dot[data-color="11"]:hover) .column-head[data-color="11"],
      #strip:has(.column-head[data-color="pending"]:hover) .fork-dot[data-color="pending"],
      #strip:has(.fork-dot[data-color="pending"]:hover) .column-head[data-color="pending"] {
        outline: 2px solid var(--track); outline-offset: 2px; }
      /* The footer (ADR-0122): one row of chrome, split where the sidebar's edge
         is. Its own cell, at the list's width, is yours: you, your inbox
         (ADR-0091) and your inventory (ADR-0098). Then everyone's: the board's strip,
         with where the agent works and what is ready to accept, "syncing…"
         while pending, and the publish button (ADR-0090). Nothing here
         animates: the sidebar, the column and the rail show where the agent
         works. */
      #bottom { grid-column: 1 / 3; grid-row: 2; display: flex; align-items: center;
        gap: 1rem; min-height: 42px; padding-right: .6rem; background: var(--chrome);
        --surface: var(--chrome); box-shadow: inset 0 1px 0 var(--edge); font-size: .8rem; }
      /* Your corner (ADR-0098): you on the left, your inbox and inventory as
         icons of one style on the right, with the sidebar's hover fill and no
         borders. Amber, the inbox's badge, is its only colour beside yours.
         Its left padding lines your avatar up with the sidebar's items. */
      .footer-you { flex: 0 0 var(--side); align-self: stretch; display: flex; align-items: center;
        gap: .5rem; min-width: 0; padding: 0 .4rem 0 .45rem; box-shadow: inset -1px 0 0 var(--edge); }
      .footer-you .account { display: flex; flex: 1 1 auto; min-width: 0; }
      .footer-tools { display: flex; flex: none; align-items: center; gap: .25rem; }
      .me-trigger { position: relative; display: inline-flex; align-items: center; gap: .5rem;
        min-width: 0; max-width: 100%; padding: .2rem .4rem .2rem .2rem; background: none;
        color: #aab4c3; border-radius: 6px; }
      .me-trigger .initial { flex: none; width: 24px; height: 24px; line-height: 24px; font-size: 12px; }
      .me-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .inbox-trigger, .inventory-toggle { position: relative;
        display: inline-flex; align-items: center; justify-content: center; gap: .2rem;
        min-width: 28px; height: 28px; padding: 0 .3rem; background: none; color: #8b93a1;
        border: 0; border-radius: 6px; }
      .me-trigger:hover, .inbox-trigger:hover, .inventory-toggle:hover,
      .account.open .me-trigger, .inbox.open .inbox-trigger {
        background: #1b1e24; --surface: #1b1e24; color: #e6e6e6; }
      .inventory-toggle[aria-pressed="true"] { color: var(--on); background: var(--page);
        --surface: var(--page); }
      .icon { flex: none; display: block; }
      /* A block, an icon would put its button's label on a line of its own;
         so a button that holds one lays out in a row. `:where` keeps this
         under every button's own layout. */
      :where(button:has(> .icon)) { display: inline-flex; align-items: center; gap: .3rem; }
      .inventory-count { font-size: .72rem; font-variant-numeric: tabular-nums; }
      .footer-right { margin-left: auto; display: flex; align-items: center; gap: .75rem; }
      .sync-note { font-size: .75rem; color: #6f7784; }
      /* The board's strip: ▦, then each state's name, count, readers and
         mark; while the board is open, its search and "mine" in their place
         (ADR-0115). */
      .board-strip { display: flex; align-items: center; gap: .9rem; min-width: 0;
        overflow-x: auto; }
      .board-toggle, .strip-state { display: inline-flex; align-items: center; gap: .35rem;
        padding: .2rem .4rem; background: none; color: #aab4c3; white-space: nowrap; }
      .board-toggle { color: #c9d1d9; font-weight: 600; }
      .board-toggle[aria-expanded="true"] { background: var(--page); }
      .board-toggle .glyph { color: #8b949e; }
      .strip-count { color: #e6e6e6; font-weight: 600; }
      /* A filter is on, the board closed: blue, the board's accent, never the
         amber that asks something of you. */
      .board-filtered { color: #8ab4f8; font-weight: 400; }
      /* The search in the strip: it shrinks on a narrow window. A filter is
         marked by the field's border, and focus by an outline drawn inside
         it: the strip scrolls sideways, which clips anything drawn outside
         its box. */
      .board-search-box { position: relative; display: inline-flex; flex: 0 1 18rem; min-width: 8rem; }
      .board-search { flex: 1; min-width: 0; padding: .25rem 1.6rem .25rem .5rem; background: var(--page);
        color: #ddd; border: 1px solid var(--edge); border-radius: 4px; font: inherit; }
      .board-search[data-filtered] { border-color: #8ab4f8; }
      .board-search:focus-visible { outline: 2px solid #8ab4f8; outline-offset: -2px; }
      .board-search-clear { position: absolute; top: 0; bottom: 0; right: .15rem; padding: 0 .35rem;
        background: none; color: #8b93a1; font-size: .95rem; line-height: 1; }
      .board-search-clear:hover, .board-search-clear:focus-visible { color: #e6e6e6; }
      .board-mine { flex: none; color: #8b949e; font-size: .75rem; white-space: nowrap; }
      /* A state's roots the agent works in, and with work ready to accept
         (ADR-0091), in the strip and in a column's head: facts, muted, never
         a badge, never moving. ⇡ is blue on a thread card, apart from the
         amber that asks something of you. */
      .state-working, .state-ready { font-size: .75rem; color: #8b93a1; }
      .root-ready { flex: 0 0 auto; color: #8ab4f8; font-size: .8rem; line-height: 1; }
      .reader-trigger { display: inline-flex; align-items: center; gap: .3rem;
        padding: .1rem .3rem; background: none; color: #ddd; border-radius: 999px; }
      .reader-trigger .initial { width: 22px; height: 22px; line-height: 22px; font-size: 12px; }
      /* The board, open (ADR-0122): over the columns, from the footer's edge,
         moving none of them. A column per open state, and the closed
         state's, marked ✓, with its count and rows; they scroll,
         and the filter's banner stays at the foot (ADR-0115). */
      #board { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; max-height: 70%;
        display: flex; flex-direction: column; gap: .6rem; padding: .9rem;
        background: #111317;
        border-top: 1px solid var(--edge); box-shadow: 0 -12px 24px #0008;
        font-size: .8rem; color: #c9d1d9; --surface: #111317; }
      /* A grid, not a flex row: its one row is as tall as the tallest
         column, so every column runs the board's whole scroll height and its
         sticky head stays in view. A flex row would stretch them only to the
         board's visible height. Every state's column one width, the
         archive's too: on a narrow window they keep it and the board scrolls
         sideways. */
      .board-states { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(14rem, 1fr);
        gap: .75rem; min-height: 0; overflow: auto; padding: .35rem; margin: -.35rem; }
      .board-column, .board-archive { display: flex; flex-direction: column; gap: .4rem; }
      .archive-mark { color: #8b949e; font-size: .75rem; line-height: 1; }
      /* As tall as a head with its ⋯, so the archive's, without one, lines up.
         It sticks as the cards scroll under it. Chrome sticks it inside the
         scroller's padding, where scrolled cards would show above it, so it
         reaches up over that padding, and its text does not move as it
         sticks. Its menus are in the top layer, so it clips none. */
      .board-head { display: flex; align-items: center; gap: .4rem; min-height: calc(20px + .35rem);
        position: sticky; top: -.35rem; z-index: 1; padding-top: .35rem; margin-top: -.35rem;
        background: var(--surface); }
      .state-name { padding: 0; background: none; color: #8b949e; font-size: .7rem; font-weight: 600;
        letter-spacing: .06em; text-transform: uppercase; }
      .state-name-input { width: 9rem; padding: .1rem .4rem; background: var(--page); color: #e6e6e6;
        border: 1px solid #3a3f48; border-radius: 4px; font: inherit; }
      .board-count { color: #6f7784; font-size: .7rem; }
      .board-count[data-kept] { color: #8ab4f8; }
      /* The filter's banner, at the board's foot: blue, as the counts it
         explains. */
      .board-filter { flex: none; display: flex; align-items: center; gap: .75rem;
        padding: .35rem .6rem; border-left: 2px solid #8ab4f8; border-radius: 0 4px 4px 0;
        background: #8ab4f81a; color: #c9d1d9; }
      .board-filter-words { flex: 1; min-width: 0; }
      .board-filter-clear { flex: none; padding: .1rem .55rem; background: none; color: #8ab4f8;
        border: 1px solid #8ab4f866; border-radius: 999px; font-size: .75rem; }
      .board-filter-clear:hover, .board-filter-clear:focus-visible { color: #e6e6e6; border-color: #8ab4f8; }
      .state-more { position: relative; margin-left: auto; }
      .state-menu, .item-menu { padding: 0 .3rem; background: none; color: #aaa; }
      .board-cards { position: relative; display: flex; flex-direction: column; gap: .4rem;
        min-height: 1.5rem; }
      .thread-card { position: relative; display: flex; flex-direction: column; gap: .2rem;
        padding: .5rem .6rem; background: var(--page); border: 1px solid var(--edge);
        border-radius: 6px; --surface: var(--page); }
      /* Where a dragged root would land (use-drag.ts): a line in the gap
         above the card it goes before, or below a column's last card. The
         archive keeps no order of its own, so it is outlined whole. The
         card dragged stays, dimmed, in its place until it is dropped. */
      .thread-card[data-root-drop]::before, .board-column[data-root-drop] > .board-cards::after {
        content: ""; position: absolute; left: -1px; right: -1px; height: 3px;
        border-radius: 2px; background: #8ab4f8; pointer-events: none; }
      .thread-card[data-root-drop]::before { top: calc(-.2rem - 2.5px); }
      .board-column[data-root-drop] > .board-cards::after { bottom: calc(-.2rem - 1.5px); }
      .board-column[data-root-drop] > .board-cards:empty::after { top: calc(50% - 1.5px); bottom: auto; }
      .board-archive[data-root-drop] { outline: 2px solid #8ab4f8; outline-offset: .3rem;
        border-radius: 4px; }
      .board-open { display: flex; gap: .35rem; align-items: center; padding: 0; background: none;
        color: #e6e6e6; text-align: left; line-height: 1.25; }
      .board-label { flex: 1; min-width: 0; }
      /* A titled card's first line, under its header (ADR-0111). */
      .board-body { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: .75rem; color: #8b949e; }
      .board-meta { display: flex; align-items: center; gap: .4rem; min-height: 22px; }
      .board-writers { color: #8b949e; font-size: .72rem; }
      .readers { display: inline-flex; gap: .1rem; margin-left: auto; }
      .item-more { position: absolute; top: .3rem; right: .3rem; visibility: hidden; }
      .thread-card:hover .item-more, .thread-card:focus-within .item-more, .item-more.open { visibility: visible; }
      /* Your inbox (ADR-0091): the page's one badge, amber; quiet at zero.
         Beside its icon; folded, on your avatar's corner (ADR-0098), ringed in
         what it sits on so it reads as apart from the circle. */
      .inbox-badge { min-width: 1rem; height: 1rem; padding: 0 .25rem; line-height: 1rem;
        border-radius: 999px; background: #e0c080; color: #111; font-size: .72rem;
        font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
      .inbox-trigger:has(.inbox-badge) { color: #ddd; }
      .me-trigger .inbox-badge { position: absolute; top: -4px; right: -6px;
        box-shadow: 0 0 0 2px var(--surface); }
      /* The publish button (ADR-0090): a title that leads with a refusal
         marks it, so you hover before you click. */
      .publish-button { padding: .15rem .6rem; font-size: .8rem; background: none; color: #ddd;
        border: 1px solid #3a3f48; border-radius: 999px; }
      .publish-button[data-refused] { color: #e8c07a; border-color: #5a4a2a; }
      /* What a line command refused or failed says, above the footer, until
         dismissed or your next command there. */
      .toast { position: fixed; right: .75rem; bottom: 52px; z-index: 20; display: flex;
        align-items: center; gap: .6rem; max-width: min(36rem, calc(100vw - 1.5rem));
        padding: .5rem .6rem .5rem .8rem; background: var(--chrome); --surface: var(--chrome);
        color: #e8c07a; border: 1px solid #5a4a2a; border-radius: 6px; font-size: .8rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .4); }
      .toast-text { flex: 1 1 auto; min-width: 0; }
      .toast-action { flex: 0 0 auto; padding: .15rem .5rem; background: none; color: #ddd;
        border: 1px solid #3a3f48; border-radius: 999px; white-space: nowrap; }
      .toast-dismiss { flex: 0 0 auto; padding: 0 .2rem; background: none; color: #8b93a1;
        font-size: 1rem; line-height: 1; }
      .menu-heading { margin: .1rem .5rem .3rem; font-size: .75rem; color: #8b93a1; }
      /* A later section of a menu: its heading under a rule. Notes say how
         things stand, as text, not as items. A choice's ✓ keeps its column
         whether it is chosen or not, so the names line up. */
      .menu-section { display: flex; flex-direction: column; }
      fieldset.menu-section { min-width: 0; margin: 0; padding: 0; border: 0; }
      .menu-section + .menu-section { margin-top: .25rem; padding-top: .25rem;
        border-top: 1px solid #2c313a; }
      /* A first section that only names its menu draws nothing, and no rule
         under it. */
      .menu-section:empty { display: none; }
      .menu-section:empty + .menu-section { margin-top: 0; padding-top: 0; border-top: 0; }
      .menu-note { margin: .1rem .5rem .3rem; font-size: .75rem; color: #aab4c3; }
      .menu .menu-check { display: inline-block; width: 1.1rem; color: #9ecbff; }
      .here-thread, .inbox-row { display: flex; flex-direction: column; max-width: 22rem; }
      .here-root, .inbox-who { font-size: .72rem; color: #8b93a1; }
      .here-name { font-family: ui-monospace, monospace; font-size: .75rem; color: #d7dde6; }
      .here-at, .inbox-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .inbox-row.unseen .inbox-text { font-weight: 600; }
      .inbox-row.unseen .inbox-who::before { content: "● "; color: #e0c080; font-size: .6rem; }
      /* A row a thread you follow raises (ADR-0077): its reason in amber, and
         its "not needed" a quiet item under it. */
      .here-thread.raised.needs-you .here-at { color: #e0c080; }
      .here-thread.raised.worth-a-read .here-at { color: #c9b48a; }
      .menu button.not-needed { padding: 0 .5rem .3rem 1.2rem; font-size: .72rem; color: #8b93a1; }
      /* The name field (`name-input.tsx`), on your profile page as on the
         identification screen below. */
      .profile-name label { display: flex; justify-content: space-between;
        align-items: center; gap: .5rem; }
      .profile-name input { flex: 1; padding: .3rem .45rem; }
      /* Who you are, asked once per device before anything connects (ADR-0037). */
      #identity { grid-column: 1 / 3; align-self: start; display: flex; flex-direction: column;
        gap: .6rem; width: 20rem; margin: 20vh auto 0; padding: 1.25rem; border: 1px solid #23272e; border-radius: 8px;
        background: #1b1e24; }
      #identity label { display: flex; justify-content: space-between;
        align-items: center; gap: .5rem; }
      #identity input { flex: 1; padding: .3rem .45rem; }
      #identity button { align-self: flex-end; padding: .3rem .9rem; }
      .identity-problem, .name-problem { margin: 0; color: #f0a0a0; font-size: .85rem; }
      .name-handle { margin: 0; color: #8b93a1; font-size: .8rem; }
      /* The menu your avatar opens (ADR-0098): who you are, above its items,
         then, folded, a count beside an item's name. */
      .account .menu { min-width: 15rem; }
      .account-lead { display: flex; align-items: center; gap: .6rem; margin: .25rem .5rem .4rem;
        padding-bottom: .5rem; border-bottom: 1px solid #2c313a; }
      .account-lead .initial { flex: none; width: 32px; height: 32px; line-height: 32px; font-size: 15px; }
      .account-who { display: flex; flex-direction: column; min-width: 0; }
      .account-name { color: #e6e6e6; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; }
      .account-who .profile-email { color: #8b93a1; font-size: .75rem; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .account-inbox, .account-inventory { display: flex; align-items: center; gap: .5rem; }
      .menu-badge, .menu-count { margin-left: auto; padding: 0 .3rem; border-radius: 999px;
        font-size: .72rem; font-weight: 600; }
      .menu-badge { background: #e0c080; color: #111; }
      .menu-count { color: #8b93a1; font-weight: 400; }

      /* A page over the stage (ADR-0098): in the stage's cell, after
         it and as high as the board, so it covers both; the footer's menus
         (4) open over it. */
      .page { grid-column: 2; grid-row: 1; position: relative; z-index: 3; min-height: 0;
        overflow-y: auto; background: var(--page); }
      .page-head { display: flex; align-items: center; gap: 1rem; max-width: 36rem;
        margin: 0 auto; padding: 1.25rem 1.5rem .5rem; }
      .page-head h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0; text-transform: none;
        color: #e6e6e6; outline: none; }
      .page-back { padding: .2rem .6rem; background: none; color: #aab4c3;
        border: 1px solid #3a3f48; border-radius: 999px; font-size: .8rem; }
      .page-back:hover { color: #e6e6e6; border-color: #5a606b; }
      .page-body { max-width: 36rem; margin: 0 auto; padding: .5rem 1.5rem 2rem; }
      /* Your profile page: your picture (ADR-0098), then your name. */
      .picture-field { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.25rem; }
      .picture-current { display: flex; align-items: center; gap: 1rem; }
      .initial.picture-large { width: 96px; height: 96px; line-height: 96px; font-size: 40px; }
      .picture-actions { display: flex; align-items: center; gap: .5rem; }
      .picture-actions button { padding: .25rem .7rem; background: none; color: #aab4c3;
        border: 1px solid #3a3f48; border-radius: 999px; font-size: .8rem; }
      .picture-actions button:hover:not(:disabled) { color: #e6e6e6; border-color: #5a606b; }
      .picture-actions .picture-use { background: #2f6feb; color: #fff; border-color: #2f6feb; }
      .picture-crop { display: flex; flex-direction: column; align-items: flex-start; gap: .6rem; }
      /* The canvas is drawn at twice its size, for sharp pixels on a dense screen. */
      .picture-preview { width: 200px; height: 200px; border-radius: 50%; cursor: grab;
        touch-action: none; box-shadow: 0 0 0 1px #3a3f48; }
      .picture-preview:active { cursor: grabbing; }
      .picture-zoom { display: flex; align-items: center; gap: .5rem; color: #8b93a1; font-size: .8rem; }
      .picture-problem { margin: 0; color: #f0a0a0; font-size: .85rem; }
      /* Your profile page. */
      .profile-name { display: flex; flex-direction: column; gap: .4rem; }
      .profile-actions { display: flex; align-items: center; justify-content: flex-end; gap: .75rem; }
      .profile-save { padding: .3rem .9rem; }
      .profile-saved { color: #8b93a1; font-size: .8rem; }
      .profile-page .profile-email { margin: 1.25rem 0 0; padding-top: .75rem;
        border-top: 1px solid #2a2e36; color: #aab4c3; font-size: .85rem; }
      /* The setup page: what the host read of its config. */
      .setup-page h2 { margin: 1.25rem 0 .4rem; font-size: .8rem; color: #8b93a1;
        text-transform: uppercase; letter-spacing: .04em; }
      .setup-page h3 { margin: .75rem 0 .25rem; font-size: .8rem; color: #aab4c3; }
      .setup-page p, .setup-page li, .setup-page dd { color: #c9d1dc; font-size: .85rem; }
      .setup-page ul { margin: 0; padding-left: 1.1rem; }
      .setup-page dl { margin: 0; }
      .setup-page dl > div { display: grid; grid-template-columns: 11rem 1fr; gap: .5rem;
        padding: .15rem 0; }
      .setup-page dt { color: #8b93a1; font-size: .8rem; overflow-wrap: anywhere; }
      .setup-page dd { margin: 0; overflow-wrap: anywhere; }
      .setup-page dd span { color: #8b93a1; font-size: .75rem; }
      .setup-model[data-none="true"], .setup-refusals li { color: #e0b15c; }
      .setup-hint { color: #8b93a1; }
      .composer-setup { color: #e0b15c; font-size: .8rem; }

      /* The sidebar folded (ADR-0088), after the rules these refine: your pip
         on an icon's corner, and the footer's corner holding only your
         avatar, which carries the inbox's badge (ADR-0098). */
      .open-icon .signal[data-signal="unsent"] { position: absolute; top: auto; bottom: -2px; right: -2px; }
      :root[data-list="icons"] .footer-you { justify-content: center; padding: 0; }
      :root[data-list="icons"] .footer-you .account { flex: none; }
      :root[data-list="icons"] .me-trigger { padding: .2rem; }

      /* A search of the root you are on (ADR-0101). The bar lies across the
         workspace's top, its 🔍 over the rail where it sat, in a tint and a
         shadow of its own: what is under it is not the threads. */
      .search-lead { display: flex; justify-content: center; align-items: center;
        min-width: 3rem; padding: .3rem .25rem; }
      .search-toggle { padding: .1rem .3rem; border: 1px solid transparent; border-radius: 4px;
        background: none; color: #aaa; font-size: .85rem; line-height: 1.2; cursor: pointer; }
      .search-toggle:hover { border-color: #3a4250; }
      .search-toggle[aria-pressed="true"] { background: #2b3546; border-color: #4f5d75; color: #fff; }
      .search-bar { position: relative; z-index: 4; flex: 0 0 auto; display: flex; align-items: center; gap: .6rem;
        padding-right: .75rem; background: #1b2433; border-bottom: 1px solid #2f3c52;
        box-shadow: 0 2px 10px rgb(0 0 0 / .5); font-size: .85rem; color: #ccd;
        animation: search-in .14s ease-out; }
      .search-box { position: relative; display: flex; align-items: center; flex: 0 1 24rem; }
      .search-field { flex: 1; min-width: 0; padding: .3rem 1.8rem .3rem .5rem; border: 1px solid #3a4760;
        border-radius: 4px; background: #10151e; color: #eee; font: inherit; }
      .search-clear { position: absolute; right: .25rem; padding: 0 .25rem; border: 0;
        background: none; color: #9aa3b5; cursor: pointer; font-size: .85rem; }
      .search-line { flex: 1; min-width: 0; color: #9aa3b5; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; }
      .search-done { padding: .2rem .7rem; border: 1px solid #4f5d75; border-radius: 4px;
        background: #2b3546; color: #fff; font: inherit; cursor: pointer; }
      @keyframes search-in { from { transform: translateY(-100%); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .search-bar { animation: none; } }
      /* While a search finds something, the rail dims what it does not find,
         rings what it does, and hides the columns' views, which are covered. */
      .rail[data-searching] [data-match="0"], .rail[data-searching] svg path { opacity: .25; }
      .rail[data-searching] [data-match]:not([data-match="0"]) { outline: 2px solid #f2c94c;
        outline-offset: 1px; }
      .rail[data-searching] .rail-view, .rail[data-searching] .rail-tick { display: none; }
      /* A column under a search: its thread stays, covered and inert, and its
         matches are laid over it (S126). Only .column-content must stay
         unpositioned (above); .column-below is the messages' offsetParent. */
      .column-below { position: relative; flex: 1; min-height: 0; display: flex;
        flex-direction: column; }
      .column-under { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .match-list { position: absolute; inset: 0; z-index: 3; overflow-y: auto; display: flex;
        flex-direction: column; gap: .35rem; padding: .6rem .75rem; background: #171b22; }
      .match-row { display: flex; flex-direction: column; gap: .15rem; padding: .4rem .55rem;
        border: 1px solid #2a313c; border-left: 3px solid var(--track, #777); border-radius: 4px;
        background: #1d222b; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .match-row:hover, .match-row:focus-visible { border-color: var(--track, #777); }
      .match-head { display: flex; gap: .5rem; font-size: .75rem; color: #8a93a3; }
      .match-who { color: #ddd; font-weight: 600; }
      .match-ask { font-size: .75rem; color: #8a93a3; }
      .match-text { font-size: .85rem; line-height: 1.4; overflow-wrap: anywhere; }
      .match-text mark { padding: 0 1px; border-radius: 2px; background: #f2c94c; color: #111; }
      .match-gap { padding: .15rem 0; color: #6f7784; font-size: .75rem; text-align: center; }
      .match-none { margin: .25rem 0; color: #6f7784; }
      .match-count { color: #f2c94c; font-size: .75rem; white-space: nowrap; }
      /* Where leaving a search landed: an outline in the column's colour, fading. */
      .msg[data-landed] { animation: landed 1.6s ease-out; }
      @keyframes landed { 0%, 50% { outline: 2px solid var(--track, #777); outline-offset: 2px; }
        100% { outline: 2px solid transparent; outline-offset: 2px; } }
      /* The drag engine's looks (use-drag.ts), last: they draw over a card's own. */
      /* What is dragged only translates: a scaled, rotated or shadowed column
         costs frames on a slow machine. Its header rises instead, leaning with
         the pointer's speed (--lean). */
      #strip > [data-dragging] { position: relative; z-index: 2; background: var(--page); }
      [data-dragging] > [data-column-head], [data-dragging] > .card-head,
      [data-dragging] > [data-drag-task] {
        box-shadow: 0 10px 24px rgb(0 0 0 / .55); transform: rotate(var(--lean, 0deg));
        transition: transform 80ms linear; position: relative; z-index: 1; }
      .card-frame[data-dragging], .card-grid-cell[data-dragging], .thread-card[data-dragging],
      .sidebar-item[data-dragging] { position: relative; z-index: 20; }
      /* A column off the strip is drawn as its card face, under the pointer. */
      .drag-face { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
        width: 16rem; max-height: 4rem; overflow: hidden; margin: -1rem 0 0 -8rem;
        background: #1d2026; border: 1px solid #3a3f48; border-radius: 6px;
        box-shadow: 0 12px 28px rgb(0 0 0 / .55); }
      /* What a drop there would do. */
      [data-drag-verdict="move"] { outline: 2px solid #8ab4f8; outline-offset: -2px; }
      [data-drag-verdict="copy"] { outline: 2px dashed #8ab4f8; outline-offset: -2px; }
      [data-drag-verdict="replace"] { outline: 2px solid #e3b341; outline-offset: -2px; }
      [data-drag-verdict="refused"] { outline: 2px solid #6f7784; outline-offset: -2px; opacity: .6; }
      /* Held over a task in the sidebar, or ▦: a ring fills until it opens. */
      [data-hover-open] { position: relative; }
      [data-hover-open]::after { content: ""; position: absolute; inset: -2px; border-radius: 6px;
        border: 2px solid #8ab4f8; animation: hover-open 600ms linear forwards; pointer-events: none; }
      @keyframes hover-open { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @media (prefers-reduced-motion: reduce) {
        [data-dragging] > [data-column-head], [data-dragging] > .card-head,
        [data-dragging] > [data-drag-task] { transform: none; transition: none; }
        [data-hover-open]::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
